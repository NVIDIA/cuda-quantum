# RUN: %cudaq-target-db-gen -o %t.db.cpp v2-physical=%s
# RUN: FileCheck %s --input-file=%t.db.cpp

# Test that `cudaq-target-db-gen` parses `physical-quake` correctly.

version: 2
name: v2-physical
description: "Physical profile options round trip"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: physical-quake
        options:
          basis-gates: ["h", "s", "t", "rx", "ry", "rz", "x", "y", "z", "x(1)"]
          measurements: expanded
          reset-before-reuse: true
      lowering:
        custom-pipeline: "canonicalize"
  codegen: nop

# CHECK: kBuiltinTarget_v2_physical
# CHECK: .irOutputProfile = cudaq::config::Profile{std::in_place_type<cudaq::config::PhysicalQuakeProfile>, cudaq::config::PhysicalQuakeProfile{.basisGates = {"h", "s", "t", "rx", "ry", "rz", "x", "y", "z", "x(1)", }, .measurements = cudaq::config::MeasurementForm::expanded, .resetBeforeReuse = true}
# CHECK: .lowering = cudaq::config::CustomPipelineLowering{.overridePassPipeline = "canonicalize"
