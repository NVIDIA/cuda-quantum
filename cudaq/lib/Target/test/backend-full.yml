# RUN: %target-catalog-driver parse %s | FileCheck %s --check-prefix=PARSE
# RUN: %target-catalog-driver emit %s | FileCheck %s --check-prefix=EMIT --implicit-check-not=raw-pass-text --implicit-check-not=RESOURCE_COUNT --implicit-check-not={{^GEN_TARGET_BACKEND=}} --implicit-check-not={{^LIBRARY_MODE=}}
#
# Explicitly-false gen-target-backend/library-mode emit nothing at all (nvq++
# already defaults both to false); only `true` is emitted.
# RUN: %target-catalog-driver codegen %s | FileCheck %s --check-prefix=CODEGEN
#
# The simulator emission pins kSharedLibraryExtension output (.so).
# REQUIRES: system-linux

version: 1
name: lit-full
description: "Full backend field and shell-emission coverage"
config:
  gen-target-backend: false
  library-mode: false
  support-resource-counts: false
  jit-high-level-pipeline: "high-pipe"
  jit-mid-level-pipeline: "mid-pipe"
  jit-low-level-pipeline: "low-pipe"
  target-pass-pipeline: "raw-pass-text"
  codegen-emission: qir-full
  post-codegen-passes: "post-passes"
  platform-library: "libacme-platform"
  library-mode-execution-manager: "acme-manager"
  platform-qpu: acme_qpu
  preprocessor-defines: ["-D ACME"]
  compiler-flags: ["-fno-exceptions"]
  link-libs: ["-lacme"]
  plugin-libraries: ["libacme-qpu"]
  linker-flags: ["-Wl,-rpath,/opt/acme"]
  nvqir-simulation-backend: first, second, third
  rules:
    - if: "$ENABLE_A"
      compiler-flag: "-O1"
      link-flag: "-la"
    - if: "$ENABLE_B"
      link-flag: "-lb"

