# RUN: %target-catalog-driver parse %s | FileCheck %s --check-prefix=PARSE
# RUN: %target-catalog-driver emit %s | FileCheck %s --check-prefix=DEFAULT
# RUN: %target-catalog-driver emit %s option=fp64 | FileCheck %s --check-prefix=FP64

# Configuration-matrix selection: default entry, plus explicit flag selection.

version: 1
name: lit-matrix
description: "Configuration-matrix selection coverage"
target-arguments:
  - key: option
    type: option-flags
    help-string: "Select the precision"
configuration-matrix:
  - name: fp32-config
    option-flags: [fp32]
    default: true
    config:
      nvqir-simulation-backend: qpp-fp32
  - name: fp64-config
    option-flags: [fp64]
    config:
      nvqir-simulation-backend: qpp-fp64

# PARSE: argument: option type=option-flags required=false platform-arg=-
# PARSE: matrix-entry: fp32-config flags=1 default=true
# PARSE: matrix-entry: fp64-config flags=2 default=false
# DEFAULT: NVQIR_SIMULATION_BACKEND="qpp-fp32"
# FP64: NVQIR_SIMULATION_BACKEND="qpp-fp64"
