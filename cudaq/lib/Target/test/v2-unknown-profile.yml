# RUN: not %target-catalog-driver parse %s 2>&1 | FileCheck %s

# Only the `explicit-pipeline` IR profile exists so far; unknown profiles are
# rejected with the list of allowed tags.

version: 2
name: lit-v2-unknown-profile
description: "Unknown IR profile rejection coverage"
config:
  library-mode: false

compile-target:
  stages:
    - ir-profile: quake-value-semantics
      loop-support: only-for-loops
  codegen: nop

# CHECK: error: Failed to parse target configuration YAML
# CHECK: could not match ir-profile 'quake-value-semantics'
# CHECK: The following tags are allowed: explicit-pipeline
