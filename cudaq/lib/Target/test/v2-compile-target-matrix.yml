# RUN: %target-catalog-driver parse %s | FileCheck %s

# A version 2 target with only a configuration matrix declares one compile
# target. `config` and every matrix entry get its stage.

version: 2-alpha
name: v2-compile-target-matrix
description: "One compile target shared by configuration-matrix entries"
target-arguments:
  - key: option
    type: option-flags

configuration-matrix:
  - name: fp32-config
    option-flags: [fp32]
    default: true
    config:
      nvqir-simulation-backend: qpp-fp32
  - name: fp64-config
    option-flags: [fp64]
    config:
      nvqir-simulation-backend: qpp-fp64

compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          cost-model: gate-count

# CHECK:      config:
# CHECK:        stage: ir-output-profile=quake-unmapped lowering=inferred
# CHECK:          cost-model: gate-count
# CHECK:      matrix-entry: fp32-config
# CHECK:        stage: ir-output-profile=quake-unmapped lowering=inferred
# CHECK:          cost-model: gate-count
# CHECK:      matrix-entry: fp64-config
# CHECK:        stage: ir-output-profile=quake-unmapped lowering=inferred
# CHECK:          cost-model: gate-count
