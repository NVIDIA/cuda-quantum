# RUN: %cudaq-target-db-gen -o %t.db.cpp v2-physical=%S/v2-physical-profile.yml
# RUN: FileCheck %s --input-file=%t.db.cpp
# RUN: sed -e 's/measurements: expanded/measurements: any/' -e 's/reset-before-reuse: true/reset-before-reuse: false/' %s > %t.any.yml
# RUN: %cudaq-target-db-gen -o %t.any.db.cpp v2-phys-any=%t.any.yml
# RUN: FileCheck %s --input-file=%t.any.db.cpp --check-prefix=ANY

# The `physical-quake` profile carries its declared options into the canonical
# model unchanged, including the basis-conversion grammar spelling `x(1)`.

version: 2
name: v2-physical
description: "Physical profile options round trip"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: physical-quake
        options:
          basis-gates: ["h", "s", "t", "rx", "ry", "rz", "x", "y", "z", "x(1)"]
          measurements: expanded
          reset-before-reuse: true
      lowering:
        custom-pipeline: "canonicalize"
  codegen: nop

# CHECK: kBuiltinTarget_v2_physical
# CHECK: .irOutputProfile = cudaq::config::Profile{std::in_place_type<cudaq::config::PhysicalQuakeProfile>, cudaq::config::PhysicalQuakeProfile{.basisGates = {"h", "s", "t", "rx", "ry", "rz", "x", "y", "z", "x(1)", }, .measurements = cudaq::config::MeasurementForm::expanded, .resetBeforeReuse = true}
# CHECK: .lowering = cudaq::config::CustomPipelineLowering{.overridePassPipeline = "canonicalize"

# Same profile with the explicit defaults spelled out: both measurement
# values parse and map to their enumerators.
# ANY: .measurements = cudaq::config::MeasurementForm::any
# ANY: .resetBeforeReuse = false
