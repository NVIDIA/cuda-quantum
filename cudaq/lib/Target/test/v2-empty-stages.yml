# RUN: not %target-catalog-driver parse %s 2>&1 | FileCheck %s

# An empty `stages` list is accepted, but the key itself remains required:
# omitting it is a schema error.

version: 2
name: lit-v2-empty-stages
description: "Missing compile-target stages key rejected"
config:
  library-mode: false

compile-target:
  codegen: nop

# CHECK: error: Failed to parse target configuration YAML
# CHECK: Field named 'stages' not found
