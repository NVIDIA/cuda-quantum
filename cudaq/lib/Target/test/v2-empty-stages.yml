# RUN: not %target-catalog-driver parse %s 2>&1 | FileCheck %s

# A `compile-target` must currently declare exactly one stage.

version: 2
name: lit-v2-empty-stages
description: "Empty compile-target stages rejected"
config:
  library-mode: false

compile-target:
  stages: []
  codegen: nop

