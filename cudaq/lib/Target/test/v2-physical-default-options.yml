# RUN: %target-catalog-driver parse %s | FileCheck %s

# Test YAML parsing of `physical-quake` with omitted default options.

version: 2
name: v2-phys-default-options
description: "Physical profile option defaults"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: physical-quake
      lowering:
        custom-pipeline: "canonicalize"
  codegen: nop

# CHECK: name: v2-phys-default-options
# CHECK:   ir-output-profile=physical-quake
# CHECK-NEXT:     measurement-type: any
# CHECK-NEXT:     reset-after-measure: false
