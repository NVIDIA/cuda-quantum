# RUN: %cudaq-target-db-gen -o %t.db.cpp v2-multi=%s
# RUN: FileCheck %s --input-file=%t.db.cpp

# Test `cudaq-target-db-gen` for multi-stage compile targets.

version: 2
name: v2-multi
description: "Multiple compile-target stages round trip"
config:
  gen-target-backend: true
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: unchecked
      lowering:
        custom-pipeline: "func.func(canonicalize)"
    - ir-output-profile:
        name: quake-reference-semantics
        options:
          basis-gates: ["h", "s", "rz"]
          measurement-type: any
  codegen: qir-base

# CHECK: kBuiltinTarget_v2_multi
# CHECK: .stages = {cudaq::config::CompilationStage{.irOutputProfile = cudaq::config::Profile{std::in_place_type<cudaq::config::UncheckedProfile>}, .lowering = cudaq::config::CustomPipelineLowering{.overridePassPipeline = "func.func(canonicalize)"
# CHECK: cudaq::config::CompilationStage{.irOutputProfile = cudaq::config::Profile{std::in_place_type<cudaq::config::QuakeReferenceSemanticsProfile>, cudaq::config::QuakeReferenceSemanticsProfile{.basisGates = {"h", "s", "rz", }, .measurementType = cudaq::config::MeasurementForm::any, .resetAfterMeasure = false}
# CHECK: .lowering = cudaq::config::InferredLowering{}}, }
# CHECK: .codegen = cudaq::config::Codegen{.emissionFormat = "qir-base"
