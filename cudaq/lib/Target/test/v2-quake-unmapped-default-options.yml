# RUN: %target-catalog-driver parse %s | FileCheck %s

# Test that omitted `quake-unmapped` options and a null `cost-model` take the
# profile's defaults, and that the test driver prints the YAML form.

version: 2-alpha
name: v2-quake-unmapped-default-options
description: "Quake unmapped profile option defaults"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
    - ir-output-profile:
        name: quake-unmapped
        options:
          cost-model: null

# CHECK:      ir-output-profile=quake-unmapped lowering=inferred
# CHECK-NEXT:   options:
# CHECK-NEXT:     basis-gates: []
# CHECK-NEXT:     approximation-tolerance: 0
# CHECK-NEXT: stage: ir-output-profile=quake-unmapped lowering=inferred
# CHECK-NEXT:   options:
# CHECK-NEXT:     basis-gates: []
# CHECK-NEXT:     approximation-tolerance: 0
# CHECK-NOT:  cost-model
