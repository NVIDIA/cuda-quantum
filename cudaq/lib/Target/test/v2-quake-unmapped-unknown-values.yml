# RUN: not %target-catalog-driver parse %s 2>&1 | FileCheck %s

# An `unroll-loops` value outside the declared names is rejected, and the
# error lists the names that are allowed.

version: 2-alpha
name: v2-quake-unmapped-unknown-values
description: "Unknown quake-unmapped option values rejected"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          unroll-loops: index

# CHECK: error: Failed to parse target configuration YAML
# CHECK: unknown value 'index' (allowed: all, index-use)
