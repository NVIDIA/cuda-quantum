# RUN: %target-catalog-driver parse %s | FileCheck %s --check-prefix=PARSE

# Test YAML parsing for a compilation stage with an IR profile and implicit inferred lowering.

version: 2-alpha
name: lit-v2-inferred
description: "Inferred lowering through the catalog driver"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: quake-reference-semantics
        options:
          basis-gates: ["h", "rz", "x(1)"]
          measurement-type: single-qubit
          reset-after-measure: true
  codegen: qir-adaptive

# PARSE: name: lit-v2-inferred
# PARSE:   stage: ir-output-profile=quake-reference-semantics lowering=inferred
# PARSE-NEXT:     options:
# PARSE-NEXT:       basis-gates: ["h", "rz", "x(1)"]
# PARSE-NEXT:       measurement-type: single-qubit
# PARSE-NEXT:       reset-after-measure: true
# PARSE:   codegen-emission: qir-adaptive
