# RUN: not %target-catalog-driver parse %s 2>&1 | FileCheck %s

# Profile options beyond the declared set are rejected.

version: 2
name: v2-phys-unknown-option
description: "Unknown profile option rejected"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: physical-quake
        options:
          topology: star
      lowering:
        custom-pipeline: "canonicalize"
  codegen: nop

# CHECK: error: Failed to parse target configuration YAML
# CHECK: topology
