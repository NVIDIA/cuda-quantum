# RUN: %target-catalog-driver parse %s | FileCheck %s

# Test YAML parsing of `quake-reference-semantics`.

version: 2-alpha
name: v2-quake-reference-semantics-all-options
description: "All quake reference-semantics profile options parsed"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: quake-reference-semantics
        options:
          basis-gates: ["h", "rz", "x(1)"]
          measurement-type: single-qubit
          reset-after-measure: true
      lowering:
        custom-pipeline: "canonicalize"
  codegen: nop

# CHECK: name: v2-quake-reference-semantics-all-options
# CHECK:   ir-output-profile=quake-reference-semantics
# CHECK-NEXT:     basis-gates: ["h", "rz", "x(1)"]
# CHECK-NEXT:     measurement-type: single-qubit
# CHECK-NEXT:     reset-after-measure: true
