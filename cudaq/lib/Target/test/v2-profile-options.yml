# RUN: not %target-catalog-driver parse %s 2>&1 | FileCheck %s

# The `unchecked` profile takes no options; extra fields are rejected.

version: 2-alpha
name: lit-v2-profile-options
description: "Profile options rejected on the unchecked profile"
config:
  library-mode: false

compile-target:
  stages:
    - ir-output-profile:
        name: unchecked
        options:
          basis-gates: ["cx", "h", "rz"]
      lowering:
        custom-pipeline: "canonicalize"
  codegen: nop

# CHECK: error: Failed to parse target configuration YAML
