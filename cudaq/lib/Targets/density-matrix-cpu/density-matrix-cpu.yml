version: 2-alpha
name: density-matrix-cpu
description: "The Density Matrix CPU Target provides a simulated QPU via OpenMP-enabled, CPU-only density matrix emulation."
config:
  nvqir-simulation-backend: dm
  preprocessor-defines: ["-D CUDAQ_SIMULATION_SCALAR_FP64"]

compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          cost-model: gate-count
          max-unroll-iterations: 50 # The current `cc-loop-unroll` default.
