version: 2-alpha
name: qpp-cpu
description: "QPP-based CPU-only backend target"
config:
  nvqir-simulation-backend: qpp
  preprocessor-defines: ["-D CUDAQ_SIMULATION_SCALAR_FP64"]

compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          cost-model: gate-count
          max-unroll-iterations: 50 # The current `cc-loop-unroll` default.
