name: Check changed paths
description: |
  Check whether the change under test touches any of the given path prefixes.
  Replaces trigger-level `paths:` filters, which see the push's before..after
  diff (polluted by copy-pr-bot rebases) and are unsupported on merge_group
  events. Diffs the PR against its merge base (push) or the merge group
  against its base (merge_group). Fails open on errors or truncated lists.
  Requires `gh` and a token with contents:read and pull-requests:read.
inputs:
  paths:
    description: >-
      Newline-separated list of path prefixes to match against changed files.
      An empty list matches every path.
    required: false
    default: ''
  paths-ignore:
    description: >-
      Newline-separated list of path prefixes to exclude before matching.
    required: false
    default: ''
  paths-ignore-file:
    description: >-
      Repository-relative file containing additional path prefixes to exclude,
      one per line. Blank lines and lines beginning with # are ignored.
    required: false
    default: ''
  token:
    description: Token used for GitHub API queries.
    required: false
    default: ${{ github.token }}
outputs:
  matched:
    description: "'true' if any changed file starts with one of the given prefixes, otherwise 'false'"
    value: ${{ steps.check.outputs.matched }}
runs:
  using: composite
  steps:
    - name: Compare changed files against path prefixes
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PATH_PREFIXES: ${{ inputs.paths }}
        PATH_IGNORES: ${{ inputs.paths-ignore }}
        PATH_IGNORES_FILE: ${{ inputs.paths-ignore-file }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
      run: |
        matched=""
        files=""
        case "$EVENT_NAME" in
          push)
            if [[ "$REF_NAME" =~ ^pull-request/([0-9]+)$ ]]; then
              pr="${BASH_REMATCH[1]}"
              # Diff the PR against its merge base, not the push range.
              if files=$(gh api --paginate "repos/${REPO}/pulls/${pr}/files?per_page=100" --jq '.[].filename'); then
                # The API stops listing files at 3000; treat that as truncated.
                if [ "$(grep -c . <<< "$files")" -ge 3000 ]; then matched=true; fi
              else
                matched=true
              fi
            else
              # Direct push to a non-PR branch: run everything.
              matched=true
            fi
            ;;
          pull_request|pull_request_target)
            if files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename'); then
              # The API stops listing files at 3000; treat that as truncated.
              if [ "$(grep -c . <<< "$files")" -ge 3000 ]; then matched=true; fi
            else
              matched=true
            fi
            ;;
          merge_group)
            # Diff the merge group against the target branch it was built on.
            if files=$(gh api "repos/${REPO}/compare/${MERGE_GROUP_BASE}...${MERGE_GROUP_HEAD}" --jq '.files[].filename'); then
              # The compare API lists at most 300 files; treat a full list as truncated.
              if [ "$(grep -c . <<< "$files")" -ge 300 ]; then matched=true; fi
            else
              matched=true
            fi
            ;;
          *)
            # workflow_dispatch, schedule, etc.: run everything.
            matched=true
            ;;
        esac
        if [ -z "$matched" ]; then
          matched=false
          readarray -t prefixes <<< "$PATH_PREFIXES"
          readarray -t ignores <<< "$PATH_IGNORES"
          if [ -n "$PATH_IGNORES_FILE" ]; then
            if [ -f "$PATH_IGNORES_FILE" ]; then
              file_ignores=()
              readarray -t file_ignores < <(
                sed -e 's/#.*$//' \
                    -e 's/^[[:space:]]*//' \
                    -e 's/[[:space:]]*$//' \
                    -e '/^$/d' \
                    "$PATH_IGNORES_FILE"
              )
              ignores+=("${file_ignores[@]}")
            else
              echo "::warning::Path-ignore file not found: $PATH_IGNORES_FILE; running full CI"
              matched=true
            fi
          fi
          if [ "$matched" != true ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ -n "$PATH_IGNORES_FILE" ] &&
                 [ "$file" = "$PATH_IGNORES_FILE" ]; then
                echo "Matched path-ignore registry change: $file"
                matched=true
                break
              fi
              ignored=false
              for prefix in "${ignores[@]}"; do
                [ -z "$prefix" ] && continue
                if [[ "$file" == "$prefix"* ]]; then
                  ignored=true
                  break
                fi
              done
              $ignored && continue

              # With no positive prefixes, match every path not excluded above.
              if [ -z "$PATH_PREFIXES" ]; then
                matched=true
                break
              fi
              for prefix in "${prefixes[@]}"; do
                [ -z "$prefix" ] && continue
                if [[ "$file" == "$prefix"* ]]; then
                  echo "Matched changed file: $file (prefix: $prefix)"
                  matched=true
                  break 2
                fi
              done
            done <<< "$files"
          fi
        fi
        echo "matched=$matched" >> "$GITHUB_OUTPUT"
        echo "check-changed-paths: event=$EVENT_NAME matched=$matched"
