name: Compute CUDA-Q version
description: |
  Infer cudaq_version from the Git ref (tag, releases/*, or staging/*).
  Unversioned refs use 0.0.0 with the short git SHA appended.
  An explicit release_version takes precedence over both.
  Infer cudaq_logical_version from cudaq-logical/v* tags using setuptools-scm.
  Read cudaq_edem_version from edem/CMakeLists.txt, which also versions the
  cudaq-edem wheels.
inputs:
  ref_name:
    description: Git ref name to extract the version from.
    required: false
    default: ${{ github.ref_name }}
  ref_type:
    description: Git ref type (branch or tag).
    required: false
    default: ${{ github.ref_type }}
  release_version:
    description: Release version that overrides the ref's.
    required: false
    default: ''
outputs:
  cudaq_version:
    description: The inferred CUDA-Q version.
    value: ${{ steps.compute.outputs.cudaq_version }}
  cudaq_logical_version:
    description: The setuptools-scm-derived CUDA-Q Logical version.
    value: ${{ steps.compute-logical.outputs.cudaq_logical_version }}
  cudaq_edem_version:
    description: The cudaq-edem version, as set in edem/CMakeLists.txt.
    value: ${{ steps.compute-edem.outputs.cudaq_edem_version }}
runs:
  using: composite
  steps:
    - name: Compute version
      id: compute
      shell: bash
      env:
        REF_NAME: ${{ inputs.ref_name }}
        REF_TYPE: ${{ inputs.ref_type }}
        RELEASE_VERSION: ${{ inputs.release_version }}
      run: |
        is_versioned=false
        if [[ "$REF_TYPE" == "tag" ]] || [[ "$REF_NAME" == releases/* ]] || [[ "$REF_NAME" == staging/* ]]; then
          is_versioned=true
        fi

        if [[ -n "$RELEASE_VERSION" ]]; then
          cudaq_version="$RELEASE_VERSION"
        elif $is_versioned; then
          cudaq_version=$(echo "$REF_NAME" | egrep -o "([0-9]{1,}\.)+[0-9]{1,}" || true)
        else
          cudaq_version="0.0.0+${GITHUB_SHA:0:12}"
        fi

        echo "cudaq_version=$cudaq_version" >> "$GITHUB_OUTPUT"
        echo "CUDA-Q version: $cudaq_version"

    - name: Compute CUDA-Q Logical version
      id: compute-logical
      shell: bash
      run: |
        set -euo pipefail
        retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
        if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
          echo "::error::Computing the CUDA-Q Logical version requires a full Git history. Set fetch-depth: 0 on actions/checkout."
          exit 1
        fi

        venv="$(mktemp -d)/venv"
        python3 -m venv "$venv"
        retry "$venv/bin/python" -m pip install --quiet "setuptools-scm>=8,<9"
        cudaq_logical_scmversion="$(
          "$venv/bin/python" -m setuptools_scm \
            -c preview/logical/python/pyproject.toml
        )"

        cudaq_logical_version=$(echo ${cudaq_logical_scmversion} | egrep -o "([0-9]{1,}\.)+[0-9]{1,}")
        echo "cudaq_logical_version=$cudaq_logical_version" >> "$GITHUB_OUTPUT"
        echo "CUDA-Q Logical version: $cudaq_logical_version"

    - name: Compute CUDA-Q EDEM version
      id: compute-edem
      shell: bash
      run: |
        set -euo pipefail
        # Same pattern that pyproject.toml.edem uses to version the wheels.
        cudaq_edem_version="$(sed -nE 's/^set\(CUDAQ_EDEM_VERSION ([0-9]+\.[0-9]+\.[0-9]+)\)$/\1/p' edem/CMakeLists.txt)"
        if [[ ! "$cudaq_edem_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Could not read CUDAQ_EDEM_VERSION from edem/CMakeLists.txt."
          exit 1
        fi
        echo "cudaq_edem_version=$cudaq_edem_version" >> "$GITHUB_OUTPUT"
        echo "CUDA-Q EDEM version: $cudaq_edem_version"
