#
# Workflow: diff apt and pip packages between a base and target image, then
# build a source image containing source code for all added packages.
# Diffs the pip packages added by the macOS wheel: artifact_url if given, else the
# python 3.13 wheels of the latest successful Deployments run on main.
#
# Three image legs are diffed, each against the image it is built FROM:
#   cudaq          nvcr.io/nvidia/cuda runtime      -> nightly cuda-quantum
#   cudaqx         nightly cuda-quantum             -> ghcr.io/nvidia/cudaqx
#   cudaq-decoding nvcr.io/nvidia/cuda base         -> ghcr.io/nvidia/private/cudaq-decoding
# A package is added when the target has it at a version the base does not:
# new packages, their auto-installed dependencies and packages the build
# upgraded. The cudaqx and cudaq-decoding lists are trimmed against cudaq
# (by source package and version, and by pip name==version) before fetching so
# shared packages are only downloaded once.
#
# Besides apt, pip and the tpls submodules, the image gets the sources of the
# software the CUDA-Q images build from source or copy in (see
# scripts/generate_image_sources_lock.py) and the DOCA/OFED source bundle.
# The build fails when a package has no source and is not on
# docker/build/package_sources_proprietary.txt.
#
# The scheduled run builds the source image for the nightly cuda-quantum image
# and also pushes it to NGC as nightly/cuda-quantum:cu<major>-latest-src.
#
# Inputs:
#   push_to_ngc: boolean, default false
#     Also push the source image to NGC; it is always pushed to GHCR. The job
#     then runs in the ghcr-deployment environment, which holds the NGC key.
#   artifact_url: string, default: the latest macOS 3.13 wheels from main
#     If set, diff pip packages added by the macOS wheel from this artifact URL
#     (e.g. .../actions/runs/RUN_ID/artifacts/ARTIFACT_ID for pycudaq-3.13-darwin-arm64).
#   python_version: string, default 3.13
#     Python version for the macOS diff (must match the wheel).

on:
  workflow_dispatch:
    inputs:
      push_to_ngc:
        required: false
        type: boolean
        default: false
        description: 'Also push the source image to nvcr.io/nvidia/nightly/cuda-quantum (tag cu<major>-latest-src)'
      artifact_url:
        required: false
        type: string
        description: 'Optional: URL of the macOS wheel artifact to diff (e.g. .../runs/RUN_ID/artifacts/ARTIFACT_ID); default: the python 3.13 wheels of the latest successful Deployments run on main'
      python_version:
        required: false
        type: string
        default: '3.13'
        description: 'Python version for macOS diff (must match the wheel)'
  schedule:
    # After the day's merges have refreshed the nightly cuda-quantum image.
    - cron: "0 18 * * *"

name: Build package sources

jobs:
  diff-packages-cudaq:
    name: Diff apt/pip packages ${{ matrix.release }} (CUDA ${{ matrix.cuda }})
    # Forks have neither the NGC key nor the runners.
    if: github.event_name != 'schedule' || github.repository == 'NVIDIA/cuda-quantum'
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.images.outputs.base_image }}
      target_image: ${{ steps.images.outputs.target_image }}
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12.6', '13.0']
        release: ['cudaq', 'cudaqx', 'cudaq-decoding']
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image names
        id: images
        run: |
          cuda_major=$(echo "${{ matrix.cuda }}" | cut -d. -f1)
          case "${{ matrix.release }}" in
            cudaq)
              echo "base_image=nvcr.io/nvidia/cuda:${{ matrix.cuda }}.0-runtime-ubuntu24.04" | tee -a $GITHUB_OUTPUT
              echo "target_image=nvcr.io/nvidia/nightly/cuda-quantum:cu${cuda_major}-latest" | tee -a $GITHUB_OUTPUT
              ;;
            cudaqx)
              # cudaqx: docker/release/Dockerfile overlays onto the nightly cuda-quantum image.
              echo "base_image=nvcr.io/nvidia/nightly/cuda-quantum:cu${cuda_major}-latest" | tee -a $GITHUB_OUTPUT
              echo "target_image=ghcr.io/nvidia/cudaqx:cu${cuda_major}-latest" | tee -a $GITHUB_OUTPUT
              ;;
            cudaq-decoding)
              # Runtime stage of docker/release/Dockerfile.decoding-server in cudaqx starts
              # from the CUDA base image (cuda_base_image_tag in build_decoding_server_docker.yaml).
              echo "base_image=nvcr.io/nvidia/cuda:${{ matrix.cuda }}.3-base-ubuntu24.04" | tee -a $GITHUB_OUTPUT
              echo "target_image=ghcr.io/nvidia/private/cudaq-decoding:cu${cuda_major}-latest" | tee -a $GITHUB_OUTPUT
              ;;
          esac

      - name: Log in to container registries
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true
          echo "${{ secrets.DOCKERHUB_READONLY_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin 2>/dev/null || true

      - name: Pull images
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          retry docker pull "${{ steps.images.outputs.base_image }}"
          retry docker pull "${{ steps.images.outputs.target_image }}"

      - name: Diff package lists
        run: |
          chmod +x scripts/diff_image_packages.sh
          ./scripts/diff_image_packages.sh \
            "${{ steps.images.outputs.base_image }}" \
            "${{ steps.images.outputs.target_image }}" \
            package-source-diff

      - name: Package diff step summary
        run: |
          echo "## Diffed packages (${{ steps.images.outputs.base_image }} vs ${{ steps.images.outputs.target_image }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Apt packages added" >> $GITHUB_STEP_SUMMARY
          if [ -s package-source-diff/apt_packages.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat package-source-diff/apt_packages.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_None_" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pip packages added" >> $GITHUB_STEP_SUMMARY
          if [ -s package-source-diff/pip_packages.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat package-source-diff/pip_packages.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "_None_" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload package lists
        uses: actions/upload-artifact@v7
        with:
          name: package-source-diff-cu${{ matrix.cuda }}-${{ matrix.release }}.zip
          path: package-source-diff/
          retention-days: 1

  # Without an artifact_url (the scheduled run), use the macOS wheels of the
  # latest successful Deployments run on main that still has them.
  find-macos-artifact:
    name: Find the latest macOS wheel artifact
    if: (github.event_name == 'schedule' || inputs.artifact_url == '') && github.repository == 'NVIDIA/cuda-quantum'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_url: ${{ steps.find.outputs.artifact_url }}

    steps:
      - name: Find the artifact
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          runs=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deployments.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=30" --jq '.workflow_runs[].id')
          for run_id in $runs; do
            artifact_id=$(retry gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=pycudaq-3.13-darwin-arm64" \
              --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
            if [ -n "$artifact_id" ]; then
              echo "artifact_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts/${artifact_id}" | tee -a $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "::error::No successful Deployments run on main has an unexpired macOS wheel artifact."
          exit 1

  diff-macos-package:
    name: Diff pip packages (macOS arm64)
    needs: find-macos-artifact
    if: always() && (inputs.artifact_url != '' || needs.find-macos-artifact.outputs.artifact_url != '')
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Parse artifact URL
        id: parse
        run: |
          url="${{ inputs.artifact_url || needs.find-macos-artifact.outputs.artifact_url }}"
          run_id=$(echo "$url" | sed -n 's|.*/runs/\([0-9]*\)/.*|\1|p')
          artifact_id=$(echo "$url" | sed -n 's|.*/artifacts/\([0-9]*\)$|\1|p')
          if [ -z "$run_id" ] || [ -z "$artifact_id" ]; then
            echo "Could not parse run_id and artifact_id from: $url"
            exit 1
          fi
          echo "run_id=$run_id" >> $GITHUB_OUTPUT
          echo "artifact_id=$artifact_id" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python_version || '3.13' }}

      - name: Capture pip packages (before)
        run: |
          pip list --format=freeze | grep -v '^#' | sort -u > pip_before.txt
          echo "Packages before: $(wc -l < pip_before.txt)"

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ steps.parse.outputs.run_id }}
          artifact-ids: ${{ steps.parse.outputs.artifact_id }}
          path: wheel/
          github-token: ${{ github.token }}

      - name: Install wheels
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # An unmatched glob must produce an empty array, not a literal pattern,
          # so the check below detects an artifact with no wheels.
          shopt -s nullglob
          wheels=(wheel/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "No .whl file found under wheel/"
            find wheel -type f
            exit 1
          fi
          # Install core and frontend together so their exact-version dependency
          # is resolved from this artifact, without requiring a PyPI release.
          retry pip install "${wheels[@]}"
          # Exclude our wheels from the third-party dependency diff. Wheel names
          # follow PEP 427: distribution-version-...; pip uses dashes in names.
          for whl in "${wheels[@]}"; do
            basename "$whl" | cut -d- -f1 | tr '_' '-'
          done > installed_wheel_packages.txt

      - name: Capture pip packages (after)
        run: |
          pip list --format=freeze | grep -v '^#' | sort -u > pip_after.txt
          echo "Packages after: $(wc -l < pip_after.txt)"

      - name: Diff added pip packages
        id: diff
        run: |
          # Added = name==version that was not installed before, so upgraded
          # packages count too. Our own wheels are not third-party.
          while IFS= read -r line; do
            pkg="${line%%==*}"
            if grep -qxF "$pkg" installed_wheel_packages.txt; then
              continue
            fi
            if ! grep -qxF "$line" pip_before.txt; then
              echo "$line"
            fi
          done < pip_after.txt > pip_added.txt || true
          count=$(wc -l < pip_added.txt | tr -d ' ')
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "## Pip packages added by macOS wheel" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Count: **$count**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat pip_added.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Collect license files of the added packages
        run: |
          mkdir -p macos-pip-licenses
          python3 scripts/collect_pip_licenses.py < pip_added.txt | tar -C macos-pip-licenses -xf -

      - name: Upload macOS pip diff artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-pip-diff.zip
          path: |
            pip_added.txt
            pip_before.txt
            pip_after.txt
            macos-pip-licenses/
          retention-days: 7

  build-source-image:
    name: Build source image CUDA ${{ matrix.cuda }}
    needs: [diff-packages-cudaq, find-macos-artifact, diff-macos-package]
    if: >-
      always() && needs.diff-packages-cudaq.result == 'success'
      && (needs.find-macos-artifact.result == 'success' || needs.find-macos-artifact.result == 'skipped')
      && (needs.diff-macos-package.result == 'success' || needs.diff-macos-package.result == 'skipped')
    runs-on: linux-amd64-cpu32
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12.6', '13.0']
    permissions:
      contents: read
      packages: write

    environment:
      name: ${{ (inputs.push_to_ngc || github.event_name == 'schedule') && 'ghcr-deployment' || 'default' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set base image
        id: base-image
        run: |
          echo "base_image=nvcr.io/nvidia/cuda:${{ matrix.cuda }}.0-runtime-ubuntu24.04" >> $GITHUB_OUTPUT
          echo "cuda_major=$(echo "${{ matrix.cuda }}" | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Download package lists (cudaq)
        uses: actions/download-artifact@v8
        with:
          name: package-source-diff-cu${{ matrix.cuda }}-cudaq.zip
          path: package-source-diff-cudaq

      - name: Download package lists (cudaqx)
        uses: actions/download-artifact@v8
        with:
          name: package-source-diff-cu${{ matrix.cuda }}-cudaqx.zip
          path: package-source-diff-cudaqx

      - name: Download package lists (cudaq-decoding)
        uses: actions/download-artifact@v8
        with:
          name: package-source-diff-cu${{ matrix.cuda }}-cudaq-decoding.zip
          path: package-source-diff-cudaq-decoding

      - name: Restore package-source-diff directory layout
        run: |
          d=package-source-diff
          mkdir -p $d
          for variant in cudaq cudaqx cudaq-decoding; do
            dir="package-source-diff-${variant}"
            [ -d "$dir/package-source-diff" ] && dir="$dir/package-source-diff"
            cp "$dir/apt_sources.txt" "$d/apt_sources_${variant}.txt"
            cp "$dir/apt_package_details.tsv" "$d/apt_package_details_${variant}.tsv"
            cp "$dir/pip_packages.txt" "$d/pip_packages_${variant}.txt"
            cp "$dir/images.txt" "$d/images_${variant}.txt"
            # upload-artifact drops empty directories (e.g. an image without Python)
            for kind in apt pip; do
              mkdir -p "$d/${kind}_licenses_${variant}"
              if [ -d "$dir/${kind}_licenses" ]; then cp -r "$dir/${kind}_licenses/." "$d/${kind}_licenses_${variant}/"; fi
            done
          done
          : > $d/pip_packages_macos.txt
          mkdir -p $d/pip_licenses_macos
          ls -la $d/

      - name: Download macOS pip diff
        if: needs.diff-macos-package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: macos-pip-diff.zip
          path: macos-pip-diff

      - name: Apply macOS pip diff to package list
        if: needs.diff-macos-package.result == 'success'
        run: |
          cp macos-pip-diff/pip_added.txt package-source-diff/pip_packages_macos.txt
          if [ -d macos-pip-diff/macos-pip-licenses ]; then cp -r macos-pip-diff/macos-pip-licenses/. package-source-diff/pip_licenses_macos/; fi

      - name: Generate trimmed package lists (cudaqx/cudaq-decoding minus cudaq, macos minus cudaq/cudaqx)
        run: |
          d=package-source-diff
          cp $d/apt_sources_cudaq.txt $d/apt_sources_cudaq_trimmed.txt
          cp $d/apt_package_details_cudaq.tsv $d/apt_package_details_cudaq_trimmed.tsv
          cp $d/pip_packages_cudaq.txt $d/pip_packages_cudaq_trimmed.txt
          for variant in cudaqx cudaq-decoding; do
            # apt: source=version pairs that cudaq does not carry already
            comm -23 <(sort -u "$d/apt_sources_${variant}.txt") <(sort -u "$d/apt_sources_cudaq.txt") > "$d/apt_sources_${variant}_trimmed.txt"
            awk -F'\t' 'NR==FNR {keep[$0]=1; next} (($3 "=" $4) in keep)' \
              "$d/apt_sources_${variant}_trimmed.txt" "$d/apt_package_details_${variant}.tsv" > "$d/apt_package_details_${variant}_trimmed.tsv"
            # pip: name==version lines that cudaq does not carry already
            { grep -vxFf "$d/pip_packages_cudaq.txt" "$d/pip_packages_${variant}.txt" || true; } > "$d/pip_packages_${variant}_trimmed.txt"
          done
          # macOS pip: name==version not in cudaq or cudaqx; a different version of the same name needs its own source
          { grep -vxFf <(cat "$d/pip_packages_cudaq.txt" "$d/pip_packages_cudaqx.txt") "$d/pip_packages_macos.txt" || true; } > "$d/pip_packages_macos_trimmed.txt"
          wc -l "$d"/*_trimmed.*

      - name: Generate tpls lock file
        run: |
          chmod +x scripts/generate_tpls_lock.sh
          ./scripts/generate_tpls_lock.sh tpls_commits.lock
          cat tpls_commits.lock
          wc -l tpls_commits.lock || true

      - name: Download CUDA-Q prerequisite sources
        run: |
          set -euo pipefail
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # Try the primary url, then each comma-separated mirror. A dead host
          # (ftp.gnu.org has been one) should fail in seconds, not minutes.
          fetch() { # <dest> <url> [mirrors]
            local dest=$1 url=$2 mirrors=${3:-} candidate
            for candidate in "$url" ${mirrors//,/ }; do
              echo "Downloading $candidate -> $dest"
              retry curl -fL --connect-timeout 20 "$candidate" -o "$dest" && return 0
              echo "Failed: $candidate" >&2
            done
            return 1
          }
          # Generate cudaq_prereqs.lock for the current configuration
          bash scripts/install_prerequisites.sh -l
          cat cudaq_prereqs.lock

          # Software the images build from source or copy in (the MPI stack, uv,
          # the CMake-fetched libraries, the CMake and QRMI sources) and the
          # DOCA/OFED source bundle. NOTICE must name each at its built version.
          python3 scripts/generate_image_sources_lock.py --check-notice
          # cudaqx and cudaq-decoding install DOCA 3.4 (OFED 26.04), the Dockerfiles DOCA 3.1.
          python3 scripts/generate_image_sources_lock.py --doca --doca-extra 3.4.0:26.04 | tee -a cudaq_prereqs.lock

          mkdir -p prereqs
          while IFS= read -r line; do
            # Skip comments and empty lines
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue ;;
            esac

            name=""
            type=""
            url=""
            mirrors=""
            ref=""

            for kv in $line; do
              key="${kv%%=*}"
              val="${kv#*=}"
              case "$key" in
                name) name="$val" ;;
                type) type="$val" ;;
                url)  url="$val" ;;
                mirrors) mirrors="$val" ;;
                ref)  ref="$val" ;;
              esac
            done

            if [ -z "$name" ] || [ -z "$type" ]; then
              echo "Skipping malformed lock entry: $line"
              continue
            fi

            # Ensure a dedicated subdirectory for each prerequisite
            mkdir -p "prereqs/${name}"

            case "$type" in
              tar)
                fetch "prereqs/${name}/$(basename "$url")" "$url" "$mirrors"
                ;;
              sh)
                dest="prereqs/${name}/$(basename "$url")"
                fetch "$dest" "$url" "$mirrors"
                chmod +x "$dest"
                ;;
              pem)
                fetch "prereqs/${name}/${name}.pem" "$url" "$mirrors"
                ;;
              git)
                dest_dir="prereqs/${name}"
                echo "Cloning git repo for $name from $url (ref=${ref:-HEAD}) -> $dest_dir"
                retry git clone "$url" "$dest_dir"
                if [ -n "${ref:-}" ]; then
                  git -C "$dest_dir" checkout "$ref"
                fi
                ;;
              script)
                # No direct URL; record the script/target so downstream tooling
                # can resolve the concrete sources if desired.
                echo "$line" > "prereqs/${name}/lockentry"
                ;;
              *)
                echo "Unknown type '$type' in lock entry: $line"
                ;;
            esac
          done < cudaq_prereqs.lock

          echo "Contents of prereqs/ (directories only):"
          find prereqs -type d | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build source image
        id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/build/package_sources.Dockerfile
          build-args: |
            base_image=${{ steps.base-image.outputs.base_image }}
            cuda_major=${{ steps.base-image.outputs.cuda_major }}
          load: true
          tags: package-sources:latest
          outputs: type=docker,dest=/tmp/package-sources.tar
          push: false

      - name: Log in to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag and push amd64 image
        id: push
        run: |
          docker load --input /tmp/package-sources.tar
          cuda_major=$(echo "${{ matrix.cuda }}" | cut -d. -f1)
          target_image="nvcr.io/nvidia/nightly/cuda-quantum:cu${cuda_major}-latest"
          tag_suffix="${target_image##*:}"
          owner_lower=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="ghcr.io/${owner_lower}/cuda-quantum-src:${tag_suffix}"
          tag_amd64="${tag}-amd64"
          tag_arm64="${tag}-arm64"
          docker tag package-sources:latest "$tag_amd64"
          docker push "$tag_amd64"
          echo "image_tag=$tag" | tee -a $GITHUB_OUTPUT
          echo "tag_suffix=$tag_suffix" | tee -a $GITHUB_OUTPUT
          echo "tag_amd64=$tag_amd64" | tee -a $GITHUB_OUTPUT
          echo "tag_arm64=$tag_arm64" | tee -a $GITHUB_OUTPUT

      - name: Create arm64 image (copy /sources from amd64)
        run: |
          tag_amd64="${{ steps.push.outputs.tag_amd64 }}"
          tag_arm64="${{ steps.push.outputs.tag_arm64 }}"
          base_image="${{ steps.base-image.outputs.base_image }}"
          # Extract /sources from amd64 image
          cid=$(docker create "$tag_amd64")
          docker cp "$cid:/sources" ./sources-from-amd64
          docker rm "$cid"
          # Build arm64 image: same base, add /sources
          cat > Dockerfile.arm64 << EOF
          FROM ${base_image}
          COPY sources-from-amd64 /sources
          EOF
          docker buildx build --platform linux/arm64 -f Dockerfile.arm64 -t "$tag_arm64" --load .
          docker push "$tag_arm64"

      - name: Create and push multi-arch manifest
        run: |
          tag="${{ steps.push.outputs.image_tag }}"
          tag_amd64="${{ steps.push.outputs.tag_amd64 }}"
          tag_arm64="${{ steps.push.outputs.tag_arm64 }}"
          docker buildx imagetools create --tag "$tag" "$tag_amd64" "$tag_arm64"

      - name: Log in to NGC
        if: inputs.push_to_ngc || github.event_name == 'schedule'
        uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_CREDENTIALS }}

      - name: Copy the source image to NGC
        id: ngc
        if: inputs.push_to_ngc || github.event_name == 'schedule'
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          ngc_image="nvcr.io/nvidia/nightly/cuda-quantum:${{ steps.push.outputs.tag_suffix }}-src"
          retry docker buildx imagetools create --tag "$ngc_image" "${{ steps.push.outputs.image_tag }}"
          echo "ngc_image=$ngc_image" | tee -a $GITHUB_OUTPUT

      - name: Install NGC CLI
        if: steps.ngc.outputs.ngc_image != ''
        uses: ./.github/actions/install-ngc-cli
        with:
          version: 3.31.0
          checksum: b715e503e2c0b44814a51f330eafd605f5d240ea0987bf615700d359c993f138

      - name: Sign the NGC source image
        if: steps.ngc.outputs.ngc_image != ''
        env:
          NGC_IMAGE: ${{ steps.ngc.outputs.ngc_image }}
          NGC_CLI_API_KEY: ${{ secrets.NGC_CREDENTIALS }}
          NGC_CLI_ORG: nvidia
          NGC_CLI_TEAM: nightly
        run: ngc-cli/ngc registry image publish --source "$NGC_IMAGE" "$NGC_IMAGE" --sign

      - name: Summary
        run: |
          base_image="${{ steps.base-image.outputs.base_image }}"
          echo "## Package source diff (CUDA ${{ matrix.cuda }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Base image:** \`${base_image}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built image ${{ steps.push.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.ngc.outputs.ngc_image }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Pushed image ${{ steps.ngc.outputs.ngc_image }}" >> $GITHUB_STEP_SUMMARY
          fi
