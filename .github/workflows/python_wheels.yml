on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: false
        default: linux/amd64
      python_version:
        type: string
        required: true
      cuda_version:
        required: true
        type: string
        description: The CUDA version used for the build (e.g. 12.3).
      devdeps_image:
        required: false
        type: string
      devdeps_cache:
        required: false
        type: string
      devdeps_archive:
        required: false
        type: string
      create_staging_info:
        required: false
        type: boolean
        default: false
      run_validation:
        required: false
        type: boolean
        default: true
        description: Run wheel validation. Deployments disables this; validation runs in the Validation workflow.
      allow_cached_wheels:
        required: false
        type: boolean
        default: false
        description: Reuse a previously built wheel when the source hash matches a live artifact.
      build_devel_wheel:
        required: false
        type: boolean
        default: false
        description: Also build (or restore) the cudaq-devel wheel in this job.
    outputs:
      cudaq_version:
        description: "The version of the built wheels."
        value: ${{ jobs.wheel_ready.outputs.cudaq_version }}
      runtime_artifact_name:
        description: "Artifact name of the runtime wheel."
        value: ${{ jobs.wheel_ready.outputs.runtime_artifact_name }}
      devel_artifact_name:
        description: "Artifact name of the devel wheel, if requested."
        value: ${{ jobs.wheel_ready.outputs.devel_artifact_name }}
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_READONLY_TOKEN:
        required: true

name: Python wheels

jobs:
  resolve_wheels:
    name: Resolve wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    outputs:
      cudaq_version: ${{ steps.version.outputs.cudaq_version }}
      runtime_cache_key: ${{ steps.runtime_hash.outputs.cache_key }}
      runtime_hit: ${{ steps.runtime_lookup.outputs.hit || 'false' }}
      runtime_run_id: ${{ steps.runtime_lookup.outputs.run_id }}
      runtime_artifact_id: ${{ steps.runtime_lookup.outputs.artifact_id }}
      runtime_artifact_name: ${{ steps.runtime_lookup.outputs.artifact_name }}
      devel_cache_key: ${{ steps.devel_hash.outputs.cache_key }}
      devel_hit: ${{ steps.devel_lookup.outputs.hit || 'false' }}
      devel_run_id: ${{ steps.devel_lookup.outputs.run_id }}
      devel_artifact_id: ${{ steps.devel_lookup.outputs.artifact_id }}
      devel_artifact_name: ${{ steps.devel_lookup.outputs.artifact_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute CUDA-Q version
        id: version
        uses: ./.github/actions/compute-cudaq-version

      - name: Hash runtime sources
        id: runtime_hash
        uses: ./.github/actions/wheel-source-hash
        with:
          platform: ${{ inputs.platform }}
          python_version: ${{ inputs.python_version }}
          cuda_version: ${{ inputs.cuda_version }}

      - name: Look up runtime wheel
        if: inputs.allow_cached_wheels
        id: runtime_lookup
        uses: ./.github/actions/wheel-cache-lookup
        with:
          key: ${{ steps.runtime_hash.outputs.cache_key }}

      - name: Hash devel sources
        if: inputs.build_devel_wheel
        id: devel_hash
        uses: ./.github/actions/wheel-source-hash
        with:
          platform: ${{ inputs.platform }}
          python_version: ${{ inputs.python_version }}
          cuda_version: ${{ inputs.cuda_version }}
          tag: devel

      - name: Look up devel wheel
        if: inputs.allow_cached_wheels && inputs.build_devel_wheel
        id: devel_lookup
        uses: ./.github/actions/wheel-cache-lookup
        with:
          key: ${{ steps.devel_hash.outputs.cache_key }}

  build_runtime_wheel:
    name: Build Python ${{ inputs.python_version }} wheel
    needs: resolve_wheels
    if: needs.resolve_wheels.outputs.runtime_hit != 'true'
    runs-on: ${{ (contains(inputs.platform, 'arm') && 'linux-arm64-cpu8') || 'linux-amd64-cpu8' }}
    permissions:
      contents: read
      packages: write
      actions: write

    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}

    # Needed for making local images available to the docker/build-push-action.
    # See also https://stackoverflow.com/a/63927832.
    services:
        registry:
          image: registry:2
          ports:
            - 5000:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}

      - name: Login to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build wheel
        id: build
        uses: ./.github/actions/build-wheel-in-docker
        with:
          platform: ${{ inputs.platform }}
          python_version: ${{ inputs.python_version }}
          release_version: ${{ needs.resolve_wheels.outputs.cudaq_version }}
          devdeps_image: ${{ inputs.devdeps_image }}
          devdeps_cache: ${{ inputs.devdeps_cache }}
          devdeps_archive: ${{ inputs.devdeps_archive }}

      - name: Upload wheel
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.wheel_dir }}
          retention-days: 1
          if-no-files-found: error

      - name: Register wheel
        uses: ./.github/actions/wheel-cache-register
        with:
          key: ${{ needs.resolve_wheels.outputs.runtime_cache_key }}
          artifact_id: ${{ steps.upload.outputs.artifact-id }}
          artifact_name: ${{ steps.build.outputs.artifact_name }}

  build_devel_wheel:
    name: Build cudaq-devel wheel
    needs: resolve_wheels
    if: inputs.build_devel_wheel && needs.resolve_wheels.outputs.devel_hit != 'true'
    runs-on: ${{ (contains(inputs.platform, 'arm') && 'linux-arm64-cpu8') || 'linux-amd64-cpu8' }}
    permissions:
      contents: read
      packages: write
      actions: write

    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}

    services:
        registry:
          image: registry:2
          ports:
            - 5000:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}

      - name: Login to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build devel wheel
        id: build
        uses: ./.github/actions/build-wheel-in-docker
        with:
          platform: ${{ inputs.platform }}
          python_version: ${{ inputs.python_version }}
          release_version: ${{ needs.resolve_wheels.outputs.cudaq_version }}
          devdeps_image: ${{ inputs.devdeps_image }}
          devdeps_cache: ${{ inputs.devdeps_cache }}
          devdeps_archive: ${{ inputs.devdeps_archive }}
          build_devel: '1'

      - name: Upload devel wheel
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ steps.build.outputs.wheel_dir }}
          retention-days: 1
          if-no-files-found: error

      - name: Register devel wheel
        uses: ./.github/actions/wheel-cache-register
        with:
          key: ${{ needs.resolve_wheels.outputs.devel_cache_key }}
          artifact_id: ${{ steps.upload.outputs.artifact-id }}
          artifact_name: ${{ steps.build.outputs.artifact_name }}

  restore_runtime_wheel:
    name: Restore Python ${{ inputs.python_version }} wheel
    needs: resolve_wheels
    if: needs.resolve_wheels.outputs.runtime_hit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore wheel
        uses: ./.github/actions/wheel-restore
        with:
          key: ${{ needs.resolve_wheels.outputs.runtime_cache_key }}
          run_id: ${{ needs.resolve_wheels.outputs.runtime_run_id }}
          artifact_id: ${{ needs.resolve_wheels.outputs.runtime_artifact_id }}
          artifact_name: ${{ needs.resolve_wheels.outputs.runtime_artifact_name }}
          version: ${{ needs.resolve_wheels.outputs.cudaq_version }}

  restore_devel_wheel:
    name: Restore cudaq-devel wheel
    needs: resolve_wheels
    if: inputs.build_devel_wheel && needs.resolve_wheels.outputs.devel_hit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore devel wheel
        uses: ./.github/actions/wheel-restore
        with:
          key: ${{ needs.resolve_wheels.outputs.devel_cache_key }}
          run_id: ${{ needs.resolve_wheels.outputs.devel_run_id }}
          artifact_id: ${{ needs.resolve_wheels.outputs.devel_artifact_id }}
          artifact_name: ${{ needs.resolve_wheels.outputs.devel_artifact_name }}
          version: ${{ needs.resolve_wheels.outputs.cudaq_version }}

  wheel_ready:
    name: Wheels ready
    needs:
      - resolve_wheels
      - build_runtime_wheel
      - build_devel_wheel
      - restore_runtime_wheel
      - restore_devel_wheel
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      cudaq_version: ${{ needs.resolve_wheels.outputs.cudaq_version }}
      runtime_artifact_name: ${{ steps.pick.outputs.runtime_artifact_name }}
      devel_artifact_name: ${{ steps.pick.outputs.devel_artifact_name }}

    steps:
      - name: Select artifact names
        id: pick
        env:
          RESOLVE_RESULT: ${{ needs.resolve_wheels.result }}
          RUNTIME_HIT: ${{ needs.resolve_wheels.outputs.runtime_hit }}
          DEVEL_HIT: ${{ needs.resolve_wheels.outputs.devel_hit }}
        run: |
          set -euo pipefail
          if [ "$RESOLVE_RESULT" != "success" ]; then
            echo "::error::resolve_wheels did not succeed"
            exit 1
          fi

          if [ "$RUNTIME_HIT" = "true" ]; then
            if [ "${{ needs.restore_runtime_wheel.result }}" != "success" ]; then
              echo "::error::Failed to restore the runtime wheel"
              exit 1
            fi
            echo "runtime_artifact_name=${{ needs.resolve_wheels.outputs.runtime_artifact_name }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ needs.build_runtime_wheel.result }}" != "success" ]; then
              echo "::error::Failed to build the runtime wheel"
              exit 1
            fi
            echo "runtime_artifact_name=${{ needs.build_runtime_wheel.outputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ inputs.build_devel_wheel }}" != "true" ]; then
            exit 0
          fi
          if [ "$DEVEL_HIT" = "true" ]; then
            if [ "${{ needs.restore_devel_wheel.result }}" != "success" ]; then
              echo "::error::Failed to restore the devel wheel"
              exit 1
            fi
            echo "devel_artifact_name=${{ needs.resolve_wheels.outputs.devel_artifact_name }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ needs.build_devel_wheel.result }}" != "success" ]; then
              echo "::error::Failed to build the devel wheel"
              exit 1
            fi
            echo "devel_artifact_name=${{ needs.build_devel_wheel.outputs.artifact_name }}" >> "$GITHUB_OUTPUT"
          fi

  create_test_config:
    name: Prepare validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      json: "${{ steps.config.outputs.json }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - id: config
        run: |
          python_config=`cat .github/workflows/config/validation_config.json | jq ".python"`
          operating_systems=`echo "$python_config" | jq '.[] | select(.version=="${{ inputs.python_version }}").operating_systems'`
          echo "json={\"os_images\":$(echo $operating_systems)}" >> $GITHUB_OUTPUT

  validation:
    name: Validate wheel
    needs: [wheel_ready, create_test_config]
    if: inputs.run_validation && needs.wheel_ready.result == 'success'
    runs-on: ${{ (contains(inputs.platform, 'arm') && 'linux-arm64-cpu8') || 'linux-amd64-cpu8' }}
    permissions:
      contents: read
      packages: read

    outputs:
      artifact_id: "${{ steps.job_summary.outputs.artifact_id }}"
  
    strategy:
      matrix:
        os_image: ${{ fromJSON(needs.create_test_config.outputs.json).os_images }}
        pip_install_flags: ['', '--user']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub CR
        if: inputs.environment == ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load cuda-quantum wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.wheel_ready.outputs.runtime_artifact_name }}

      - name: Install wheel in clean environment
        run: |
          os_image=${{ matrix.os_image }}
          distr=`echo $os_image | cut -d : -f 1 | cut -d / -f 1`
          if ${{ inputs.environment != '' }}; then
            # Validate against the public images
            base_image=$os_image
          else
            # If we are not staging, we instead validate the images
            # pushed to GHCR to limit our pull rate on public registries.
            repo_owner=${{ github.repository_owner }}
            image_tag=`echo $os_image | sed -e 's@.*\.io/\(\)@\1@'`
            base_image=ghcr.io/${repo_owner,,}/${image_tag#${repo_owner,,}}
          fi

          wheelname=`echo cuda_quantum*-manylinux_*_$(uname -m).whl`
          docker build --network host -t wheel_validation:local -f "docker/test/wheels/$distr.Dockerfile" . \
            --build-arg base_image=$base_image \
            --build-arg python_version=${{ inputs.python_version }} \
            --build-arg cuda_quantum_wheel=$wheelname \
            --build-arg preinstalled_modules="pytest psutil" \
            --build-arg pip_install_flags=${{ matrix.pip_install_flags }}

          docker run --rm -dit --name wheel-validation wheel_validation:local
          (docker exec wheel-validation python${{ inputs.python_version }} -c "import cudaq") && imported=true || imported=false
          docker stop wheel-validation

          if ! $imported; then echo "Failed to import cudaq module." >> /tmp/validation.out
          else echo "Successfully imported cudaq module." >> /tmp/validation.out; fi

      - name: Run Python tests
        uses: ./.github/actions/run-in-docker
        with:
          image: wheel_validation:local
          shell: bash
          run: |
            retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
            python${{ inputs.python_version }} -m pytest -v /tmp/tests/ \
              --ignore /tmp/tests/backends
            pytest_status=$?
            if [ ! $pytest_status -eq 0 ]; then
              echo "::error file=python_wheel.yml::Python tests failed with status $pytest_status."
              exit 1
            fi
            retry python${{ inputs.python_version }} -m pip install fastapi uvicorn llvmlite
            python${{ inputs.python_version }} -m pytest -v /tmp/tests/backends --rootdir /tmp/tests
            pytest_status=$?
            # Exit code 5 indicates that no tests were collected,
            # i.e. all tests in this file were skipped.
            if [ ! $pytest_status -eq 0 ] && [ ! $pytest_status -eq 5 ]; then
              echo "::error file=python_wheel.yml::Python backend tests failed with status $pytest_status."
              exit 1
            fi

      - name: Validate license compliance
        uses: ./.github/actions/run-in-docker
        with:
          image: wheel_validation:local
          shell: bash
          volume: ${{ github.workspace }}/scripts:/tmp/scripts:ro
          run: |
            retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }

            if command -v dnf > /dev/null; then
              retry dnf install -y --nobest --setopt=install_weak_deps=False binutils
            elif command -v apt-get > /dev/null; then
              retry apt-get update && retry apt-get install -y --no-install-recommends binutils
            elif command -v zypper > /dev/null; then
              retry zypper --non-interactive install binutils
            fi
            if ! command -v nm > /dev/null && ! command -v readelf > /dev/null && ! command -v objdump > /dev/null; then
              echo "::error file=python_wheels.yml::Failed to install binutils; the scan for statically linked GMP/MPFR copies would silently be skipped."
              exit 1
            fi

            python_exe=$(command -v python${{ inputs.python_version }})
            if [ -z "$python_exe" ]; then
              echo "::error file=python_wheels.yml::python${{ inputs.python_version }} not found in the validation image."
              exit 1
            fi
            mkdir -p /tmp/pyshim
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$python_exe" > /tmp/pyshim/python3
            chmod +x /tmp/pyshim/python3
            export PATH="/tmp/pyshim:$PATH"
            if ! python3 -c "import cudaq" > /dev/null 2>&1; then
              echo "::error file=python_wheels.yml::cudaq is not importable via the python3 used for license validation."
              exit 1
            fi

            bash /tmp/scripts/validate_license_compliance.sh --wheel
            if [ $? -ne 0 ]; then
              echo "::error file=python_wheels.yml::License compliance validation failed for the built wheel."
              exit 1
            fi

      - name: Run Python MPI tests
        if: matrix.os_image == 'redhat/ubi9:9.6'
        uses: ./.github/actions/run-in-docker
        with:
          image: wheel_validation:local
          shell: bash
          run: |
            retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
            retry_dnf() { local pre=""; [ "$(id -u)" -ne 0 ] && pre=sudo; for n in 1 2 3; do $pre dnf "$@" && return 0; [ $n -lt 3 ] && { $pre dnf clean metadata >/dev/null 2>&1 || true; sleep $((15*n*n)); }; done; return 1; }
            # Uninstall pip-installed cuda-quantum in the `wheel_validation:local` image.
            # In this step, we test the full installation workflow with conda;
            # hence we don't want to mix conda and pip packages.
            cuda_major=$(echo ${{ inputs.cuda_version }} | cut -d . -f1)
            python${{ inputs.python_version }} -m pip uninstall -y cuda-quantum-cu${cuda_major}

            # Install cuda-quantum wheel and all dependencies (including MPI) using conda (README instructions)
            retry_dnf install -y --nobest --setopt=install_weak_deps=False wget unzip openssh-clients
            mkdir -p ~/miniconda3
            retry wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-$(uname -m).sh -O ~/miniconda3/miniconda.sh
            bash ~/miniconda3/miniconda.sh -b -u -p ~/miniconda3
            ~/miniconda3/bin/conda init bash
            source ~/.bashrc

            # conda-libmamba-solver 26.4.0 enables sharded repodata by default,
            # and its threaded shard cache races on its sqlite store, failing the
            # `conda install` of mpi4py/openmpi below with
            # "sqlite3.OperationalError: database is locked". Disable sharding so
            # conda uses classic repodata.json (slower, but reliable in CI).
            export CONDA_PLUGINS_USE_SHARDED_REPODATA=0

            # Accept Anaconda's non-interactive ToS for the default channels;
            # `conda create -n cudaq-env python=...` below hits pkgs/main.
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r

            # Extract the setup script from Python wheel's readme
            cudaq_wheel=/tmp/cuda_quantum_cu*-manylinux_*_$(uname -m).whl
            wheelname=${cudaq_wheel##*/} && archive_name=${wheelname%.*}.zip 
            tmploc=/tmp/scratch && mkdir $tmploc
            cp $cudaq_wheel $tmploc/$wheelname && mv $tmploc/$wheelname $tmploc/$archive_name 
            unzip $tmploc/$archive_name -d $tmploc/cudaq_wheel && rm -rf $tmploc/$archive_name
            metadata=$tmploc/cudaq_wheel/*.dist-info/METADATA

            # Resolve README template placeholders that pyproject.toml leaves
            # unsubstituted (readme points at README.md.in). Without this the
            # eval below would hit bash "bad substitution" on un-substituted
            # README placeholders.
            cuda_version_conda="${{ inputs.cuda_version }}.0"
            cuda_version_conda="${cuda_version_conda/13.0.0/13.0.2}"
            sub_placeholders() {
              sed -E -e "s/\\\$\\{\\{[[:space:]]*cuda_version_conda[[:space:]]*\\}\\}/${cuda_version_conda}/g" \
                     -e "s/\\\$\\{\\{[[:space:]]*package_name[[:space:]]*\\}\\}/cuda-quantum-cu${cuda_major}/g"
            }

            # Parse README content to install openmpi
            conda_script="$(awk '/(Begin conda install)/{flag=1;next}/(End conda install)/{flag=0}flag' $metadata | grep . | sed '/^```/d' | sub_placeholders)"
            while IFS= read -r line; do
              # Replace Python version
              line=$(echo $line | sed -E "s/python(=)?3.[0-9]{1,}/python\1${{ inputs.python_version }}/g")
              # Install the wheel file
              line=${line//pip install cuda-quantum-cu${cuda_major}/pip install ${cudaq_wheel}}
              echo "+ $line"
              # Fail loudly on the failing command. Without this a failed
              # `conda install` is swallowed and only surfaces ~60 lines later
              # as a misleading "mpirun: command not found". Retry to tolerate
              # transient network drops mid-download (e.g. a "Connection reset
              # by peer" while fetching a multi-hundred-MB CUDA package).
              if ! retry eval "$line"; then
                echo "::error file=python_wheel.yml::conda install step failed: $line"
                exit 1
              fi
            done <<< "$conda_script"
            ompi_script="$(awk '/(Begin ompi setup)/{flag=1;next}/(End ompi setup)/{flag=0}flag' $metadata | grep . | sed '/^```/d')"
            while IFS= read -r line; do
                echo "+ $line"
                if ! retry eval "$line"; then
                  echo "::error file=python_wheel.yml::ompi setup step failed: $line"
                  exit 1
                fi
            done <<< "$ompi_script"

            # Run the MPI test
            retry python${{ inputs.python_version }} -m pip install pytest numpy
            mpirun --allow-run-as-root -np 4 python${{ inputs.python_version }} -m pytest -v /tmp/tests/parallel/test_mpi_api.py
            pytest_mpi_status=$?
            if [ ! $pytest_mpi_status -eq 0 ]; then
              echo "::error file=python_wheel.yml::Python MPI plugin test failed with status $pytest_mpi_status."
              exit 1
            fi

      - name: Validate Python snippets in docs
        run: |
          docker run --rm -dit --name wheel-validation-snippets wheel_validation:local
          status_sum=0

          for ex in `find docs/sphinx/snippets/python -name '*.py' -not -path '*/platform/*' -not -path '*/backends/*'`; do
            file="${ex#docs/sphinx/snippets/python/}"
            echo "__Snippet ${file}:__" >> /tmp/validation.out
            (docker exec wheel-validation-snippets bash -c "python${{ inputs.python_version }} /tmp/snippets/$file" >> /tmp/validation.out) && success=true || success=false
            if $success; then 
              echo "Executed successfully." >> /tmp/validation.out
            else
              status_sum=$((status_sum+1))
              echo "Failed." >> /tmp/validation.out
            fi
          done

          docker stop wheel-validation-snippets
          if [ ! $status_sum -eq 0 ]; then
            echo "::error::$status_sum snippets failed; see step summary for a list of failures."
            exit $status_sum
          fi

      - name: Validate Python examples
        run: |
          docker run --rm -dit --name wheel-validation-examples wheel_validation:local
          status_sum=0

          for ex in `find docs/sphinx/examples/python -name '*.py' -not -path '*/building_kernels.py' -not -path '*/dynamics/*' -not -path '*/mpi/*'`; do
            file="${ex#docs/sphinx/examples/python/}"
            echo "__Example ${file}:__" >> /tmp/validation.out
            (docker exec wheel-validation-examples bash -c "python${{ inputs.python_version }} /tmp/examples/$file" >> /tmp/validation.out) && success=true || success=false
            if $success; then 
              echo "Executed successfully." >> /tmp/validation.out
            else
              status_sum=$((status_sum+1))
              echo "Failed." >> /tmp/validation.out
            fi
          done

          docker stop wheel-validation-examples
          if [ ! $status_sum -eq 0 ]; then
            echo "::error::$status_sum examples failed; see step summary for a list of failures."
            exit $status_sum
          fi

      - name: Create job summary
        id: job_summary
        if: always() && !cancelled() 
        run: |
          cuda_major=`echo ${{ inputs.cuda_version }} | cut -d . -f1`
          platform_id=`echo "${{ inputs.platform }}" | sed 's/linux\///g' | tr -d ' ' | tr ',' -`
          artifact_id=python_${platform_id}_cu$cuda_major # changing the artifact name requires updating other workflows
          os_id=`echo ${{ matrix.os_image}} | tr ':' _ | tr '/' -`
          echo "os_id=$os_id" >> $GITHUB_OUTPUT
          echo "artifact_id=$artifact_id" >> $GITHUB_OUTPUT

          if [ -f /tmp/validation.out ]; then
            if [ -n "${{ matrix.pip_install_flags }}" ]; then 
                installation_details="(installed with ${{ matrix.pip_install_flags }})"
            else 
                installation_details="(default installation)"
            fi

            summary=/tmp/summary.txt
            echo "## Validation on ${{ matrix.os_image }} $installation_details" > $summary
            echo "The validation of the cuda-quantum Python wheel produced the following output:" >> $summary
            cat /tmp/validation.out >> $summary
            echo "validation_summary=$summary" >> $GITHUB_OUTPUT
          fi

      - name: Upload job summary
        if: steps.job_summary.outputs.validation_summary != '' && matrix.pip_install_flags == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.job_summary.outputs.artifact_id }}_${{ steps.job_summary.outputs.os_id }}_py${{ inputs.python_version }}_validation
          path: ${{ steps.job_summary.outputs.validation_summary }}
          retention-days: 1
          if-no-files-found: warn

  gpu_validation:
    # Merge-queue gate: run the Python test suite against the GPU (nvidia)
    # statevector simulator. Regressions that only manifest on the nvidia
    # target pass on qpp-cpu and so escape per-PR CI, which has no GPU. This
    # reuses the wheel from wheel_ready and runs a single representative
    # config (amd64 / Python 3.11 / CUDA 12.6) to limit A100 runner cost.
    name: Validate wheel on GPU (nvidia simulator)
    needs: wheel_ready
    if: inputs.run_validation && needs.wheel_ready.result == 'success' && inputs.platform == 'linux/amd64' && inputs.python_version == '3.11' && inputs.cuda_version == '12.6'
    runs-on: linux-amd64-gpu-a100-latest-1
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Load cuda-quantum wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.wheel_ready.outputs.runtime_artifact_name }}

      - name: Build wheel test image
        run: |
          # ubuntu:22.04 is the Python 3.11 validation image (see
          # config/validation_config.json). Mirror the `validation` job and use
          # the GHCR-mirrored base to limit pull rate on public registries.
          repo_owner=${{ github.repository_owner }}
          base_image=ghcr.io/${repo_owner,,}/ubuntu:22.04
          wheelname=`echo cuda_quantum*-manylinux_*_$(uname -m).whl`
          docker build --network host -t wheel_validation:local -f docker/test/wheels/ubuntu.Dockerfile . \
            --build-arg base_image=$base_image \
            --build-arg python_version=${{ inputs.python_version }} \
            --build-arg cuda_quantum_wheel=$wheelname \
            --build-arg preinstalled_modules="numpy pytest psutil" \
            --build-arg pip_install_flags=

      - name: Run Python tests on nvidia simulator
        # On the A100 runner, run-in-docker auto-adds `--gpus all` (it detects
        # nvidia-smi on the host), so the container can reach the GPU.
        uses: ./.github/actions/run-in-docker
        with:
          image: wheel_validation:local
          shell: bash
          run: |
            # Force the GPU statevector backend. Tests that set their own target
            # override this; the rest run on nvidia instead of the qpp-cpu default.
            export CUDAQ_DEFAULT_SIMULATOR=nvidia

            # Fail loudly if the GPU / nvidia target is unavailable, so a missing
            # GPU can't masquerade as a clean "everything skipped" run.
            python${{ inputs.python_version }} -c "import cudaq; cudaq.set_target('nvidia'); k=cudaq.make_kernel(); q=k.qalloc(2); k.h(q[0]); k.cx(q[0], q[1]); c=cudaq.sample(k); assert c, 'nvidia target returned no samples'; print('nvidia target OK:', c)"

            # Mirror the CPU suite selection: full python/tests minus backends
            # (need mock QPUs) and contrib (needs qiskit). Also skip parallel
            # (needs MPI and the multi-QPU mqpu platform, neither of which this
            # single-GPU validation container provides; MPI is covered by the
            # dedicated conda/OpenMPI step in the wheel validation job).
            python${{ inputs.python_version }} -m pytest -v --durations=0 /tmp/tests/ \
              --ignore /tmp/tests/backends \
              --ignore /tmp/tests/contrib \
              --ignore /tmp/tests/parallel
            pytest_status=$?
            if [ ! $pytest_status -eq 0 ]; then
              echo "::error file=python_wheels.yml::Python tests on the nvidia simulator failed with status $pytest_status."
              exit 1
            fi

  validate_devel:
    name: Validate devel wheel
    needs: wheel_ready
    if: inputs.build_devel_wheel && needs.wheel_ready.result == 'success'
    runs-on: ${{ (contains(inputs.platform, 'arm') && 'linux-arm64-cpu8') || 'linux-amd64-cpu8' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download runtime wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.wheel_ready.outputs.runtime_artifact_name }}
          path: dist

      - name: Download devel wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.wheel_ready.outputs.devel_artifact_name }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up validation toolchain
        id: setup
        env:
          PY: ${{ inputs.python_version }}
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          uv python install "$PY"
          uv tool install "cmake==4.0.3"
          uv tool install "ninja==1.13.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          retry sudo apt-get update
          retry sudo apt-get install -y g++-12
          echo "CC=gcc-12" >> "$GITHUB_ENV"
          echo "CXX=g++-12" >> "$GITHUB_ENV"
          echo "python_executable=$(uv python find "$PY")" >> "$GITHUB_OUTPUT"

      - name: Validate devel wheel contents
        run: |
          PYTHON="${{ steps.setup.outputs.python_executable }}" \
            bash scripts/validate_devel_wheel.sh -i dist -r dist

  staging:
    name: Staging
    needs: [wheel_ready]
    if: inputs.create_staging_info && needs.wheel_ready.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create build info
        id: staging
        run: |
          wheeldeps_hash=${{ inputs.devdeps_image }}
          platform_id=`echo "${{ inputs.platform }}" | sed 's/linux\///g' | tr -d ' ' | tr ',' -`
          cuda_major=`echo ${{ inputs.cuda_version }} | cut -d . -f1`
          artifact_name=python_${platform_id}_cu${cuda_major}_publishing # changing the artifact name requires updating other workflows

          echo "platform_id=$platform_id" >> $GITHUB_OUTPUT
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT
          info_file="$artifact_name.txt"
          echo "info_file=$info_file" >> $GITHUB_OUTPUT

          mkdir -p "$(dirname "$info_file")" && rm -rf "$info_file"
          echo "source-sha: ${{ github.sha }}" >> "$info_file"
          echo "cuda-quantum-wheeldeps-image: $wheeldeps_hash" >> "$info_file"
          echo "platform: ${{ inputs.platform }}" >> "$info_file"
          echo "cuda-version: ${{ inputs.cuda_version }}" >> "$info_file"

      - name: Upload build info
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.staging.outputs.artifact_name }} # changing the artifact name requires updating other workflows
          path: ${{ steps.staging.outputs.info_file }}
          retention-days: 30
          if-no-files-found: error
