# Tests what Deployments built (dispatched by its trigger_validation job, or
# by hand with a deployment run id). Builds nothing.
#
# No workflow_run trigger: it always resolves this file, and what it
# calls, from the default branch instead of the branch being validated.
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        type: string
        description: The workflow id of the deployment whose images should be validated.
        required: true
      github_commit:
        type: string
        description: Optional argument to set the GitHub commit to use for the validation sources.
        required: false
  workflow_call:
    inputs:
      deployment_id:
        type: string
        description: The workflow id of the deployment whose images should be validated.
        required: true
      github_commit:
        type: string
        description: Optional argument to set the GitHub commit to use for the validation sources.
        required: false

name: Validation

jobs:
  metadata:
    name: Validation metadata
    if: >-
      inputs.deployment_id != '' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    environment:
      name: ghcr-deployment
      url: ${{ vars.deployment_url }}
      deployment: false

    outputs:
      github_commit: ${{ steps.artifacts.outputs.github_commit }}
      cudaq_version: ${{ steps.artifacts.outputs.cudaq_version }}
      artifacts_url: ${{ steps.artifacts.outputs.artifacts_url }}
      deployment_id: ${{ steps.artifacts.outputs.deployment_id }}
      release_images: ${{ steps.artifacts.outputs.release_images }}
      debug_images: ${{ steps.artifacts.outputs.debug_images }}

    steps:
      - name: Download build info
        id: artifacts
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # deployment_id is the dispatch input, or the triggering Deployments run.
          deployment_id="${{ inputs.deployment_id || github.event.workflow_run.id }}"
          artifacts_url=https://api.github.com/repos/${{ github.repository }}/actions/runs/${deployment_id}/artifacts
          echo "Validating images from https://github.com/${{ github.repository }}/actions/runs/${deployment_id}" >> $GITHUB_STEP_SUMMARY
          artifacts=$(retry gh api $artifacts_url --paginate -q '.artifacts[] | {name: .name, url: .archive_download_url}')

          build_info_folder=/tmp/validation-build-info
          mkdir -p "$build_info_folder"

          function download {
            # $1 = artifact name, $2 = archive download url
            mkdir -p "$build_info_folder/$1"
            retry gh api "$2" > /tmp/info.zip
            unzip -o -d /tmp/info /tmp/info.zip
            for file in `find /tmp/info -type f`; do
              cat "$file" >> "$build_info_folder/$1/$1.txt"
            done
            rm -rf /tmp/info /tmp/info.zip
          }

          release_images="[]"
          debug_images="[]"
          github_commit=""
          release_version=""
          cudaq_version=""

          for artifact in `echo "$artifacts"`; do
            name=`echo $artifact | jq -r '.name'`
            url=`echo $artifact | jq -r '.url'`
            if [ "${name%_publishing}" != "$name" ] && [ "${name#image}" != "$name" ]; then
              download "$name" "$url"
              info="$build_info_folder/$name/$name.txt"
              release_image=`grep -o 'cuda-quantum-image: \S*' "$info" | cut -d ' ' -f 2`
              debug_image=`grep -o 'cuda-quantum-dev-image: \S*' "$info" | cut -d ' ' -f 2`
              [ -n "$release_image" ] && release_images=`echo "$release_images" | jq --arg v "$release_image" '. + [$v]'`
              [ -n "$debug_image" ] && debug_images=`echo "$debug_images" | jq --arg v "$debug_image" '. + [$v]'`
            elif [ "${name#deployment_info}" != "$name" ]; then
              download "$name" "$url"
              info="$build_info_folder/$name/$name.txt"
              github_commit=`grep -o 'source-sha: \S*' "$info" | cut -d ' ' -f 2`
              release_version=`grep -o 'release-version: \S*' "$info" | cut -d ' ' -f 2`
              cudaq_version=`grep -o 'cudaq-version: \S*' "$info" | cut -d ' ' -f 2`
            fi
          done

          # Older deployments lack cudaq-version; derive it from the ref.
          if [ -z "$cudaq_version" ]; then
            is_versioned=${{ github.ref_type == 'tag' || startsWith(github.ref_name, 'releases/') || startsWith(github.ref_name, 'staging/') }}
            if ${is_versioned}; then
              cudaq_version=`echo ${{ github.ref_name }} | egrep -o "([0-9]{1,}\.)+[0-9]{1,}"`
            else
              cudaq_version=${release_version:-0.0.0}
            fi
          fi

          echo "deployment_id=$deployment_id" >> $GITHUB_OUTPUT
          echo "artifacts_url=$artifacts_url" >> $GITHUB_OUTPUT
          echo "github_commit=$github_commit" >> $GITHUB_OUTPUT
          echo "cudaq_version=$cudaq_version" >> $GITHUB_OUTPUT
          echo "release_images=$(echo $release_images | jq -c .)" >> $GITHUB_OUTPUT
          echo "debug_images=$(echo $debug_images | jq -c .)" >> $GITHUB_OUTPUT
          echo "Release images: $release_images"
          echo "Debug images: $debug_images"
        env:
          GH_TOKEN: ${{ github.token }}

  debug_image_validation:
    name: Debug image validation (${{ matrix.arch }})
    needs: metadata
    if: ${{ needs.metadata.outputs.debug_images != '[]' }}
    runs-on: linux-${{ matrix.arch }}-gpu-a100-latest-1
    permissions:
      packages: read

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ${{ fromJson(needs.metadata.outputs.debug_images) }}

    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ startsWith(matrix.image, 'nvcr.io') && '$oauthtoken' || github.actor }}
        password: ${{ startsWith(matrix.image, 'nvcr.io') && secrets.NGC_CREDENTIALS || github.token }}
      options: --user root
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        TERM: xterm

    steps:
      - name: Run realtime integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd /workspaces/cuda-quantum

          # Do not silently pass if the realtime label is missing or empty.
          ctest --test-dir build --no-tests=error -L realtime -V 2>&1 \
            | tee /tmp/realtime_ctest.out
          if grep -q '\[  SKIPPED \]' /tmp/realtime_ctest.out; then
            echo "::error::Unexpected skipped realtime test."
            exit 1
          fi

          "$LLVM_INSTALL_PREFIX/bin/llvm-lit" -v \
            --show-skipped --show-unsupported build/cudaq/test \
            --param nvqpp_site_config=build/cudaq/test/lit.site.cfg.py \
            --filter 'device_call_realtime' 2>&1 \
            | tee /tmp/device_call_realtime.out
          if grep -Eq '^(SKIPPED|UNSUPPORTED):' \
              /tmp/device_call_realtime.out; then
            echo "::error::Unexpected skipped or unsupported realtime test."
            exit 1
          fi

          # The CPU RoCE transport needs HololinkRoce from an HSB build, which the
          # dev image does not ship, so only the UDP transport is always present.
          test -f "$CUDAQ_INSTALL_PREFIX/lib/libcudaq-realtime-udp-transport.a"
          test -f "$CUDAQ_INSTALL_PREFIX/lib/libcudaq-device-call-runtime.so"

  logical_release_image_validation:
    name: CUDA-Q Logical image validation (${{ matrix.arch }})
    needs: metadata
    if: ${{ needs.metadata.outputs.release_images != '[]' }}
    runs-on: linux-${{ matrix.arch }}-cpu8
    timeout-minutes: 20
    permissions:
      packages: read

    environment:
      name: ghcr-deployment
      url: ${{ vars.deployment_url }}
      deployment: false

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: ${{ fromJson(needs.metadata.outputs.release_images) }}

    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ startsWith(matrix.image, 'nvcr.io/') && '$oauthtoken' || (startsWith(matrix.image, 'ghcr.io/') && github.actor || '') }}
        password: ${{ startsWith(matrix.image, 'nvcr.io/') && secrets.NGC_CREDENTIALS || (startsWith(matrix.image, 'ghcr.io/') && github.token || '') }}
      options: --user root

    steps:
      - name: Import cudaq.logical
        shell: bash
        run: |
          python3 -c 'import cudaq.logical'
          python3 -m pip check

  release_image_validation:
    name: Release image validation
    needs: metadata
    if: ${{ needs.metadata.outputs.release_images != '[]' }}
    runs-on: linux-amd64-gpu-a100-latest-1
    permissions:
      contents: read
      packages: read

    environment:
      name: ghcr-deployment
      url: ${{ vars.deployment_url }}
      deployment: false

    strategy:
      matrix:
        image: ${{ fromJson(needs.metadata.outputs.release_images) }}
      fail-fast: false

    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ startsWith(matrix.image, 'nvcr.io') && '$oauthtoken' || github.actor }}
        password: ${{ startsWith(matrix.image, 'nvcr.io') && secrets.NGC_CREDENTIALS || github.token }}
      options: --user root # otherwise step summary doesn't work
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.github_commit || needs.metadata.outputs.github_commit }}
          path: github-repo
          sparse-checkout: |
            scripts
            docs

      - name: Basic validation (GPU backends)
        shell: bash
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # build-essential is needed for nbconvert (jupyter/nbconvert#1742).
          retry sudo apt-get update && retry sudo apt-get install -y build-essential python3-dev python3-venv python3-pip
          # pip, not apt: test_cmake_find_package.sh needs cmake >= 4.0.
          retry sudo pip3 install --break-system-packages cmake

          # GPU targets are those that cudaq-target-resolve reports as available only on hosts with GPUs.
          resolve="$CUDA_QUANTUM_PATH/bin/cudaq-target-resolve"
          resolve_args=(--install-dir="$CUDA_QUANTUM_PATH" --lib-dir="$CUDA_QUANTUM_PATH/lib")
          backends_to_test=$(comm -13 \
              <("$resolve" --list-simulators "${resolve_args[@]}" --gpu-count=0 | sort) \
              <("$resolve" --list-simulators "${resolve_args[@]}" --gpu-count=1 | sort))

          rm -rf examples applications targets snippets && mv github-repo/docs/sphinx/examples examples && mv github-repo/docs/sphinx/applications applications && mv github-repo/docs/sphinx/targets targets && mv github-repo/docs/sphinx/snippets/python snippets
          mv github-repo/docs/notebook_validation.py .
          GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY \
          bash github-repo/scripts/validate_installation.sh $backends_to_test | tee /tmp/validation.out

          # Check the tests included the nvidia-mgpu backend (fp32,mgpu).
          nvidia_block_start=$(grep -n "Testing on nvidia target..." /tmp/validation.out | head -n1 | cut -d: -f1)
          nvidia_block=$(tail -n +$((nvidia_block_start + 1)) /tmp/validation.out | sed -n '/^Testing on /q;p')
          if ! echo "$nvidia_block" | grep -q "fp32,mgpu"; then
            echo "::error::Missing tests for nvidia fp32,mgpu backend."
            echo "Observed target options:"
            echo "$nvidia_block"
            exit 1
          fi

      - name: MPI validation
        shell: bash
        run: |
          status_sum=0 && set +e # Allow script to keep going through errors
          # C++ examples keep their cpp/ prefix under /home/cudaq/examples.
          mpi_examples=/home/cudaq/examples/cpp/other/distributed
          if [ ! -d "$mpi_examples" ]; then
            echo "::error::MPI examples directory not found: $mpi_examples"
            exit 1
          fi
          found=0
          for ex in `find "$mpi_examples" -name '*.cpp'`; do
            found=$((found+1))
            filename=$(basename -- "$ex")
            # Set CUDAQ_ENABLE_MPI_EXAMPLE to activate these examples.
            nvq++ -DCUDAQ_ENABLE_MPI_EXAMPLE=1 $ex
            status=$?
            if [ $status -eq 0 ]; then
              # --oversubscribe: OpenMPI sizes slots by physical cores.
              mpiexec --allow-run-as-root --oversubscribe -np 4 ./a.out
              status=$?
              if [ $status -eq 0 ]; then
                echo ":white_check_mark: Successfully ran $filename." >> $GITHUB_STEP_SUMMARY
              else
                echo ":x: Failed to execute $filename." >> $GITHUB_STEP_SUMMARY
                status_sum=$((status_sum+1))
              fi
            else
              echo ":x: Compilation failed for $filename." >> $GITHUB_STEP_SUMMARY
              status_sum=$((status_sum+1))
            fi
          done
          # An empty sweep used to pass silently; treat it as a failure.
          if [ "$found" -eq 0 ]; then
            echo "::error::No MPI examples found under $mpi_examples"
            exit 1
          fi
          set -e # Re-enable exit code error checking
          if [ ! $status_sum -eq 0 ]; then
            echo "::error::$status_sum examples failed; see step summary for a list of failures."
            exit $status_sum
          fi

      - name: Realtime validation (released image)
        shell: bash
        run: |
          # debug_image_validation covers the dev image; this checks realtime
          # survives into the released image (runtime deps come from the base image).
          for lib in libcudaq-realtime.so libcudaq-device-call-runtime.so; do
            if [ ! -f "$CUDA_QUANTUM_PATH/lib/$lib" ]; then
              echo "::error::$lib is missing from the released image."
              exit 1
            fi
            if ldd "$CUDA_QUANTUM_PATH/lib/$lib" | grep "not found"; then
              echo "::error::$lib has unresolved dynamic dependencies."
              exit 1
            fi
          done

          cat > /tmp/realtime_probe.cpp <<'EOF'
          #include "cudaq/realtime.h"
          #include <cstdio>
          #include <exception>
          int main() {
            try {
              cudaq::realtime::initialize();
              printf("realtime probe: initialize succeeded\n");
            } catch (const std::exception &e) {
              printf("realtime probe: %s\n", e.what());
            }
            return 0;
          }
          EOF
          cd /tmp && nvq++ -frealtime-lowering realtime_probe.cpp -o realtime_probe
          CUDAQ_LOG_LEVEL=info ./realtime_probe 2>&1 | tee /tmp/realtime_probe.out

          # A plugin load failure or stub warning means realtime is broken here.
          if grep -q "compiled without realtime support" /tmp/realtime_probe.out; then
            echo "::error::libcudaq.so was built without CUDAQ_ENABLE_REALTIME."
            exit 1
          fi
          if ! grep -Eq "initialize succeeded|device_call service plugin was not found" /tmp/realtime_probe.out; then
            echo "::error::Realtime plugin failed to load in the released image."
            exit 1
          fi

  # Tests the Deployments sdists and wheels.
  cudaq_metapackages:
    name: CUDA-Q metapackages
    needs: metadata
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/python_metapackages.yml
    with:
      cudaq_version: ${{ needs.metadata.outputs.cudaq_version }}
      python_versions: "['3.11', '3.12', '3.13', '3.14']"
      cuda_versions: "['', '12.6', '13.0']"
      wheel_artifacts: 'pycudaq-*-manylinux-*'
      logical_wheel_artifacts: 'cudaq_logical-*'
      github_commit: ${{ inputs.github_commit || needs.metadata.outputs.github_commit }}
      build_packages: false
      artifacts_run_id: ${{ needs.metadata.outputs.deployment_id }}

  macos_artifacts:
    name: macOS artifacts
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read

    outputs:
      has_macos_wheels: ${{ steps.fetch.outputs.has_macos_wheels }}

    steps:
      - name: Fetch macOS artifacts from Deployments run
        id: fetch
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # Redirect inside retry() so a retry truncates instead of appending.
          download() { gh api "$1" > "$2"; }

          artifacts_url="${{ needs.metadata.outputs.artifacts_url }}"
          if [ -z "$artifacts_url" ]; then
            echo "No artifacts URL available."
            echo "has_macos_wheels=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Validation does not wait for macOS; wait here until its wheels
          # exist or the Deployments run ends.
          # Keep the list off stdin: unzip eats it when it prompts.
          for attempt in $(seq 1 120); do
            retry gh api "$artifacts_url" --paginate \
              -q '.artifacts[] | {name: .name, url: .archive_download_url}' \
              | jq -c '.' > /tmp/macos_artifacts.jsonl
            wheels=$(grep -c '"pycudaq-[^"]*-darwin-arm64"' /tmp/macos_artifacts.jsonl || true)
            if [ "$wheels" -ge 4 ]; then
              break
            fi
            status=$(retry gh api "repos/${{ github.repository }}/actions/runs/${{ needs.metadata.outputs.deployment_id }}" --jq .status)
            if [ "$status" == "completed" ]; then
              break
            fi
            echo "Waiting for the macOS artifacts ($wheels wheels found, attempt $attempt)."
            sleep 60
          done

          has_macos_wheels=false
          mkdir -p wheels

          while IFS= read -r artifact; do
            name=$(jq -r '.name' <<< "$artifact")
            url=$(jq -r '.url' <<< "$artifact")

            if [[ "$name" == pycudaq-*-darwin-arm64 ]]; then
              python_version=$(echo "$name" | sed 's/pycudaq-\(.*\)-darwin-arm64/\1/')
              echo "Downloading macOS wheel: $name (Python $python_version)"
              retry download "$url" "/tmp/${name}.zip"
              unzip -o "/tmp/${name}.zip" -d wheels/ < /dev/null
              rm "/tmp/${name}.zip"
              has_macos_wheels=true
            fi
          done < /tmp/macos_artifacts.jsonl

          echo "has_macos_wheels=$has_macos_wheels" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload macOS wheels
        if: steps.fetch.outputs.has_macos_wheels == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: darwin-arm64-wheels
          path: wheels/
          retention-days: 1
          if-no-files-found: error

  installer_validation:
    name: Installer validation
    needs: metadata
    runs-on: linux-amd64-gpu-a100-latest-1
    permissions:
      actions: read
      contents: read

    strategy:
      matrix:
        os_image: ['redhat/ubi8:8.10', 'ubuntu:24.04']
        cuda_version: ['12.6', '13.0']
        # The per-backend examples take ~90 min in one job; each shard runs a subset.
        # Few shards, since every one needs a GPU runner and those are scarce.
        shard: [core, tensornet]
      fail-fast: false

    container:
      image: ${{ matrix.os_image }}
      options: --user root
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.github_commit || needs.metadata.outputs.github_commit }}

      - name: Configure validation
        id: config
        run: |
          cuda_major=`echo ${{ matrix.cuda_version }} | cut -d . -f1`
          echo "cuda_major=$cuda_major" >> $GITHUB_OUTPUT

      - name: Load installer
        uses: actions/download-artifact@v8
        with:
          name: cudaq-amd64-cu${{ matrix.cuda_version }}-llvm-installer-${{ needs.metadata.outputs.deployment_id }}
          path: /tmp/install
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}

      - name: Verify installer integrity (re-fetch if corrupt)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: cudaq-amd64-cu${{ matrix.cuda_version }}-llvm-installer-${{ needs.metadata.outputs.deployment_id }}
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          installer=/tmp/install/install_cuda_quantum_cu${{ steps.config.outputs.cuda_major }}.x86_64
          # makeself --check verifies the embedded sha256/size (catches truncated downloads).
          if ! bash "$installer" --check; then
            echo "::warning::Installer failed integrity check after download; re-fetching artifact."
            rm -rf /tmp/install && mkdir -p /tmp/install
            retry gh run download ${{ needs.metadata.outputs.deployment_id }} -R ${{ github.repository }} -n "$ARTIFACT_NAME" -D /tmp/install
            bash "$installer" --check
          fi

      - name: Runtime dependencies (apt)
        if: startsWith(matrix.os_image, 'ubuntu')
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          retry apt-get update
          # binutils (nm) is needed by the license compliance validation.
          # make and pip cmake (>= 4.0) are needed by test_cmake_find_package.sh.
          retry apt-get install -y --no-install-recommends \
            wget ca-certificates libc6-dev libopenmpi-dev binutils make python3-pip
          retry pip3 install --break-system-packages cmake
          distro=`echo ${{ matrix.os_image }} | tr -d . | tr -d :`
          CUDA_DOWNLOAD_URL=https://developer.download.nvidia.com/compute/cuda/repos
          retry wget "${CUDA_DOWNLOAD_URL}/$distro/x86_64/cuda-keyring_1.1-1_all.deb"
          dpkg -i cuda-keyring_1.1-1_all.deb
          cuda_version_suffix="$(echo ${{ matrix.cuda_version }} | tr . -)"
          retry apt-get update
          retry apt-get install -y --no-install-recommends \
          cuda-cudart-$cuda_version_suffix \
          cuda-cudart-dev-$cuda_version_suffix \
          cuda-nvrtc-$cuda_version_suffix \
          libnvjitlink-$cuda_version_suffix \
          libcurand-$cuda_version_suffix \
          libcublas-$cuda_version_suffix \
          libcusparse-$cuda_version_suffix \
          libcusolver-$cuda_version_suffix

      - name: Runtime dependencies (dnf)
        if: startsWith(matrix.os_image, 'redhat')
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # dnf-specific retry: clears cached metadata between attempts so that
          # a stale 404 from a CDN mirror doesn't poison the cache for retry #2.
          retry_dnf() { local pre=""; [ "$(id -u)" -ne 0 ] && pre=sudo; for n in 1 2 3; do $pre dnf "$@" && return 0; [ $n -lt 3 ] && { $pre dnf clean metadata >/dev/null 2>&1 || true; sleep $((15*n*n)); }; done; return 1; }
          # make is needed by test_cmake_find_package.sh; cmake comes from conda
          # below, since ubi8 ships Python 3.6 and pip cannot install cmake 4.x.
          retry_dnf install -y --nobest --setopt=install_weak_deps=False \
            'dnf-command(config-manager)' glibc-devel openssh-clients binutils make
          CUDA_VERSION=${{ matrix.cuda_version }}
          DISTRIBUTION=rhel8
          . scripts/configure_build.sh install-cudart

          # Install MPI (needed for nvidia-mgpu) via conda in a shared path so
          # the non-root test user can reach it.
          retry_dnf install -y --nobest --setopt=install_weak_deps=False wget
          conda_prefix=/opt/miniconda3
          retry wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-$(uname -m).sh -O /tmp/miniconda.sh
          bash /tmp/miniconda.sh -b -u -p "$conda_prefix"
          rm -f /tmp/miniconda.sh
          eval "$($conda_prefix/bin/conda shell.bash hook)"
          export CONDA_OVERRIDE_CUDA="$CUDA_VERSION"
          retry conda install -y --override-channels -c conda-forge openmpi">=5.0.7" cmake">=4.0"
          chmod -R a+rX "$conda_prefix"

      - name: Install and run sanity checks
        shell: bash
        run: |
          useradd -m cudaqtest
          install_path=/home/cudaqtest/.cudaq
          mkdir -p "$install_path"
          chown cudaqtest "$install_path"

          installer=install_cuda_quantum_cu$(echo ${{ matrix.cuda_version }} | cut -d . -f1).x86_64
          chmod +x /tmp/install/$installer
          su cudaqtest -c "bash /tmp/install/$installer --accept -- --installpath $install_path"

          # Set up the test user's environment for MPI (RHEL conda path)
          cat >> /home/cudaqtest/.bashrc << 'ENVEOF'
          if [ -d /opt/miniconda3 ]; then
            eval "$(/opt/miniconda3/bin/conda shell.bash hook)"
            export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$CONDA_PREFIX/lib"
            export OMPI_MCA_opal_cuda_support=true OMPI_MCA_btl='^openib'
          fi
          ENVEOF
          chown cudaqtest /home/cudaqtest/.bashrc

          # Copy validation inputs to the test user's workspace
          workdir=/home/cudaqtest/validation
          mkdir -p "$workdir"
          cp -R docs/sphinx/examples "$workdir/examples"
          cp -R docs/sphinx/applications "$workdir/applications"
          cp -R docs/sphinx/targets "$workdir/targets"
          rm -rf "$workdir/examples/python" "$workdir/applications/python" "$workdir/targets/python"
          cp scripts/validate_installation.sh "$workdir/"
          cp scripts/validate_license_compliance.sh "$workdir/"
          # Without this the CMake integration test silently skips itself.
          cp scripts/test_cmake_find_package.sh "$workdir/"
          chown -R cudaqtest "$workdir"

          touch "$GITHUB_STEP_SUMMARY"
          chmod a+w "$GITHUB_STEP_SUMMARY"

          # The tensornet backends take ~40 min, so they get their own shard. The
          # core shard has all other backends and the non-backend tests.
          case "${{ matrix.shard }}" in
            core)
              backends=""; exclude="tensornet tensornet-mps"; target_only=false ;;
            tensornet)
              backends="tensornet tensornet-mps"; exclude=""; target_only=true ;;
          esac

          su cudaqtest -ls /bin/bash -c "
            set -o pipefail
            source ${install_path}/set_env.sh
            cd ${workdir}
            GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY \
            CUDAQ_VALIDATION_EXCLUDE='$exclude' \
            CUDAQ_VALIDATION_TARGET_TESTS_ONLY=$target_only \
            bash validate_installation.sh $backends | tee /tmp/validation.out
          "

          # Check that the tests included the nvidia-mgpu backend:
          [ "${{ matrix.shard }}" == "core" ] || exit 0
          nvidia_block_start=$(grep -n "Testing on nvidia target..." /tmp/validation.out | head -n1 | cut -d: -f1)
          nvidia_block=$(tail -n +$((nvidia_block_start + 1)) /tmp/validation.out | sed -n '/^Testing on /q;p')

          if ! echo "$nvidia_block" | grep -q "fp32,mgpu"; then
            echo "::error::Missing tests for nvidia fp32,mgpu backend."
            echo "Observed target options:"
            echo "$nvidia_block"
            exit 1
          fi

  wheel_validation_piponly:
    name: Wheel validation, pip only
    needs: metadata
    permissions:
      actions: read
      contents: read

    strategy:
      matrix:
        platform: ['amd64-gpu-a100', 'arm64-gpu-a100']
        cuda_major: ['', '12', '13']
      fail-fast: false

    runs-on: linux-${{ matrix.platform }}-latest-1

    container:
      image: ubuntu:24.04
      options: --user root
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.github_commit || needs.metadata.outputs.github_commit }}

      - name: Load CUDA-Q wheels
        uses: actions/download-artifact@v8
        with:
          pattern: 'pycudaq-*-manylinux-*'
          path: /tmp/wheels
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Load CUDA-Q Logical wheels
        uses: actions/download-artifact@v8
        with:
          pattern: 'cudaq_logical-*'
          path: /tmp/wheels
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Load metapackage
        if: ${{ matrix.cuda_major == '' }}
        uses: actions/download-artifact@v8
        with:
          name: cudaq-metapackage-${{ needs.metadata.outputs.cudaq_version }}
          path: /tmp/packages
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}

      - name: Run basic validation
        shell: bash
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          # Non-MPI smoke tests. Create a clean python3 environment.
          retry apt-get update
          retry apt-get install -y --no-install-recommends python3 python3-pip python3-venv

          # Make a place for local wheels
          mkdir -p /tmp/packages && mv /tmp/wheels/* /tmp/packages && rmdir /tmp/wheels

          # Create and activate virtual environment
          python3 -m venv /opt/cudaq-venv
          source /opt/cudaq-venv/bin/activate

          if [ -n "${{ matrix.cuda_major }}" ]; then
            retry pip install cuda-quantum-cu${{ matrix.cuda_major }}==${{ needs.metadata.outputs.cudaq_version }} -v \
              --find-links "file:///tmp/packages"
          else
            retry pip install --upgrade pip
            retry pip install cudaq==${{ needs.metadata.outputs.cudaq_version }} -v \
              --find-links "file:///tmp/packages" \
            2>&1 | tee /tmp/install.out

            if [ -z "$(cat /tmp/install.out | grep -o 'Autodetection succeeded')" ]; then
              echo "::error::Autodetection to determine cudaq binary distribution failed."
              exit 1
            fi
          fi

          status_sum=0
          set +e # Allow script to keep going through errors
          # Verify the GPU targets install and run (nvidia-mgpu excluded: needs MPI).
          targets=("--target nvidia" "--target nvidia --target-option fp64" "--target tensornet")
          for tgt in "${targets[@]}"; do
              echo "Running with ${tgt}"
              python3 docs/sphinx/examples/python/intro.py $tgt
              if [ $? -ne 0 ]; then
                  echo -e "\e[01;31mPython trivial test for ${tgt} failed.\e[0m" >&2
                  status_sum=$((status_sum+1))
              fi
          done

          # Also need to test dynamics. The example script became notebooks in
          # #2900, so exercise the repo's dynamics suite against the wheel.
          echo "Running with target dynamics"
          retry python3 -m pip install pytest
          python3 -m pytest python/tests/dynamics -q
          if [ $? -ne 0 ]; then
              echo -e "\e[01;31mPython trivial test for dynamics failed.\e[0m" >&2
              status_sum=$((status_sum+1))
          fi

          set -e # Re-enable exit code error checking
          if [ "$status_sum" -ne "0" ]; then
            echo "::error::Error running validation script"
            exit $status_sum
          fi

  metapackage_validation_conda:
    name: Python metapackage validation, conda environment
    needs: metadata
    runs-on: linux-amd64-gpu-a100-latest-1
    permissions:
      actions: read
      contents: read

    strategy:
      matrix:
        # Version of the conda 'nvidia/label/cuda' channel (13.0.0 lacks proper
        # CUDA 13 packages, so use later channels).
        cuda_version_conda: ['12.6.0', '13.0.2']
      fail-fast: false

    # Environment is required to access environment secrets.
    environment:
      name: ghcr-deployment
      url: ${{ vars.deployment_url }}
      deployment: false

    container:
      image: ubuntu:24.04
      options: --user root
      env:
        NVIDIA_VISIBLE_DEVICES: ${{ env.NVIDIA_VISIBLE_DEVICES }}
        TERM: xterm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.github_commit || needs.metadata.outputs.github_commit }}

      - name: Load CUDA-Q wheels
        uses: actions/download-artifact@v8
        with:
          pattern: 'pycudaq-*-manylinux-*'
          path: /tmp/wheels
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Load CUDA-Q Logical wheels
        uses: actions/download-artifact@v8
        with:
          pattern: 'cudaq_logical-*'
          path: /tmp/wheels
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Load metapackage
        uses: actions/download-artifact@v8
        with:
          name: cudaq-metapackage-${{ needs.metadata.outputs.cudaq_version }}
          path: /tmp/packages
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}

      - name: Run validation
        shell: bash
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          retry apt-get update
          retry apt-get install -y --no-install-recommends \
            ca-certificates vim wget unzip openssh-client binutils
          mv /tmp/wheels/* /tmp/packages && rmdir /tmp/wheels

          # Extract README from metapackage
          cudaq_metapackage=cudaq-${{ needs.metadata.outputs.cudaq_version }}
          tar xf /tmp/packages/${cudaq_metapackage}.tar.gz && mv -v ${cudaq_metapackage}/README.md .
          rm -rf ${cudaq_metapackage} && readme=README.md

          # Setup files for validate_pycudaq.sh script
          # Important: Notebooks are *not* validated by validate_pycudaq.sh.
          cp    $GITHUB_WORKSPACE/scripts/validate_pycudaq.sh .
          cp    $GITHUB_WORKSPACE/scripts/validate_license_compliance.sh .
          cp -r $GITHUB_WORKSPACE/docs/sphinx/examples/python /tmp/examples/
          cp -r $GITHUB_WORKSPACE/docs/sphinx/snippets/python /tmp/snippets/
          cp -r $GITHUB_WORKSPACE/python/tests /tmp/tests/
          cp    $GITHUB_WORKSPACE/$readme /tmp/README.md
          # Target tests should not be run here either, since that requires credentials but doesn't require a GPU runner.

          # Run the script w/ -q to run a shortened test
          set +e # Allow script to keep going through errors (needed for skipped tests)
          source validate_pycudaq.sh \
            -v ${{ needs.metadata.outputs.cudaq_version }} \
            -i /tmp/packages -f /tmp \
            -c ${{ matrix.cuda_version_conda }} -p 3.12
          script_rc=$?
          set -e # Re-enable exit code error checking

          expected_dependency=cuda-quantum-cu$(echo ${{ matrix.cuda_version_conda }} | cut -d . -f1)
          if [ -z "$(python3 -m pip list | grep ${expected_dependency})" ]; then
            echo "::error::Missing installation of ${expected_dependency} package."
            exit 1
          fi
          # The script returns early on setup errors, so check its return code.
          if [ "$script_rc" -ne "0" ]; then
            echo "::error::Error running validation script"
            exit $script_rc
          fi

  metapackage_validation_macos:
    name: Python metapackage validation, macOS
    needs: [metadata, macos_artifacts]
    if: needs.macos_artifacts.outputs.has_macos_wheels == 'true'
    runs-on: macos-15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.github_commit || needs.metadata.outputs.github_commit }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download macOS wheels
        uses: actions/download-artifact@v8
        with:
          name: darwin-arm64-wheels
          path: /tmp/wheels

      - name: Download metapackage
        uses: actions/download-artifact@v8
        with:
          name: cudaq-metapackage-${{ needs.metadata.outputs.cudaq_version }}
          path: /tmp/metapackages
          run-id: ${{ needs.metadata.outputs.deployment_id }}
          github-token: ${{ github.token }}

      - name: Validate metapackage install chain
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          mkdir -p /tmp/packages
          mv /tmp/wheels/* /tmp/packages
          mv /tmp/metapackages/* /tmp/packages

          python3 -m venv /tmp/metapackage-test
          source /tmp/metapackage-test/bin/activate
          retry pip install --upgrade pip

          retry pip install "cudaq==${{ needs.metadata.outputs.cudaq_version }}" \
            --find-links "file:///tmp/packages"

          expected_dependency=cuda-quantum-cu13
          if [ -z "$(pip list | grep ${expected_dependency})" ]; then
            echo "::error::Metapackage did not install ${expected_dependency}."
            exit 1
          fi
          if [ "$(python3 -c 'import cudaq; print(cudaq.get_target().name)')" != "qpp-cpu" ]; then
            echo "::error::Unexpected cudaq target after metapackage install."
            exit 1
          fi
          deactivate

      - name: Run validation test suite
        shell: bash
        run: |
          set +e
          source scripts/validate_pycudaq.sh \
            -v ${{ needs.metadata.outputs.cudaq_version }} \
            -i /tmp/packages \
            -p 3.12 -F
          script_rc=$?
          set -e

          expected_dependency=cuda-quantum-cu13
          if [ -z "$(pip list | grep ${expected_dependency})" ]; then
            echo "::error::Missing installation of ${expected_dependency} package."
            exit 1
          fi
          # The script returns early on setup errors, so check its return code.
          if [ "$script_rc" -ne "0" ]; then
            echo "::error::Error running validation script"
            exit $script_rc
          fi
