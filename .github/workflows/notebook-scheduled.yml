on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all notebook outputs'
        type: boolean
        default: false

name: Notebook Scheduled Execution

concurrency:
  group: notebook-scheduled
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run-notebooks:
    name: Execute Notebooks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install jupyter nbconvert
          pip install -e .[chemistry,visualization,integrators]

      - name: Find all notebooks
        id: notebooks
        run: |
          # Find all .ipynb files in docs/sphinx
          find docs/sphinx -name "*.ipynb" -not -path "*/.ipynb_checkpoints/*" | sort > notebooks.txt
          echo "found=$(cat notebooks.txt | wc -l)" >> $GITHUB_OUTPUT
          echo "notebooks<<EOF" >> $GITHUB_OUTPUT
          cat notebooks.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Execute notebooks
        id: execute
        run: |
          python << 'PYEOF'
          import json
          import subprocess
          import sys
          import os
          
          with open('notebooks.txt', 'r') as f:
              notebooks = [line.strip() for line in f if line.strip()]
          
          changed_files = []
          errors = []
          
          for nb_path in notebooks:
              print(f"Executing: {nb_path}")
              try:
                  # Execute notebook with nbconvert
                  result = subprocess.run([
                      'jupyter', 'nbconvert',
                      '--to', 'notebook',
                      '--execute',
                      '--inplace',
                      '--ExecutePreprocessor.timeout=300',
                      '--ExecutePreprocessor.kernel_name=python3',
                      nb_path
                  ], capture_output=True, text=True, timeout=600)
                  
                  if result.returncode != 0:
                      errors.append(f"{nb_path}: {result.stderr}")
                      print(f"ERROR: {nb_path}")
                      print(result.stderr)
                  else:
                      # Check if file changed
                      diff_result = subprocess.run(['git', 'diff', '--exit-code', nb_path], capture_output=True)
                      if diff_result.returncode == 1:
                          changed_files.append(nb_path)
                          print(f"CHANGED: {nb_path}")
                      else:
                          print(f"OK: {nb_path}")
              except subprocess.TimeoutExpired:
                  errors.append(f"{nb_path}: Timeout after 10 minutes")
              except Exception as e:
                  errors.append(f"{nb_path}: {str(e)}")
          
          # Write results
          with open('changed_files.txt', 'w') as f:
              f.write('\n'.join(changed_files))
          with open('errors.txt', 'w') as f:
              f.write('\n'.join(errors))
          
          if errors:
              print("ERRORS:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          
          print(f"Changed files: {len(changed_files)}")
          for f in changed_files:
              print(f"  {f}")
          PYEOF

      - name: Create PR if changes
        if: ${{ steps.execute.outputs.exitcode == 0 && steps.notebooks.outputs.found > 0 }}
        run: |
          if [ -s changed_files.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            branch_name="notebook-update-$(date +%Y%m%d)"
            git checkout -b "$branch_name"
            git add $(cat changed_files.txt)
            git commit -m "docs: update notebook execution outputs
            git commit -m "docs: update notebook execution outputs

      - name: Create PR if changes
        if: ${{ success() && steps.notebooks.outputs.found > 0 }}
        run: |
          if [ -s changed_files.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            branch_name="notebook-update-$(date +%Y%m%d)"

            git checkout -b "$branch_name"

            git add $(cat changed_files.txt)

            git commit -m "docs: update notebook execution outputs"

            git push origin "$branch_name"

            gh pr create \
              --title "docs: automated notebook output update $(date +%Y-%m-%d)" \
              --body "Automated update of notebook execution outputs from the scheduled workflow." \
              --label "documentation" \
              --label "automated"
          else
            echo "No changes to commit"
          fi
        env:
          GH_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}

      - name: Report errors
        if: ${{ failure() }}
        run: |
          if [ -f errors.txt ]; then
            echo "## Notebook Execution Errors"
            cat errors.txt
          fi
