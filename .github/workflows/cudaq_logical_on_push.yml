# For any PR that touches the cudaq.logical preview folder
#  - run the `cudaq_logical.yml` workflow on platform x python version
#  - run the docs `cudaq_logical_docs.yml` workflow.

name: Build and test cudaq.logical

on:
  push:
    branches:
      - "pull-request/[0-9]+"

jobs:
  build_and_test_amd64_py311:
    name: Build and test cudaq.logical (linux/amd64, 3.11)
    uses: ./.github/workflows/cudaq_logical.yml
    with:
      platform: linux/amd64
      python_version: "3.11"
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}

  docs:
    needs: [build_and_test_amd64_py311]
    name: Build cudaq.logical docs
    uses: ./.github/workflows/cudaq_logical_docs.yml
    with:
      platform: linux/amd64
      python_version: "3.11"
      wheel_name: ${{ needs.build_and_test_amd64_py311.outputs.wheel_name }}
      runtime_artifact_name:
        ${{ needs.build_and_test_amd64_py311.outputs.runtime_artifact_name }}
      metapackage_artifact_name:
        ${{ needs.build_and_test_amd64_py311.outputs.metapackage_artifact_name
        }}
      cudaq_version:
        ${{ needs.build_and_test_amd64_py311.outputs.cudaq_version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}

  build_and_test:
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        python_version: [3.11, 3.13, 3.14]
        exclude:
          # Runs as the dedicated build_and_test_amd64_py311 job above.
          - platform: linux/amd64
            python_version: 3.11

    name: Build and test cudaq.logical
    uses: ./.github/workflows/cudaq_logical.yml
    with:
      platform: ${{ matrix.platform }}
      python_version: ${{ matrix.python_version }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
