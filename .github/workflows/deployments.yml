on:
  # We update the build caches during the pull_request_target event, 
  # and deploy the images via workflow dispatch on branches with deployment permissions.
  # A dispatch event is automatically triggered when the pull_request_target event
  # triggers the workflow.
  workflow_dispatch:
    inputs:
      run_validation_after:
        type: boolean
        description: When this deployment completes successfully, also trigger the Validation workflow.
        required: false
        default: true
      update_registry_cache:
        type: boolean
        description: Create or update the build caches on the container registry. The build terminates after that and no images are pushed.
        required: false
        default: false
      refresh_ccache:
        type: boolean
        description: Save the compiler caches of this run under the branch's tag and restore them from there. Runs on main, schedules, merge queues and PRs always save them.
        required: false
        default: false
      cache_base:
        required: false
        type: string
        description: 'The name of the branch to use as cache base.'
        default: main
      platforms:
        type: string
        description: The platforms to build the Docker images for. A semicolon separated list creates a separate list for each platform, whereas a comma separate list creates a multi-platform build.
        required: false
        default: default
      devcontainer_only:
        type: boolean
        description: Build and push only the dev container image.
        required: false
        default: false
      create_release:
        type: string
        description: Create a GitHub release with the given version number (e.g. 0.3.0). A GitHub release with that version must not exist already.
        required: false
        default: ''
      include_macos:
        type: boolean
        description: Build and include macOS wheels and installer.
        required: false
        default: true
  workflow_run:
    workflows:
      - PR merged
    types:
      - completed
    # PR merged workflow runs after merge into certain branches an on pull_request_target;
    # there should hence be no need for additional branch filtering here.
  schedule:
    # Keep this half an hour after Update GHCR, which prunes the build caches.
    - cron: "0 14 * * *"
  push:
    branches:
      - 'releases/*'
      - 'staging/*'
      - 'experimental/*'
      - 'features/*'

name: Deployments # do not change name without updating workflow_run triggers

concurrency:
  # The nightly cache refresh must not queue behind (or be replaced by) deployments.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare build
    if: github.event_name != 'push' || github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    outputs:
      pull_request_number: ${{ steps.pr_info.outputs.pr_number }}
      pull_request_base: ${{ steps.pr_info.outputs.pr_base }}
      pull_request_commit: ${{ steps.pr_info.outputs.merge_commit }}
      llvm_commit: ${{ steps.build_config.outputs.llvm_commit }}
      nanobind_commit: ${{ steps.build_config.outputs.nanobind_commit }}
      cache_base: ${{ steps.build_info.outputs.cache_base }}
      cache_target: ${{ steps.build_info.outputs.cache_target }}
      multi_platform: ${{ steps.build_info.outputs.multi_platform }}
      platforms: ${{ steps.build_info.outputs.platforms }}
      build_dependencies: ${{ steps.build_config.outputs.build_dependencies }}
      create_packages: ${{ steps.build_config.outputs.create_packages }}
      environment: ${{ steps.build_info.outputs.environment }}
      release_title: ${{ steps.build_info.outputs.release_title }}
      release_version: ${{ steps.build_info.outputs.release_version }}
      cudaq_version: ${{ steps.build_info.outputs.cudaq_version }}
      package_version: ${{ steps.build_info.outputs.package_version }}

    steps:
      - name: Retrieve PR info
        if: github.event_name == 'workflow_run'
        id: pr_info
        run: |
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }
          artifacts_url=${{ github.event.workflow_run.artifacts_url }}
          artifacts=$(retry gh api $artifacts_url -q '.artifacts[] | {name: .name, url: .archive_download_url}')

          for artifact in `echo "$artifacts"`; do
            name=`echo $artifact | jq -r '.name'`
            if [ "$name" == "metadata_pr" ]; then
              url=`echo $artifact | jq -r '.url'`
              retry gh api $url > metadata.zip
              unzip -d metadata metadata.zip
              for file in `find metadata/ -type f`; do
                cat "$file" >> metadata.txt
              done
              pr_number=`cat metadata.txt | grep -o 'pr-number: \S*' | cut -d ' ' -f 2`
              pr_base=`cat metadata.txt | grep -o 'pr-base: \S*' | cut -d ' ' -f 2`
              merge_commit=`cat metadata.txt | grep -o 'source-sha: \S*' | cut -d ' ' -f 2`
              rm -rf metadata.zip metadata.txt metadata
              echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
              echo "pr_base=$pr_base" >> $GITHUB_OUTPUT
              echo "merge_commit=$merge_commit" >> $GITHUB_OUTPUT
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine build info
        id: build_info
        run: |
          if ${{ github.event_name == 'workflow_dispatch' }}; then
            defaults="${{ ((inputs.update_registry_cache || github.event_name == 'schedule') && 'linux/arm64 linux/amd64') || 'linux/amd64,linux/arm64' }}"
            requested_platforms=`echo "${{ inputs.platforms }}" | tr + , | sed "s#default#$defaults#g"`
          else
            requested_platforms="linux/arm64 linux/amd64"
          fi

          if [ -n "$(echo "$requested_platforms" | egrep ',')" ]; then
            multi_platform="{\"ids\":[]}"
            platform_flag=`echo "$requested_platforms" | tr -d ' '`
            multi_platform=`echo $multi_platform | jq ".ids |= . + [\"multiplat\"]"`
            platform={\"multiplat\":{\"docker_flag\":\"$platform_flag\"}}
            multi_platform=`echo $multi_platform | jq ". |= . + $platform"`
          fi

          platforms="{\"ids\":[]}"
          for input in `echo "$requested_platforms" | tr , ' ' | tr ';' ' '`; do
            platform_id=`echo $input | sed 's/linux\///g' | tr -d ' '`
            minimal_base_image=`([ "$platform_id" == "amd64" ] && echo amd64/almalinux:8) || ([ "$platform_id" == "arm64" ] && echo arm64v8/almalinux:8) || echo`
            platforms=`echo $platforms | jq ".ids |= . + [\"$platform_id\"]"`
            platform={\"$platform_id\":{\"docker_flag\":\"$input\",\"minimal_base_image\":\"$minimal_base_image\"}}
            platforms=`echo $platforms | jq ". |= . + $platform"`
          done

          cache_base=${{ (github.event_name == 'push' && 'main') || inputs.cache_base || steps.pr_info.outputs.pr_base }}
          cache_target=${{ (github.event_name != 'workflow_dispatch' && (steps.pr_info.outputs.pr_base || github.ref_name)) || (inputs.update_registry_cache && github.ref_name) || '' }}
          environment=${{ (github.event_name != 'workflow_run' && 'ghcr-deployment') || '' }}

          # Store deployment info
          release_title="${{ inputs.create_release }}"
          release_version=`echo "$release_title" | (egrep -o "([0-9]{1,}\.)+[0-9]{1,}([A-Za-z0-9_\-\.]*)" || true)`
          if [ -n "$release_title" ] && [ -z "$release_version" ]; then
            echo "::error::create_release must contain a version number (e.g. 0.16.0), got '$release_title'."
            exit 1
          fi
          # Packages get the PEP 440 part; other suffixes (-rc1) only reach the tag.
          cudaq_version=`echo "$release_version" | (egrep -o "^([0-9]+\.)+[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?" || true)`

          # Metapackages pin the wheel version.
          is_versioned=${{ github.ref_type == 'tag' || startsWith(github.ref_name, 'releases/') || startsWith(github.ref_name, 'staging/') }}
          if [ -n "$cudaq_version" ]; then
            package_version=$cudaq_version
          elif $is_versioned; then
            package_version=`echo ${{ github.ref_name }} | egrep -o "([0-9]{1,}\.)+[0-9]{1,}"`
          else
            package_version=0.0.0
          fi

          echo "source-sha: ${{ github.sha }}" >> deployment_info.txt
          echo "release-title: $release_title" >> deployment_info.txt
          echo "release-version: $release_version" >> deployment_info.txt
          echo "cudaq-version: $package_version" >> deployment_info.txt

          echo "cache_base=$cache_base" >> $GITHUB_OUTPUT
          echo "cache_target=$cache_target" >> $GITHUB_OUTPUT
          echo "multi_platform=$(echo $multi_platform)" >> $GITHUB_OUTPUT
          echo "platforms=$(echo $platforms)" >> $GITHUB_OUTPUT
          echo "environment=$environment" >> $GITHUB_OUTPUT
          echo "release_title=$release_title" >> $GITHUB_OUTPUT
          echo "release_version=$release_version" >> $GITHUB_OUTPUT
          echo "cudaq_version=$cudaq_version" >> $GITHUB_OUTPUT
          echo "package_version=$package_version" >> $GITHUB_OUTPUT

      - name: Upload deployment info
        uses: actions/upload-artifact@v7
        with:
          name: deployment_info # changing the artifact name requires updating other workflows
          path: deployment_info.txt
          retention-days: 30
          if-no-files-found: error

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: "${{ steps.pr_info.outputs.merge_commit }}"

      - name: Configure build
        id: build_config
        run: |
          echo "llvm_commit=$(git rev-parse @:./tpls/llvm)" >> $GITHUB_OUTPUT
          echo "nanobind_commit=$(git rev-parse @:./tpls/nanobind)" >> $GITHUB_OUTPUT

          if ${{ github.event_name != 'workflow_run' || steps.pr_info.outputs.pr_number != '' }}; then
            echo "build_dependencies=true" >> $GITHUB_OUTPUT
          fi
          if ${{ github.event_name == 'workflow_dispatch' && ! inputs.update_registry_cache }}; then
            echo "create_packages=true" >> $GITHUB_OUTPUT
          fi

  devdeps:
    name: Build dev dependencies
    needs: metadata
    if: needs.metadata.outputs.build_dependencies == 'true'
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        toolchain: [llvm, gcc12]
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/devdeps.Dockerfile
      build_config_id: ${{ matrix.toolchain }}
      build_args: |
        toolchain=${{ matrix.toolchain }}
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      pull_request_number: ${{ needs.metadata.outputs.pull_request_number }}
      pull_request_commit: ${{ needs.metadata.outputs.pull_request_commit }}
      checkout_submodules: true
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-${{ matrix.toolchain }}

  # CUDA 12 has no 26.04 images, so it stays on 24.04.
  devdeps_ubuntu2404:
    name: Build dev dependencies (Ubuntu 24.04)
    needs: metadata
    if: needs.metadata.outputs.build_dependencies == 'true'
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/devdeps.Dockerfile
      build_config_id: gcc12-ubuntu24.04
      build_args: |
        toolchain=gcc12
        base_image=ubuntu:24.04
        libstdcxx_version=13
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      pull_request_number: ${{ needs.metadata.outputs.pull_request_number }}
      pull_request_commit: ${{ needs.metadata.outputs.pull_request_commit }}
      checkout_submodules: true
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-gcc12-ubuntu24.04

  wheeldeps:
    name: Build wheel dependencies
    needs: metadata
    if: needs.metadata.outputs.build_dependencies == 'true'
    strategy:
      matrix:
        # There are currently no multi-platform manylinux images available.
        # See https://github.com/pypa/manylinux/issues/1306.
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/devdeps.manylinux.Dockerfile
      build_config_id: cu${{ matrix.cuda_version }}-gcc12
      build_args: |
        base_image=ghcr.io/nvidia/pypa/manylinux_2_28${{ (matrix.platform == 'arm64' && '_aarch64') || (matrix.platform == 'amd64' && '_x86_64') || '' }}:latest
        cuda_version=${{ matrix.cuda_version }}
        toolchain=gcc12
        distro=rhel8
        llvm_commit=${{ needs.metadata.outputs.llvm_commit }}
        nanobind_commit=${{ needs.metadata.outputs.nanobind_commit }}
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      pull_request_number: ${{ needs.metadata.outputs.pull_request_number }}
      pull_request_commit: ${{ needs.metadata.outputs.pull_request_commit }}
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-cu${{ matrix.cuda_version }}-python

  source_build:
    name: Build cross-platform dependencies
    needs: metadata
    if: needs.metadata.outputs.build_dependencies == 'true'
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/assets.Dockerfile
      build_config_id: cu${{ matrix.cuda_version }}-llvm
      build_target: prereqs
      build_args: |
        base_image=${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].minimal_base_image }}
        cuda_version=${{ matrix.cuda_version }}
        toolchain=llvm
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      pull_request_number: ${{ needs.metadata.outputs.pull_request_number }}
      pull_request_commit: ${{ needs.metadata.outputs.pull_request_commit }}
      checkout_submodules: true
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-cu${{ matrix.cuda_version }}-installer

  source_build_python:
    name: Build cross-platform dependencies (Python)
    needs: metadata
    # Only refreshes the cache that the installer build restores its Python toolchain from.
    if: needs.metadata.outputs.build_dependencies == 'true' && needs.metadata.outputs.cache_target != ''
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/assets.Dockerfile
      build_config_id: cu${{ matrix.cuda_version }}-llvm
      build_target: prereqs_python
      build_args: |
        base_image=${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].minimal_base_image }}
        cuda_version=${{ matrix.cuda_version }}
        toolchain=llvm
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      pull_request_number: ${{ needs.metadata.outputs.pull_request_number }}
      pull_request_commit: ${{ needs.metadata.outputs.pull_request_commit }}
      checkout_submodules: true
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-cu${{ matrix.cuda_version }}-installer-python

  openmpi:
    name: Build Open MPI
    needs: metadata
    if: needs.metadata.outputs.build_dependencies == 'true'
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/devdeps.ompi.Dockerfile
      build_config_id: cu${{ matrix.cuda_version }}
      # 26.04 needs CUDA 13.3+; the 13.0 label is kept for tags and keys.
      build_args: |
        cuda_version=${{ matrix.cuda_version == '13.0' && '13.3' || matrix.cuda_version }}
        ubuntu_version=${{ startsWith(matrix.cuda_version, '12.') && '24.04' || '26.04' }}
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-cu${{ matrix.cuda_version }}-ompi

  dispatch:
    name: Dispatch deployments
    needs: [metadata, devdeps, devdeps_ubuntu2404, wheeldeps, source_build, openmpi]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v9
        with:
          # We want this dispatch to trigger additional workflows.
          github-token: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          script: |
            // The createWorkflowDispatch call has been observed to hit transient
            // GitHub API 5xx errors; retry up to 3 times with exponential backoff.
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deployments.yml',
              ref: '${{ needs.metadata.outputs.pull_request_base || github.ref_name }}',
              inputs: {
                platforms: 'linux/arm64 linux/amd64',
                cache_base: '${{ needs.metadata.outputs.cache_base }}',
                devcontainer_only: ${{ github.event_name == 'schedule' }}
              },
            };
            for (let n = 1; n <= 3; n++) {
              try {
                await github.rest.actions.createWorkflowDispatch(params);
                if (n > 1) core.notice(`createWorkflowDispatch succeeded on attempt ${n}`);
                return;
              } catch (err) {
                if (n === 3) throw err;
                core.warning(`createWorkflowDispatch attempt ${n}/3 failed: ${err.message}; retrying...`);
                await sleep(15000 * n * n);
              }
            }

  # This job is needed only when using the matrix-outputs action to read
  # the output of a matrix job. This is a workaround due to current GitHub
  # limitations that may not be needed if the work started here concludes:
  # https://github.com/actions/runner/pull/2477
  config:
    name: Configure build
    needs: [metadata, devdeps, devdeps_ubuntu2404, wheeldeps, source_build, openmpi]
    if: needs.metadata.outputs.create_packages == 'true'
    runs-on: ubuntu-latest

    outputs:
      json: "${{ steps.read_json.outputs.result }}"

    steps:
      - name: Checkout action code
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/matrix-outputs-read
        id: read_json
        with:
          matrix-step-name: dev_environment

      - name: Print config.outputs.json
        run: |
          echo '${{ steps.read_json.outputs.result }}'

  extdevdeps:
    name: Create dev environment
    needs: [metadata, config, openmpi]
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/dev_environment.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      dockerfile: build/devcontainer.Dockerfile
      build_config_id: cu${{ matrix.cuda_version }}-gcc12
      build_args: |
        cuda_version=${{ matrix.cuda_version == '13.0' && '13.3' || matrix.cuda_version }}
        python_version=${{ startsWith(matrix.cuda_version, '12.') && '3.12' || '3.14' }}
        base_image=${{ fromJson(needs.config.outputs.json).image_hash[format('{0}-gcc12{1}', matrix.platform, startsWith(matrix.cuda_version, '12.') && '-ubuntu24.04' || '')] }}
        ompidev_image=${{ fromJson(needs.config.outputs.json).image_hash[format('{0}-cu{1}-ompi', matrix.platform, matrix.cuda_version)] }}
      registry_cache_from: ${{ needs.metadata.outputs.cache_base }}
      update_registry_cache: ${{ needs.metadata.outputs.cache_target }}
      environment: ${{ needs.metadata.outputs.environment }}
      # needed only for the matrix-outputs action
      matrix_key: ${{ matrix.platform }}-cu${{ matrix.cuda_version }}-ext

  # This job is needed only when using the matrix-outputs action to read
  # the output of a matrix job. This is a workaround due to current GitHub
  # limitations that may not be needed if the work started here concludes:
  # https://github.com/actions/runner/pull/2477
  ext_config:
    name: Configure build
    needs: extdevdeps
    runs-on: ubuntu-latest

    outputs:
      json: "${{ steps.read_json.outputs.result }}"

    steps:
      - name: Checkout action code
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/matrix-outputs-read
        id: read_json
        with:
          matrix-step-name: dev_environment

      - name: Print ext_config.outputs.json
        run: |
          echo '${{ steps.read_json.outputs.result }}'

  stitch_devdeps:
    name: Stitch devdeps (CUDA ${{ matrix.cuda }}) images
    needs: ext_config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda: ["12.6", "13.0"]

    environment: ghcr-deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up environment
        run: |
          docker context create builder_context || echo "Context exists"
          docker context use builder_context

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
        with:
          endpoint: builder_context

      - name: Login to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: metadata for jobs
        id: metadata
        run: |
          set -euo pipefail
          EXT_JSON='${{ needs.ext_config.outputs.json }}'
          echo "ext_json<<EOF" | tee -a "$GITHUB_OUTPUT"
          echo "$EXT_JSON" | tee -a "$GITHUB_OUTPUT"
          echo "EOF" | tee -a "$GITHUB_OUTPUT"

      - name: Stitch devdeps image
        run: |
          cuda="${{ matrix.cuda }}"
          cuda_major="${cuda%%.*}"
          EXT_JSON='${{ steps.metadata.outputs.ext_json }}'

          refs=""
          for arch in arm64 amd64; do
            key="${arch}-cu${cuda}-ext"
            image=$(echo "$EXT_JSON" | jq -r ".image_hash[\"$key\"]")
            refs="$refs $image"
          done

          registry=$(echo "$image" | cut -d'@' -f1)

          # Retrieve image tag from EXT_JSON, just look at amd64 and filter it out
          key="amd64-cu${cuda}-ext"
          image_tag=$(echo "$EXT_JSON" | jq -r --arg k "$key" '.image_tag[$k]')

          # Remove 'amd64-' from the whole string
          stitched_tag="${image_tag/amd64-/}"

          echo "Stitching devdeps image with tag: $stitched_tag"
          echo "References: $refs"

          docker buildx imagetools create --tag "$stitched_tag" $refs
          digest=$(docker buildx imagetools inspect "$stitched_tag" | awk '/^Digest:/ { print $2 }')
          stitched_output=$(cat stitched_digests.json 2>/dev/null || echo '{}')
          stitched_output=$(echo "$stitched_output" | jq --arg key "devdeps-cu${cuda_major}" --arg val "$registry@$digest" '. + {($key): $val}')
          echo "$stitched_output" | tee stitched_digests.json

      - name: Read stitched_digests.json
        id: stitched_json
        run: |
          echo "json=$(jq -c . stitched_digests.json)" | tee -a $GITHUB_OUTPUT

      - name: Write matrix outputs
        uses: ./.github/actions/matrix-outputs-write
        with:
          matrix-step-name: stitched_devdeps_images
          matrix-key: cu${{ matrix.cuda }}
          outputs: |
            json: ${{ steps.stitched_json.outputs.json }}

  docker_images:
    name: Create Docker images
    # `cudaq.logical` wheels must finish building and testing before images are published.
    needs: [metadata, config, ext_config, python_wheels]
    if: ${{ ! inputs.devcontainer_only }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/docker_images.yml
    secrets:
      NGC_CREDENTIALS: ${{ secrets.NGC_CREDENTIALS }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platforms: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      cuda_version: ${{ matrix.cuda_version }}
      ompidev_image: ${{ fromJson(needs.config.outputs.json).image_hash[format('{0}-cu{1}-ompi', matrix.platform, matrix.cuda_version)] }}
      devdeps_image: ${{ fromJson(needs.ext_config.outputs.json).image_hash[format('{0}-cu{1}-ext', matrix.platform, matrix.cuda_version)] }}
      cudaq_enable_projects: 'cudaq;runtime;python;realtime'
      include_logical: true
      build_docs: ${{ matrix.cuda_version == '12.6' && matrix.platform == fromJson(needs.metadata.outputs.platforms).ids[0] }}
      environment: ghcr-deployment
      run_validation: false # validation runs in the Validation workflow

  digest_config:
    name: Aggregate digests
    needs: docker_images
    runs-on: ubuntu-latest

    outputs:
      json: "${{ steps.read.outputs.result }}"

    steps:
      - name: Checkout action code
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Read matrix outputs
        id: read
        uses: ./.github/actions/matrix-outputs-read
        with:
          matrix-step-name: docker_images

      - name: Print full digest config JSON
        run: |
          echo "Received matrix outputs:"
          echo '${{ steps.read.outputs.result }}' | jq .

  stitch:
    name: Stitch CUDA-Q (CUDA ${{ matrix.cuda }}) images
    needs: digest_config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cuda: ["12.6", "13.0"]

    environment: ghcr-deployment

    # The secrets context is unavailable in a step-level if, so mirror it to env.
    env:
      NGC_CREDENTIALS: ${{ secrets.NGC_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up environment
        run: |
          docker context create builder_context || echo "Context exists"
          docker context use builder_context

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4
        with:
          endpoint: builder_context

      - name: Login to GitHub CR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to NGC
        if: env.NGC_CREDENTIALS != ''
        uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ env.NGC_CREDENTIALS }}

      - name: metadata for jobs
        id: metadata
        run: |
          set -euo pipefail
          DIGESTS_JSON='${{ needs.digest_config.outputs.json }}'
          echo "digests_json<<EOF" | tee -a "$GITHUB_OUTPUT"
          echo "$DIGESTS_JSON" | tee -a "$GITHUB_OUTPUT"
          echo "EOF" | tee -a "$GITHUB_OUTPUT"

      - name: Stitch debug image
        run: |
          set -euo pipefail
          DIGESTS_JSON='${{ steps.metadata.outputs.digests_json }}'

          # Retry registry-hitting commands; nvcr.io/ghcr.io occasionally
          # return transient 5xx from their auth/proxy endpoints.
          retry() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              [ "$n" -eq 5 ] && return 1
              echo "Command '$*' failed (attempt $n/5); retrying in $((10*n))s..." >&2
              sleep $((10*n))
            done
          }

          cuda="${{ matrix.cuda }}"
          cuda_major="${cuda%%.*}"

          refs=""
          for arch in amd64 arm64; do
            key="${arch}-cu${cuda}-dev-image"
            digest=$(echo "$DIGESTS_JSON" | jq -r ".digest[\"$key\"]")
            arch_reference=$(echo "$DIGESTS_JSON" | jq -r ".image_tag[\"$key\"]")
            registry=$(echo "$arch_reference" | cut -d':' -f1)
            refs="$refs $registry@$digest"
          done

          # Retrieve image tag from DIGEST_JSON, just look at amd64 and filter it out
          key="amd64-cu${cuda}-dev-image"
          dev_image=$(echo "$DIGESTS_JSON" | jq -r --arg k "$key" '.image_tag[$k]')

          # Remove 'amd64-' from the whole string
          stitched_tag="${dev_image/amd64-/}"

          echo "Stitching debug image with tag: $stitched_tag"
          echo "References: $refs"

          retry docker buildx imagetools create --tag "$stitched_tag" $refs
          digest=$(retry docker buildx imagetools inspect "$stitched_tag" | awk '/^Digest:/ { print $2 }')
          stitched_output=$(cat stitched_digests.json 2>/dev/null || echo '{}')
          stitched_output=$(echo "$stitched_output" | jq --arg key "dev-cu${cuda_major}" --arg val "$registry@$digest" '. + {($key): $val}')
          echo "$stitched_output" | tee stitched_digests.json

      - name: Stitch release image
        run: |
          set -euo pipefail
          DIGESTS_JSON='${{ steps.metadata.outputs.digests_json }}'

          # Retry registry-hitting commands; nvcr.io/ghcr.io occasionally
          # return transient 5xx from their auth/proxy endpoints.
          retry() {
            for n in 1 2 3 4 5; do
              "$@" && return 0
              [ "$n" -eq 5 ] && return 1
              echo "Command '$*' failed (attempt $n/5); retrying in $((10*n))s..." >&2
              sleep $((10*n))
            done
          }

          cuda="${{ matrix.cuda }}"
          cuda_major="${cuda%%.*}"
          image="image"

          refs=""
          for arch in amd64 arm64; do
            key="${arch}-cu${cuda}-${image}"
            digest=$(echo "$DIGESTS_JSON" | jq -r ".digest[\"$key\"]")
            arch_reference=$(echo "$DIGESTS_JSON" | jq -r ".image_tag[\"$key\"]")
            registry=$(echo "$arch_reference" | cut -d':' -f1)
            refs="$refs $registry@$digest"
          done

          is_versioned=${{ github.ref_type == 'tag' || startsWith(github.ref_name, 'releases/') || startsWith(github.ref_name, 'staging/') }}
          has_continuous_deployment=${{ startsWith(github.ref_name, 'experimental/') || github.ref_name == 'main' }}
          push_to_ngc=`${{ secrets.NGC_CREDENTIALS != '' }} && ($is_versioned || $has_continuous_deployment) && echo true || echo`

          echo "push to NGC? $push_to_ngc"

          if [[ "$push_to_ngc" == "true" ]]; then
            registry=${registry/ghcr.io\/nvidia/nvcr.io\/nvidia\/nightly}
          fi

          image_tag="cu${cuda_major}-"
          pr_number="${{ github.event.pull_request.number }}"
          if [ -z "$pr_number" ] && \
             [[ "${{ github.ref_name }}" =~ (pull-request/|.*/pr-)([0-9]+) ]]; then
            pr_number="${BASH_REMATCH[2]}"
          fi
          if [ -n "$pr_number" ]; then
            image_tag+=pr-${pr_number}
          elif ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}; then
            image_tag+="latest"
          elif [[ "$is_versioned" == "true" ]]; then
            image_tag+=`echo ${{ github.ref_name }} | egrep -o "([0-9]{1,}\.)+[0-9]{1,}"`
          else
            image_tag+=`echo ${{ github.ref_name }} | tr '/' '-'`
          fi

          stitched_tag="${registry}:${image_tag}"

          echo "Stitching release image with tag: $stitched_tag"
          echo "References: $refs"

          retry docker buildx imagetools create --tag "$stitched_tag" $refs
          digest=$(retry docker buildx imagetools inspect "$stitched_tag" | awk '/^Digest:/ { print $2 }')
          stitched_output=$(cat stitched_digests.json 2>/dev/null || echo '{}')
          stitched_output=$(echo "$stitched_output" | jq --arg key "release-cu${cuda_major}" --arg val "$registry@$digest" '. + {($key): $val}')
          echo "$stitched_output" | tee stitched_digests.json

      - name: Read stitched_digests.json
        id: stitched_json
        run: |
          echo "json=$(jq -c . stitched_digests.json)" | tee -a $GITHUB_OUTPUT

      - name: Write matrix outputs
        uses: ./.github/actions/matrix-outputs-write
        with:
          matrix-step-name: stitched_cudaq_images
          matrix-key: cu${{ matrix.cuda }}
          outputs: |
            json: ${{ steps.stitched_json.outputs.json }}

  aggregate_stitched_images:
    name: Aggregate Stitched Images
    needs: [stitch, stitch_devdeps]
    runs-on: ubuntu-latest

    outputs:
      devdeps_json: "${{ steps.read_devdeps.outputs.result }}"
      cudaq_json: "${{ steps.read_cudaq.outputs.result }}"

    steps:
      - name: Checkout action code
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Read matrix outputs (devdeps)
        id: read_devdeps
        uses: ./.github/actions/matrix-outputs-read
        with:
          matrix-step-name: stitched_devdeps_images

      - name: Read matrix outputs (CUDA-Q)
        id: read_cudaq
        uses: ./.github/actions/matrix-outputs-read
        with:
          matrix-step-name: stitched_cudaq_images

      - name: Print full digest config JSON
        run: |
          echo "Received matrix outputs (devdeps):"
          echo '${{ steps.read_devdeps.outputs.result }}' | jq .
          echo "Received matrix outputs (CUDA-Q):"
          echo '${{ steps.read_cudaq.outputs.result }}' | jq .

  summary:
    name: Write deployment summary
    needs: [metadata, aggregate_stitched_images]
    strategy:
      matrix:
        cuda: ["12.6", "13.0"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create image summary
        id: summary
        run: |
          STITCHED_DEVDEPS_JSON='${{ needs.aggregate_stitched_images.outputs.devdeps_json }}'
          echo "$STITCHED_DEVDEPS_JSON" | jq .
          STITCHED_CUDAQ_JSON='${{ needs.aggregate_stitched_images.outputs.cudaq_json }}'
          echo "$STITCHED_CUDAQ_JSON" | jq .

          cuda=${{ matrix.cuda }}
          cuda_major="${cuda%%.*}"
          artifact_name="image_cu${cuda_major}_publishing"            
          info_file="$artifact_name.txt"

          key="release-cu${cuda_major}"
          cudaq_reference=$(echo "$STITCHED_CUDAQ_JSON" | jq -r --arg cuda "cu${cuda}" --arg key "$key" '.json[$cuda][$key]')

          key="dev-cu${cuda_major}"
          dev_reference=$(echo "$STITCHED_CUDAQ_JSON" | jq -r --arg cuda "cu${cuda}" --arg key "$key" '.json[$cuda][$key]')

          key="devdeps-cu${cuda_major}"
          devdeps_reference=$(echo "$STITCHED_DEVDEPS_JSON" | jq -r --arg cuda "cu${cuda}" --arg key "$key" '.json[$cuda][$key]')

          # Parse JSON and join docker_flag values (e.g., "linux/amd64,linux/arm64")
          platforms=$(echo '${{ needs.metadata.outputs.platforms }}' \
            | jq -r '[.ids[] as $id | .[$id].docker_flag] | join(",")')

          {
            echo "source-sha: ${{ github.sha }}"
            echo "cuda-quantum-image: ${cudaq_reference}"
            echo "cuda-quantum-dev-image: ${dev_reference}"
            echo "cuda-quantum-devdeps-image: ${devdeps_reference}"
            echo "platforms: ${platforms}"
            echo "cuda-version: ${cuda}"
          } | tee "$info_file"
          echo "Created $info_file"

          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT          
          echo "info_file=$info_file" >> $GITHUB_OUTPUT          

      - name: Upload ${{ steps.summary.outputs.artifact_name }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.summary.outputs.artifact_name }}
          path: ${{ steps.summary.outputs.info_file }}
          retention-days: 30
          if-no-files-found: error

  # Build the devel wheel first so that all jobs in the `python_wheels` matrix can reuse it
  python_devel_wheel:
    name: Create shared Python development wheel (${{ matrix.platform }})
    needs: [metadata, config]
    if: ${{ ! inputs.devcontainer_only }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
      fail-fast: false
    uses: ./.github/workflows/python_wheels.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platform: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      python_version: "3.11"
      cuda_version: "13.0"
      devdeps_image:
        ${{
        fromJson(needs.config.outputs.json).image_hash[format('{0}-cu13.0-python',
        matrix.platform)] }}
      build_runtime_wheel: false
      build_devel_wheel: true
      run_validation: false # validation runs in the Validation workflow
      release_version: ${{ needs.metadata.outputs.cudaq_version }}

  python_wheels:
    name: Create Python wheels
    needs: [metadata, config, python_devel_wheel]
    if: ${{ !cancelled() && ! inputs.devcontainer_only && needs.metadata.result == 'success' && needs.config.result == 'success' }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        python_version: ['3.11', '3.12', '3.13', '3.14']
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/python_wheels.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platform: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      python_version: ${{ matrix.python_version }}
      cuda_version: ${{ matrix.cuda_version }}
      devdeps_image: ${{ fromJson(needs.config.outputs.json).image_hash[format('{0}-cu{1}-python', matrix.platform, matrix.cuda_version)] }}
      create_staging_info:  ${{ matrix.python_version == '3.11' }} # staging info is the same for all python versions
      run_validation: false # validation runs in the Validation workflow
      # cudaq-devel-<platform> is deterministic (build-wheel-in-docker: "the
      # devel wheel is CUDA- and Python-agnostic"), so this is constructed
      # directly rather than read from needs.python_devel_wheel.outputs --
      # that output is ambiguous across a matrixed job's instances.
      devel_artifact_name: cudaq-devel-${{ matrix.platform }}
      build_logical_wheel: ${{ matrix.cuda_version == '13.0' }}
      release_version: ${{ needs.metadata.outputs.cudaq_version }}

  binaries:
    name: Create CUDA Quantum installer
    # source_build_python fills the cache that the installer build restores; it may be skipped or fail.
    needs: [metadata, config, release_draft, source_build_python]
    # release_draft is skipped without create_release.
    if: >-
      ${{ !cancelled() && ! inputs.devcontainer_only
      && needs.config.result == 'success'
      && contains(fromJson('["success", "skipped"]'), needs.release_draft.result) }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/prebuilt_binaries.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
      REPO_BOT_ACCESS_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
    with:
      platform: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].docker_flag }}
      platform_base_image: ${{ fromJson(needs.metadata.outputs.platforms)[format('{0}', matrix.platform)].minimal_base_image }}
      build_config_id: cu${{ matrix.cuda_version }}-llvm
      cuda_version: ${{ matrix.cuda_version }}
      build_cache: ${{ fromJson(needs.config.outputs.json).build_cache[format('{0}-cu{1}-installer', matrix.platform, matrix.cuda_version)] }}
      environment: ghcr-deployment
      run_validation: false # validation runs in the Validation workflow
      release_version: ${{ needs.metadata.outputs.cudaq_version }}
      release_tag: ${{ needs.release_draft.outputs.release_tag }}
      keep_installer: true # Validation downloads it

  realtime_binaries:
    name: Create CUDA Quantum Realtime installer
    needs: [metadata, release_draft]
    if: >-
      ${{ !cancelled() && needs.metadata.outputs.create_packages == 'true'
      && ! inputs.devcontainer_only
      && contains(fromJson('["success", "skipped"]'), needs.release_draft.result) }}
    strategy:
      matrix:
        platform: [amd64, arm64]
        cuda_version: ["12.6", "13.0"]
      fail-fast: false
    uses: ./.github/workflows/realtime_prebuilt_binaries.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
      REPO_BOT_ACCESS_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
    with:
      platform: ${{ matrix.platform }}
      cuda_version: ${{ matrix.cuda_version }}
      environment: ghcr-deployment
      release_tag: ${{ needs.release_draft.outputs.release_tag }}

  macos_ci:
    name: macOS CI
    needs: metadata
    if: >-
      needs.metadata.outputs.create_packages == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.include_macos != false)
    uses: ./.github/workflows/ci_macos.yml
    with:
      cache_base: ${{ needs.metadata.outputs.cache_base }}
      cudaq_version: ${{ needs.metadata.outputs.cudaq_version }}

  # Draft release: created first, assets are attached as each build finishes.
  # Uploads use --clobber so failed jobs can be re-run. Publishing is manual.
  release_draft:
    name: Create draft release
    needs: metadata
    if: >-
      needs.metadata.outputs.create_packages == 'true'
      && needs.metadata.outputs.release_title != ''
      && ! inputs.devcontainer_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ghcr-deployment
      url: ${{ vars.deployment_url }}
      deployment: false

    outputs:
      release_tag: ${{ steps.draft.outputs.release_tag }}

    steps:
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release_title }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
        run: |
          # Tagged with the run id until release_finalize, to avoid stale drafts.
          release_tag=${{ github.run_id }}
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT

          if gh release view "$release_tag" -R ${{ github.repository }} > /dev/null 2>&1; then
            echo "Draft release $release_tag already exists."
            exit 0
          fi

          versions=`gh release list -R ${{ github.repository }} --exclude-drafts --exclude-pre-releases | egrep -o "([0-9]{1,}\.)+[0-9]{1,}\S*" | sort -r -V`
          latest_tag=`echo $versions | cut -d ' ' -f 1`

          flags=(--draft)
          if [ "$(echo $RELEASE_VERSION | egrep -o '([0-9]{1,}\.)+[0-9]{1,}')" != "$RELEASE_VERSION" ]; then
            flags+=(--prerelease)
          fi
          if [ -n "$latest_tag" ]; then
            flags+=(--generate-notes --notes-start-tag "$latest_tag")
          fi

          rel_notes="Release created by workflow [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          rel_notes+="<br/>GitHub commit [${{ github.sha }}](https://github.com/${{ github.repository }}/tree/${{ github.sha }})"

          gh release create "$release_tag" -R ${{ github.repository }} \
            --title "$RELEASE_TITLE" --target ${{ github.sha }} \
            --notes "$rel_notes" "${flags[@]}"

  # One zip per platform; a single zip of all wheels is too big.
  release_wheels:
    name: Attach ${{ matrix.platform }} wheels to draft release
    needs: [metadata, release_draft, python_devel_wheel, python_wheels]
    if: >-
      ${{ !cancelled() && needs.release_draft.result == 'success'
      && needs.python_devel_wheel.result == 'success'
      && needs.python_wheels.result == 'success' }}
    strategy:
      matrix:
        platform: ${{ fromJson(needs.metadata.outputs.platforms).ids }}
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download CUDA-Q Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: pycudaq-*-manylinux-${{ matrix.platform }}-*
          path: wheelhouse

      - name: Download cudaq-devel wheel
        uses: actions/download-artifact@v8
        with:
          name: cudaq-devel-${{ matrix.platform }}
          path: devel-wheels

      - name: Download CUDA-Q Logical wheels
        uses: actions/download-artifact@v8
        with:
          pattern: 'cudaq_logical-*'
          path: logical-wheels
          merge-multiple: true

      - name: Attach wheels to draft release
        env:
          GH_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.release_draft.outputs.release_tag }}
        run: |
          arch=`([ "${{ matrix.platform }}" == "amd64" ] && echo x86_64) || echo aarch64`
          mkdir wheelhouse-${arch}

          for dir in wheelhouse/*/; do
            # candidate-core/ is for build-local validation; CUDA 13 publishes the core.
            rm -rf "${dir}candidate-core"
            mv -vf "${dir}"* wheelhouse-${arch}/
          done

          for kind in logical devel; do
            if ! compgen -G "${kind}-wheels/cudaq_${kind}-*${arch}.whl" > /dev/null; then
              echo "::error::No cudaq-${kind} wheel found for ${arch}."
              exit 1
            fi
            mv -v ${kind}-wheels/cudaq_${kind}-*${arch}.whl wheelhouse-${arch}/
          done

          zip -r wheelhouse-${arch}.zip wheelhouse-${arch}
          gh release upload "$RELEASE_TAG" -R ${{ github.repository }} wheelhouse-${arch}.zip --clobber

  # The sdists only need the version, so they do not wait for the wheels.
  metapackages:
    name: Build metapackages
    needs: metadata
    if: >-
      needs.metadata.outputs.create_packages == 'true'
      && ! inputs.devcontainer_only
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/python_metapackages.yml
    with:
      cudaq_version: ${{ needs.metadata.outputs.package_version }}
      python_versions: "['3.11', '3.12', '3.13', '3.14']"
      cuda_versions: "['', '12.6', '13.0']"
      wheel_artifacts: 'pycudaq-*' # unused, the tests run in Validation
      run_tests: false
      retention_days: 14

  release_metapackages:
    name: Attach metapackages to draft release
    needs: [release_draft, metapackages]
    if: >-
      ${{ !cancelled() && needs.release_draft.result == 'success'
      && needs.metapackages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download metapackages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.metapackages.outputs.artifact_name }}
          path: metapackages

      - name: Attach metapackages to draft release
        env:
          GH_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.release_draft.outputs.release_tag }}
        run: |
          zip -r metapackages.zip metapackages
          gh release upload "$RELEASE_TAG" -R ${{ github.repository }} metapackages.zip --clobber

  # macOS is slowest, so its assets are attached whenever it finishes.
  release_macos:
    name: Attach macOS assets to draft release
    needs: [release_draft, macos_ci]
    if: >-
      ${{ !cancelled() && needs.release_draft.result == 'success'
      && needs.macos_ci.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download macOS wheels
        uses: actions/download-artifact@v8
        with:
          pattern: pycudaq-*-darwin-arm64
          path: wheelhouse
          merge-multiple: true

      - name: Download macOS installer
        uses: actions/download-artifact@v8
        with:
          pattern: cudaq-arm64-darwin-installer-*
          path: installer
          merge-multiple: true

      - name: Attach macOS assets to draft release
        env:
          GH_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.release_draft.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" -R ${{ github.repository }} installer/install_cuda_quantum* --clobber

          mkdir wheelhouse-darwin
          mv -vf wheelhouse/* wheelhouse-darwin/
          zip -r wheelhouse-darwin.zip wheelhouse-darwin
          gh release upload "$RELEASE_TAG" -R ${{ github.repository }} wheelhouse-darwin.zip --clobber

  # Sets the final tag once every asset is attached.
  release_finalize:
    name: Finalize draft release
    needs:
      - metadata
      - release_draft
      - binaries
      - realtime_binaries
      - release_wheels
      - release_metapackages
      - macos_ci
      - release_macos
    if: >-
      ${{ !cancelled() && needs.release_draft.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ghcr-deployment
      url: ${{ vars.deployment_url }}
      deployment: false

    steps:
      - name: Finalize draft release
        env:
          GH_TOKEN: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ needs.release_draft.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.release_version }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.release_title }}
          INSTALLERS_RESULT: ${{ needs.binaries.result }}
          REALTIME_RESULT: ${{ needs.realtime_binaries.result }}
          WHEELS_RESULT: ${{ needs.release_wheels.result }}
          METAPACKAGES_RESULT: ${{ needs.release_metapackages.result }}
          # No macOS assets expected when it was skipped.
          MACOS_RESULT: ${{ needs.macos_ci.result == 'skipped' && 'success' || needs.release_macos.result }}
        run: |
          # The run id tag is what re-run jobs use to find the draft, so a
          # draft with missing assets keeps it and this job fails; re-running
          # the failed jobs then re-runs this one.
          missing=false
          for item in "installers:$INSTALLERS_RESULT" "realtime installers:$REALTIME_RESULT" \
                      "Linux wheels:$WHEELS_RESULT" "metapackages:$METAPACKAGES_RESULT" \
                      "macOS assets:$MACOS_RESULT"; do
            if [ "${item#*:}" != "success" ]; then
              echo "::error::The ${item%%:*} were not attached (${item#*:})."
              missing=true
            fi
          done
          if $missing; then
            echo "::error::Draft release $RELEASE_TAG is incomplete and keeps its run id tag. Re-run the failed jobs to finish it."
            exit 1
          fi

          flags=()
          if [ "$(echo $RELEASE_VERSION | egrep -o '([0-9]{1,}\.)+[0-9]{1,}')" != "$RELEASE_VERSION" ]; then
            flags+=(--prerelease)
          fi

          # Stays a draft; publishing is manual.
          gh release edit "$RELEASE_TAG" -R ${{ github.repository }} \
            --title "$RELEASE_TITLE" --tag "$RELEASE_VERSION" "${flags[@]}"

  # Dispatches validation.yml with an explicit ref, not main (see there).
  trigger_validation:
    name: Trigger Validation
    # macOS and realtime assets are not needed to start Validation.
    needs: [summary, python_wheels, binaries, metapackages]
    # Explicit: a skipped ancestor (release_draft) would skip this under the default success().
    if: >-
      ${{ !cancelled() && inputs.run_validation_after
      && needs.summary.result == 'success'
      && needs.python_wheels.result == 'success'
      && needs.binaries.result == 'success'
      && needs.metapackages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger Validation workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.REPO_BOT_ACCESS_TOKEN }}
          script: |
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'validation.yml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: {
                deployment_id: context.runId.toString(),
              },
            };
            for (let n = 1; n <= 3; n++) {
              try {
                await github.rest.actions.createWorkflowDispatch(params);
                if (n > 1) core.notice(`createWorkflowDispatch succeeded on attempt ${n}`);
                return;
              } catch (err) {
                if (n === 3) throw err;
                core.warning(`createWorkflowDispatch attempt ${n}/3 failed: ${err.message}; retrying...`);
                await sleep(15000 * n * n);
              }
            }
