name: Pulse research preview

on:
  workflow_dispatch:
  # These trigger-level filters are a coarse pre-gate only. YAML `paths:` cannot
  # be sourced from a file, so they duplicate the prefixes owned by
  # .github/research-preview-paths.txt (plus the shared build files); the
  # authoritative check in the `changes` job below reads that registry directly.
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
    paths:
      - pulse/**
      - CMakeLists.txt
      - .github/workflows/pulse.yml
  pull_request:
    paths:
      - pulse/**
      - CMakeLists.txt
      - .github/workflows/pulse.yml
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Check for pulse changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pulse: ${{ steps.filter.outputs.matched }}
    steps:
      - name: Check out changed-path action and path registry
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/actions/check-changed-paths
            .github/research-preview-paths.txt

      - name: Assemble pulse path filter
        id: paths
        shell: bash
        # research-preview-paths.txt is the single source of truth for the
        # pulse-owned prefixes; add the shared build files that also affect
        # pulse but are not preview-owned.
        run: |
          {
            echo 'value<<EOF'
            grep -vE '^[[:space:]]*(#|$)' .github/research-preview-paths.txt
            echo 'CMakeLists.txt'
            echo '.github/workflows/pulse.yml'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Check changed paths
        id: filter
        uses: ./.github/actions/check-changed-paths
        with:
          paths: ${{ steps.paths.outputs.value }}

  quality:
    name: Check pulse license headers
    needs: changes
    if: needs.changes.outputs.pulse == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out CUDA-Q
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Check pulse license headers
        run: |
          find pulse -name CMakeLists.txt -exec cp '{}' '{}.tmp' \;
          trap 'find pulse -name CMakeLists.txt.tmp -delete' EXIT
          go install github.com/apache/skywalking-eyes/cmd/license-eye@latest
          "${GOPATH:-$HOME/go}/bin/license-eye" header check pulse

  test-and-docs:
    name: Build, test, and generate docs
    needs: changes
    if: needs.changes.outputs.pulse == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read  # pull the private NVIDIA devcontainer image from ghcr.io
    container:
      # This CUDA-Q development image contains the pinned LLVM/MLIR toolchain
      # at LLVM_INSTALL_PREFIX; the pulse job never builds LLVM from source.
      image: ghcr.io/nvidia/cuda-quantum-devcontainer:amd64-cu12.6-llvm-main
      # Authenticate to ghcr.io so the private image resolves (mirrors the
      # pattern in integration_tests.yml / python_metapackages.yml).
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Check out CUDA-Q
        uses: actions/checkout@v6

      - name: Initialize source dependencies
        run: git -c submodule.tpls/llvm.update=none submodule update --init --recursive

      - name: Install pulse test dependencies
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages \
            hypothesis \
            lit \
            "myst-parser>=3.0" \
            nvidia-sphinx-theme==0.0.8 \
            numpy==1.26.4 \
            pytest==9.0.3 \
            "sphinx>=8.1,<8.3"

      - name: Configure pulse
        run: |
          cmake -S . -B build-pulse -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDAQ_BUILD_TESTS=ON \
            -DCUDAQ_ENABLE_PROJECTS=pulse \
            -DCUDAQ_PULSE_BUILD_DOCS=ON \
            -DLLVM_DIR="$LLVM_INSTALL_PREFIX/lib/cmake/llvm" \
            -DPython_EXECUTABLE=/usr/bin/python3

      - name: Build, test, and generate docs
        run: |
          cmake --build build-pulse --parallel 2 \
            --target check-pulse pulse-docs

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: cudaq-pulse-docs
          path: build-pulse/pulse/docs/html
          if-no-files-found: error

  gpu-validation:
    name: Run pulse numerical validation on GPU
    needs: changes
    # Pull-request events contain untrusted fork code and cannot use NVIDIA's
    # self-hosted runners. The copy-pr-bot's trusted pull-request/* push, merge
    # queue, main push, and manual dispatch paths run this trusted GPU job.
    if: needs.changes.outputs.pulse == 'true' && github.event_name != 'pull_request'
    runs-on: linux-amd64-gpu-a100-latest-1
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read  # pull the private NVIDIA devcontainer image from ghcr.io
    container:
      # The development image supplies the pinned LLVM/MLIR toolchain,
      # CUDA Toolkit, and cuDensityMat SDK; LLVM is never built in this job.
      image: ghcr.io/nvidia/cuda-quantum-devcontainer:amd64-cu12.6-llvm-main
      # Authenticate to ghcr.io so the private image resolves (mirrors the
      # pattern in integration_tests.yml / python_metapackages.yml).
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}

    steps:
      - name: Check out CUDA-Q
        uses: actions/checkout@v6

      - name: Initialize source dependencies
        run: git -c submodule.tpls/llvm.update=none submodule update --init --recursive

      - name: Install pulse test dependencies
        run: |
          python3 -m pip install --no-cache-dir --break-system-packages \
            hypothesis \
            lit \
            numpy==1.26.4 \
            pytest==9.0.3

      - name: Locate cuDensityMat
        run: |
          echo "CUDENSITYMAT_ROOT=$(python3 -c 'import pathlib, cuquantum; print(pathlib.Path(cuquantum.__file__).parent)')" >> "$GITHUB_ENV"

      - name: Configure pulse GPU validation
        run: |
          cmake -S . -B build-pulse-gpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCUDAQ_BUILD_TESTS=ON \
            -DCUDAQ_ENABLE_PROJECTS=pulse \
            -DCUDENSITYMAT_ROOT="$CUDENSITYMAT_ROOT" \
            -DLLVM_DIR="$LLVM_INSTALL_PREFIX/lib/cmake/llvm" \
            -DPython_EXECUTABLE=/usr/bin/python3

      - name: Build and run numerical GPU tests
        run: |
          cmake --build build-pulse-gpu --parallel 2 \
            --target check-pulse-gpu
