name: EDEM CI

on:
  workflow_dispatch:
  push:
    branches:
      - "pull-request/[0-9]+"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check for EDEM changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      edem: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
      - name: Check changed paths
        id: filter
        uses: ./.github/actions/check-changed-paths
        with:
          paths: |
            CMakeLists.txt
            edem/
            math/gf2/
            pyproject.toml.edem
            LICENSES/LICENSE.nanobind
            LICENSES/LICENSE.robin-map
            .github/workflows/edem_ci.yml
            .github/actions/check-changed-paths/

  build:
    name: EDEM (${{ matrix.os }}, shared=${{ matrix.shared }})
    needs: changes
    if: needs.changes.outputs.edem == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shared: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S edem -B build-edem
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - name: Build
        run: cmake --build build-edem --parallel 2
      - name: Check build-tree and installed packages
        run: ctest --test-dir build-edem --output-on-failure

  wheel:
    name: EDEM wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.edem == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build frontend
        run: python -m pip install "build[virtualenv]"
      - name: Build source distribution and wheel
        run: python edem/scripts/build_wheel.py --outdir dist/edem
      - name: Check installed wheel
        shell: bash
        run: python edem/test/check_wheel.py dist/edem/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: cudaq-edem-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/edem/*
          if-no-files-found: error
