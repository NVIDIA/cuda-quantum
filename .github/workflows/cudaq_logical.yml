# Build, test and upload the cudaq-logical wheel for the specified platform and python version.
# 
# This gets triggered on relevant PRs by the `cudaq-logical_on_push.yml` workflow.

name: Build and test cudaq.logical

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Wheel platform
        options: ['linux/amd64', 'linux/arm64']
        default: linux/amd64
      python_version:
        type: choice
        description: Python version
        options: ['3.11', '3.13', '3.14']
        default: '3.11'
  workflow_call:
    inputs:
      platform:
        type: string
        description: Wheel platform
        default: linux/amd64
      python_version:
        type: string
        description: Python version
        default: '3.11'
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_READONLY_TOKEN:
        required: true

jobs:
  retrieve_cudaq:
    name: Retrieve current CUDAQ wheels
    uses: ./.github/workflows/retrieve_python_wheels.yml
    secrets:
      # used if the wheels must be built
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_READONLY_TOKEN: ${{ secrets.DOCKERHUB_READONLY_TOKEN }}
    with:
      platform: ${{ inputs.platform }}
      python_version: ${{ inputs.python_version }}
      metapackage_sdist: true
      devel_wheel: true
      run_validation: false
      bundle_wheels: true

  build:
    name: Build and test cudaq.logical
    needs: retrieve_cudaq
    runs-on: ${{ (contains(inputs.platform, 'arm') && 'linux-arm64-cpu8') || 'linux-amd64-cpu8' }}
    permissions:
      contents: read
      actions: read
    outputs:
      wheel_name: ${{ steps.build.outputs.wheel_name }}
    env:
      PYTHON_VERSION: ${{ inputs.python_version }}
      CUDAQ_VERSION: ${{ needs.retrieve_cudaq.outputs.cudaq_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download CUDA-Q wheels
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.retrieve_cudaq.outputs.bundle_artifact_name }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true

      - name: Install build dependencies
        shell: bash
        env:
          PYTHON_VERSION: ${{ inputs.python_version }}
        run: |
          set -euo pipefail
          retry() { for n in 1 2 3; do "$@" && return 0; [ $n -lt 3 ] && sleep $((15*n*n)); done; return 1; }

          mkdir -p dist
          echo "Contents of dist:"
          find dist -type f

          DEVEL_WHEEL="$(find dist -name 'cudaq_devel*.whl' -print -quit)"
          RUNTIME_WHEEL="$(find dist -name 'cuda_quantum_cu13*.whl' -print -quit)"
          if [ -z "$DEVEL_WHEEL" ] || [ -z "$RUNTIME_WHEEL" ]; then
            echo "::error::Missing downloaded wheels under dist/ (devel='$DEVEL_WHEEL', runtime='$RUNTIME_WHEEL')."
            exit 1
          fi

          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends \
            build-essential g++-12 patchelf libgmp-dev libmpfr-dev unzip

          # The cudaq-devel wheel is built with gcc12 (see devdeps base image);
          # the extension must be compiled with the same toolchain.
          export CC=gcc-12
          export CXX=g++-12

          uv pip install \
            "nanobind>=2.4,<3" \
            "scikit-build-core==0.12.2" \
            "setuptools-scm>=8,<9" \
            "auditwheel==6.5.0" \
            "cmake>=3.30" \
            ninja \
            "patchelf>=0.17" \
            "lit<23"

          uv pip install -f dist cudaq-devel==$CUDAQ_VERSION

      - name: Build cudaq.logical
        id: build
        shell: bash
        run: |
          cd preview/logical

          python scripts/stamp_cudaq_runtime_dependency.py python/pyproject.toml \
            --distribution cudaq \
            --version "$CUDAQ_VERSION"

          mkdir .wheel-raw
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          SETUPTOOLS_SCM_PRETEND_VERSION="$CUDAQ_VERSION" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            uv build --wheel --no-build-isolation \
              --out-dir .wheel-raw python

          py_tag="${PYTHON_VERSION/./}"
          raw_wheel="$(find .wheel-raw -name "cudaq_logical-*-cp${py_tag}-*.whl" -print -quit)"
          test -n "$raw_wheel"

          # libcudaqMLIR, libcudaqMLIRCAPI, and libnanobind-cudaq are all
          # shipped by the cudaq runtime wheel and resolved from it at
          # runtime (see preview/logical/cmake/SetupCUDAQ.cmake), so they
          # must not be grafted into this wheel.
          python -m auditwheel repair \
            --exclude libcudaqMLIR.so \
            --exclude libcudaqMLIRCAPI.so \
            --exclude libnanobind-cudaq.so \
            --wheel-dir ../../dist "$raw_wheel"

          wheel="$(find "$GITHUB_WORKSPACE/dist" -name "cudaq_logical-*-cp${py_tag}-*.whl" -print -quit)"
          test -n "$wheel"
          echo "wheel_path=$wheel" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$(basename "$wheel")" >> "$GITHUB_OUTPUT"

      - name: Upload cudaq-logical wheel
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.wheel_path }}
          archive: false
          if-no-files-found: error

      - name: Run cudaq.logical FileCheck tests
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          build_dir="preview/logical/build"

          # `uv build` above configured and built this tree through
          # scikit-build-core (tool.scikit-build build-dir), so the lit suite is
          # already wired up -- but only when lit and FileCheck were visible at
          # configure time. test/CMakeLists.txt merely warns when they are not,
          # so confirm the test exists instead of passing on an empty selection.
          if ! ctest --test-dir "$build_dir" -N -R '^qlx-filecheck-tests$' \
              | grep -q 'qlx-filecheck-tests'; then
            echo "::error::qlx-filecheck-tests is not registered: lit and/or FileCheck were missing when CMake configured $build_dir."
            exit 1
          fi

          # ctest pulls in the qlx-lit-build-tools fixture, which makes sure
          # qlx-opt and qlx-translate are up to date before lit runs.
          ctest --test-dir "$build_dir" --output-on-failure \
            -R '^qlx-filecheck-tests$'

  test:
    name: Test cudaq.logical
    needs: [build, retrieve_cudaq]
    runs-on: ${{ (contains(inputs.platform, 'arm') && 'linux-arm64-cpu8') || 'linux-amd64-cpu8' }}
    env:
      CUDAQ_VERSION: ${{ needs.retrieve_cudaq.outputs.cudaq_version }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download cudaq-logical wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.wheel_name }}
          path: dist
        
      - name: Download runtime wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.retrieve_cudaq.outputs.runtime_artifact_name }}
          path: dist

      - name: Download CUDA-Q metapackage
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.retrieve_cudaq.outputs.metapackage_artifact_name }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python_version }}
          activate-environment: true
      
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv pip install -f dist cudaq-logical==$CUDAQ_VERSION

      - name: Validate installed cudaq.logical tools
        shell: bash
        env:
          PYTHON_VERSION: ${{ needs.retrieve_cudaq.outputs.python_version }}
        run: |
          set -euo pipefail

          printf 'module {}\n' | qlx-opt
          qlx-translate \
            preview/logical/examples/cli/stim_memory.mlir --fabric-to-stim \
            | grep -q '^M '

      - name: Validate the cudaq.logical re-export
        shell: bash
        run: |
          set -euo pipefail

          # Every import spelling must resolve to the installed cudaq.logical
          # package (not a second copy under a legacy top-level name).
          python -c "import cudaq.logical; print(cudaq.logical.__version__)"
          python -c "import cudaq; print(cudaq.logical.__version__)"
          python -c "from cudaq import logical; print(logical.std.idle)"
          python -c "from cudaq.logical import program; print(program)"

          python preview/logical/scripts/check_namespace_install.py
      - name: Run cudaq.logical Python tests
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          uv pip install "pytest>=7.0"

          # Run from the workspace root: `python -m pytest` puts the working
          # directory on sys.path, and preview/logical/python holds a source-only
          # copy of the package that would shadow the installed wheel (with its
          # compiled extensions) if it were importable.
          logical_path="$(python -c 'import cudaq.logical; print(cudaq.logical.__file__)')"
          echo "Testing installed cudaq.logical: $logical_path"
          case "$logical_path" in
            *"$GITHUB_WORKSPACE/preview/logical"*)
              echo "::error::cudaq.logical resolved to the source tree, not the installed wheel."
              exit 1
              ;;
          esac

          python -m pytest preview/logical/python/tests/cudaq/logical -v
