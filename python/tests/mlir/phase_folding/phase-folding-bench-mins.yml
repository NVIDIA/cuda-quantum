name: phase-folding-bench-mins
description: "Phase folding optimization pass for compiler benchmarking/testing with minimum block length and Rz weight thresholds."

config:
  nvqir-simulation-backend: qpp
  # Phase folding pass (zero minimum block length and Rz weight thresholds)
  jit-mid-level-pipeline: "func.func(factor-quantum-alloc,canonicalize,cse,dqe,memtoreg{quantum=1},phase-folding{min-length=0 min-rz-weight=0},canonicalize,cse,regtomem,combine-quantum-alloc)"
  library-mode: false
