version: 2-alpha
name: compiler-bench-ftqc-logical
description: "Logical FTQC benchmark target lowering to a pre-synthesis Clifford+T and rotation basis for resource counting"

config:
  nvqir-simulation-backend: qpp

# The quake-unmapped handler picks the passes from these options and the
# optimization level. The basis keeps arbitrary-axis rotations for layer-one
# FTQC metrics, so this target runs no synthesis.
compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          basis-gates: [h, s, t, rx, ry, rz, x, y, z, swap, "x(1)", "y(1)", "z(1)", "x(2)", "z(2)"]
          approximation-tolerance: 0
          cost-model: t-count
