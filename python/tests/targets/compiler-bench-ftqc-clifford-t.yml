version: 2-alpha
name: compiler-bench-ftqc-clifford-t
description: "Post-rotation-synthesis Clifford+T benchmark target for resource counting"

config:
  nvqir-simulation-backend: qpp

# The quake-unmapped handler picks the passes from these options and the
# optimization level. The basis has no rotation gate, so every rotation is
# synthesized within the tolerance. `cudaq.set_random_seed` seeds synthesis.
compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          basis-gates: [h, s, t, x, y, z, swap, "x(1)", "y(1)", "z(1)"]
          approximation-tolerance: "%EPSILON:1e-10%"
          cost-model: t-count

target-arguments:
  - key: epsilon
    required: false
    type: string
    help-string: "Per-rotation approximation tolerance. Defaults to 1e-10."
