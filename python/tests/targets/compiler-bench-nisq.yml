version: 2-alpha
name: compiler-bench-nisq
description: "NISQ benchmark target lowering to a CZ and rotation basis, with optional routing onto a device, for resource counting"

config:
  nvqir-simulation-backend: qpp

# Set `device` on the `quake-mapped` stage of `get_compile_target()`, such
# as `path(5)`, to route; without one nothing is routed.
compile-target:
  stages:
    - ir-output-profile:
        name: quake-unmapped
        options:
          basis-gates: [h, rx, ry, rz, x, "z(1)"]
          cost-model: two-qubit-gate-count
    - ir-output-profile:
        name: quake-mapped
        options:
          basis-gates: [h, rx, ry, rz, x, "z(1)"]
