<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1132" width="900" height="1132" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="gpu_grid_dispatch: ring requests, the grid reads the slot in place">
<title>gpu_grid_dispatch: ring requests (gdrcopy notify, all blocks poll)</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="900" height="1132" fill="#fff"/>
<line x1="80" y1="96" x2="80" y2="790" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="245" y1="96" x2="245" y2="790" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="410" y1="96" x2="410" y2="790" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="600" y1="96" x2="600" y2="790" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="790" y1="96" x2="790" y2="790" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="22" y1="96" x2="22" y2="790" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
<text transform="translate(14,443) rotate(-90)" text-anchor="middle" font-size="10" fill="#1a1a1a">time</text>
<rect x="20" y="14" width="120" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="80" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">FPGA</text>
<rect x="175" y="14" width="140" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="245" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Bridge</text>
<rect x="330" y="14" width="160" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="410" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">CPU dispatch thread</text>
<rect x="520" y="14" width="350" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="695" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GPU grid</text>
<rect x="538" y="56" width="124" height="22" rx="4" fill="#fff" stroke="#888"/>
<text x="600" y="71" text-anchor="middle" font-size="11" fill="#1a1a1a">block 0</text>
<rect x="728" y="56" width="124" height="22" rx="4" fill="#fff" stroke="#888"/>
<text x="790" y="71" text-anchor="middle" font-size="11" fill="#1a1a1a">blocks 1..N-1</text>
<line x1="80" y1="138" x2="245" y2="138" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="117.5" y="121" width="89" height="14" fill="#fff"/>
<text x="162" y="132" text-anchor="middle" font-size="11" fill="#1a1a1a">WRITE</text>
<circle cx="103" cy="128" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="103" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">1</text>
<rect x="175" y="478" width="140" height="62" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="245.0" y="499.0" text-anchor="middle" font-size="11" fill="#1a1a1a">host rings (pinned)</text>
<text x="245.0" y="513.0" text-anchor="middle" font-size="11" fill="#1a1a1a">RX slot N: request</text>
<text x="245.0" y="527.0" text-anchor="middle" font-size="11" fill="#1a1a1a">TX slot N: reply payload</text>
<line x1="245" y1="186" x2="410" y2="186" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="277.0" y="169" width="102" height="14" fill="#fff"/>
<text x="328" y="180" text-anchor="middle" font-size="11" fill="#1a1a1a">request + completion</text>
<circle cx="262" cy="176" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="262" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">2</text>
<rect x="302" y="202" width="215" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="409.5" y="218.0" text-anchor="middle" font-size="11" fill="#1a1a1a">validate header, find rpc_increment,</text>
<text x="409.5" y="232.0" text-anchor="middle" font-size="11" fill="#1a1a1a">call HOST_CALL handler</text>
<rect x="302" y="256" width="215" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="409.5" y="272.0" text-anchor="middle" font-size="11" fill="#1a1a1a">slot N from the RX pointer; clamp len;</text>
<text x="409.5" y="286.0" text-anchor="middle" font-size="11" fill="#1a1a1a">pack slot+len into one 64-bit word</text>
<line x1="410" y1="326" x2="600" y2="326" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="420.0" y="309" width="172" height="14" fill="#fff"/>
<text x="506" y="320" text-anchor="middle" font-size="11" fill="#1a1a1a">gdrcopy: slot+len, then seq</text>
<circle cx="406" cy="316" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="406" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">3</text>
<rect x="530" y="342" width="330" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="695.0" y="358.0" text-anchor="middle" font-size="11" fill="#1a1a1a">mailbox in device memory (BAR1-mapped to the CPU)</text>
<rect x="525" y="386" width="150" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="600.0" y="402.0" text-anchor="middle" font-size="11" fill="#1a1a1a">poll mailbox (local),</text>
<text x="600.0" y="416.0" text-anchor="middle" font-size="11" fill="#1a1a1a">unpack slot + len</text>
<circle cx="525" cy="386" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="525" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">4</text>
<rect x="715" y="386" width="150" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="790.0" y="402.0" text-anchor="middle" font-size="11" fill="#1a1a1a">poll mailbox (local),</text>
<text x="790.0" y="416.0" text-anchor="middle" font-size="11" fill="#1a1a1a">unpack slot + len</text>
<rect x="530" y="436" width="330" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="695.0" y="452.0" text-anchor="middle" font-size="11" fill="#1a1a1a">every thread i &lt; len/4, grid-stride:</text>
<text x="695.0" y="466.0" text-anchor="middle" font-size="11" fill="#1a1a1a">load RX word 24+4i, +1 per byte, store to TX word 24+4i</text>
<circle cx="530" cy="436" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="530" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">5</text>
<line x1="695" y1="496" x2="315" y2="496" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="342" y="479" width="190" height="14" fill="#fff"/>
<text x="437" y="490" text-anchor="middle" font-size="11" fill="#1a1a1a">load request word (system scope)</text>
<line x1="695" y1="524" x2="315" y2="524" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="342" y="507" width="190" height="14" fill="#fff"/>
<text x="437" y="518" text-anchor="middle" font-size="11" fill="#1a1a1a">store word into TX slot</text>
<rect x="530" y="560" width="330" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="695.0" y="576.0" text-anchor="middle" font-size="11" fill="#1a1a1a">fan-in</text>
<circle cx="530" cy="560" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="530" y="564" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">6</text>
<line x1="600" y1="622" x2="410" y2="622" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="445.0" y="605" width="150" height="14" fill="#fff"/>
<text x="520" y="616" text-anchor="middle" font-size="11" fill="#1a1a1a">fence + release done.seq</text>
<circle cx="418" cy="612" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="418" y="616" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">7</text>
<rect x="302" y="640" width="215" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="409.5" y="656.0" text-anchor="middle" font-size="11" fill="#1a1a1a">handler sees done.seq, writes the</text>
<text x="409.5" y="670.0" text-anchor="middle" font-size="11" fill="#1a1a1a">RPCResponse header only</text>
<line x1="410" y1="708" x2="245" y2="708" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="298.5" y="691" width="59" height="14" fill="#fff"/>
<text x="328" y="702" text-anchor="middle" font-size="11" fill="#1a1a1a">post SEND</text>
<circle cx="284" cy="698" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="284" y="702" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">8</text>
<line x1="245" y1="752" x2="80" y2="752" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="108.0" y="735" width="108" height="14" fill="#fff"/>
<text x="162" y="746" text-anchor="middle" font-size="11" fill="#1a1a1a">reply on the wire</text>
<circle cx="94" cy="742" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="94" y="746" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">9</text>
<line x1="14" y1="802" x2="886" y2="802" stroke="#ccc"/>
<circle cx="34" cy="820" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="824" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">1</text>
<text x="56" y="824" text-anchor="start" font-size="12" fill="#1a1a1a">FPGA sends the request (a WRITE into bridge RX ring slot N). The payload can be kilobytes.</text>
<circle cx="34" cy="844" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="848" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">2</text>
<text x="56" y="848" text-anchor="start" font-size="12" fill="#1a1a1a">The bridge lands the request in the ring slot and posts a completion. The CPU dispatch thread, polling the</text>
<text x="56" y="862" text-anchor="start" font-size="12" fill="#1a1a1a">completion in the unified host loop, sees it, validates the RPC header, resolves rpc_increment in the</text>
<text x="56" y="876" text-anchor="start" font-size="12" fill="#1a1a1a">function table and calls the HOST_CALL handler with the RX and TX slots.</text>
<circle cx="34" cy="896" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="900" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">3</text>
<text x="56" y="900" text-anchor="start" font-size="12" fill="#1a1a1a">Handler: computes N from the RX slot pointer and stride (and checks the TX slot is slot N too), clamps</text>
<text x="56" y="914" text-anchor="start" font-size="12" fill="#1a1a1a">arg_len to what fits after the headers, packs slot and length into one 64-bit word, writes it into the mailbox</text>
<text x="56" y="928" text-anchor="start" font-size="12" fill="#1a1a1a">through the gdrcopy mapping, then writes seq last. It touches no payload byte.</text>
<circle cx="34" cy="948" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="952" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">4</text>
<text x="56" y="952" text-anchor="start" font-size="12" fill="#1a1a1a">GPU: thread 0 of every block polls the mailbox (local device memory), sees the new seq and unpacks slot, len.</text>
<circle cx="34" cy="972" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="976" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">5</text>
<text x="56" y="976" text-anchor="start" font-size="12" fill="#1a1a1a">Whole grid: thread i, stepping by the grid size, reads 32-bit request word 24+4i from the RX slot with a system-</text>
<text x="56" y="990" text-anchor="start" font-size="12" fill="#1a1a1a">scope load (host memory, dashed arrow), adds 1 to each of its bytes and stores it to word 24+4i of the TX slot.</text>
<text x="56" y="1004" text-anchor="start" font-size="12" fill="#1a1a1a">The GPU reads no header; the CPU already validated it and passed the length.</text>
<circle cx="34" cy="1024" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1028" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">6</text>
<text x="56" y="1028" text-anchor="start" font-size="12" fill="#1a1a1a">Fan-in: each block checks in once its TX stores are done; the last one to do so carries on, nobody waits.</text>
<circle cx="34" cy="1048" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1052" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">7</text>
<text x="56" y="1052" text-anchor="start" font-size="12" fill="#1a1a1a">The last arriver executes a system-scope fence, then a release store of done.seq.</text>
<circle cx="34" cy="1072" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1076" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">8</text>
<text x="56" y="1076" text-anchor="start" font-size="12" fill="#1a1a1a">The CPU handler sees done.seq and writes only the RPCResponse header (magic, status, result_len, request_id,</text>
<text x="56" y="1090" text-anchor="start" font-size="12" fill="#1a1a1a">ptp_timestamp). The transport posts the SEND from the TX slot.</text>
<circle cx="34" cy="1110" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1114" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">9</text>
<text x="56" y="1114" text-anchor="start" font-size="12" fill="#1a1a1a">The reply goes out on the wire to the FPGA.</text>
</svg>
