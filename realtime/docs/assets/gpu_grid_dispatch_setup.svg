<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1148" width="900" height="1148" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="gpu_grid_dispatch: setup, serve and shutdown">
<title>gpu_grid_dispatch: setup, serve and shutdown</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect width="900" height="1148" fill="#fff"/>
<line x1="80" y1="80" x2="80" y2="742" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="245" y1="80" x2="245" y2="742" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="410" y1="80" x2="410" y2="742" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="695" y1="80" x2="695" y2="742" stroke="#bbb" stroke-width="1" stroke-dasharray="3 5"/>
<line x1="22" y1="80" x2="22" y2="742" stroke="#555" stroke-width="1.2" marker-end="url(#ah)"/>
<text transform="translate(14,411) rotate(-90)" text-anchor="middle" font-size="10" fill="#1a1a1a">time</text>
<rect x="20" y="14" width="120" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="80" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">FPGA / emulator</text>
<rect x="175" y="14" width="140" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="245" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">NIC on the host</text>
<rect x="330" y="14" width="160" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="410" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">CPU (main thread)</text>
<rect x="520" y="14" width="350" height="34" rx="5" fill="#fff" stroke="#888" stroke-width="1.5"/>
<text x="695" y="36" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GPU grid</text>
<rect x="280" y="104" width="260" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="410" y="120" text-anchor="middle" font-size="11" fill="#1a1a1a">allocate mailbox, done line, shutdown flag,</text>
<text x="410" y="134" text-anchor="middle" font-size="11" fill="#1a1a1a">per-block SM ids</text>
<circle cx="280" cy="104" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="280" y="108" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">1</text>
<rect x="280" y="164" width="260" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="410" y="180" text-anchor="middle" font-size="11" fill="#1a1a1a">gdrcopy: gdr_pin_buffer + gdr_map the mailbox</text>
<text x="410" y="194" text-anchor="middle" font-size="11" fill="#1a1a1a">(notify=gdrcopy only)</text>
<circle cx="280" cy="164" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="280" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">2</text>
<rect x="280" y="224" width="260" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="410" y="240" text-anchor="middle" font-size="11" fill="#1a1a1a">cudaFuncSetAttribute: dynamic shared memory</text>
<text x="410" y="254" text-anchor="middle" font-size="11" fill="#1a1a1a">just over half an SM (one block per SM)</text>
<circle cx="280" cy="224" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="280" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">3</text>
<rect x="280" y="284" width="260" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="410" y="300" text-anchor="middle" font-size="11" fill="#1a1a1a">create + start dispatcher, cpu_roce bridge</text>
<text x="410" y="314" text-anchor="middle" font-size="11" fill="#1a1a1a">--qp_config=hsb_fpga --peer-ip --remote-qp</text>
<circle cx="280" cy="284" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="280" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">4</text>
<line x1="410" y1="362" x2="695" y2="362" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="468" y="345" width="169" height="14" fill="#fff"/>
<text x="552" y="356" text-anchor="middle" font-size="11" fill="#1a1a1a">cudaLaunchCooperativeKernel</text>
<circle cx="454" cy="352" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="454" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">5</text>
<line x1="695" y1="396" x2="410" y2="396" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="520" y="379" width="65" height="14" fill="#fff"/>
<text x="552" y="390" text-anchor="middle" font-size="11" fill="#1a1a1a">ready word</text>
<circle cx="506" cy="386" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="506" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">6</text>
<line x1="410" y1="430" x2="80" y2="430" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="167" y="413" width="156" height="14" fill="#fff"/>
<text x="245" y="424" text-anchor="middle" font-size="11" fill="#1a1a1a">READY qp rkey buffer_addr</text>
<circle cx="152" cy="420" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="152" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">7</text>
<rect x="35" y="456" width="150" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="110" y="472" text-anchor="middle" font-size="11" fill="#1a1a1a">orchestration programs</text>
<text x="110" y="486" text-anchor="middle" font-size="11" fill="#1a1a1a">the FPGA / emulator</text>
<circle cx="35" cy="456" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="35" y="460" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">8</text>
<line x1="80" y1="528" x2="410" y2="528" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="176" y="511" width="138" height="14" fill="#fff"/>
<text x="245" y="522" text-anchor="middle" font-size="11" fill="#1a1a1a">connect, requests flow</text>
<circle cx="161" cy="518" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="161" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">9</text>
<rect x="280" y="550" width="260" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="410" y="566" text-anchor="middle" font-size="11" fill="#1a1a1a">serve until timeout or Ctrl-C</text>
<circle cx="280" cy="550" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="280" y="554" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">10</text>
<line x1="410" y1="614" x2="695" y2="614" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="493" y="597" width="120" height="14" fill="#fff"/>
<text x="552" y="608" text-anchor="middle" font-size="11" fill="#1a1a1a">raise shutdown flag</text>
<circle cx="478" cy="604" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="478" y="608" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">11</text>
<rect x="595" y="630" width="200" height="24" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="695" y="646" text-anchor="middle" font-size="11" fill="#1a1a1a">grid exits</text>
<rect x="280" y="676" width="260" height="38" rx="4" fill="#fff" stroke="#888" stroke-width="1.3"/>
<text x="410" y="692" text-anchor="middle" font-size="11" fill="#1a1a1a">print requests served</text>
<text x="410" y="706" text-anchor="middle" font-size="11" fill="#1a1a1a">and block placement</text>
<circle cx="280" cy="676" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="280" y="680" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">12</text>
<line x1="14" y1="754" x2="886" y2="754" stroke="#ccc"/>
<circle cx="34" cy="768" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="772" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">1</text>
<text x="56" y="772" font-size="12" fill="#1a1a1a">Allocate the mailbox, the done line and the shutdown flag (mapped pinned host memory, except a gdrcopy mailbox,</text>
<text x="56" y="786" font-size="12" fill="#1a1a1a">which is device memory) and the per-block SM id array. Every CUDA allocation happens before the grid is</text>
<text x="56" y="800" font-size="12" fill="#1a1a1a">launched.</text>
<circle cx="34" cy="820" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="824" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">2</text>
<text x="56" y="824" font-size="12" fill="#1a1a1a">With notify=gdrcopy, pin the mailbox with gdr_pin_buffer and map it into the CPU address space with gdr_map.</text>
<circle cx="34" cy="844" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="848" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">3</text>
<text x="56" y="848" font-size="12" fill="#1a1a1a">Set the maximum dynamic shared memory attribute of the kernel so every block reserves just over half an SM's</text>
<text x="56" y="862" font-size="12" fill="#1a1a1a">shared memory, which forces one block per SM.</text>
<circle cx="34" cy="882" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="886" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">4</text>
<text x="56" y="886" font-size="12" fill="#1a1a1a">Create the dispatcher with the cpu_roce bridge (--qp_config=hsb_fpga --peer-ip --remote-qp; --unified is added</text>
<text x="56" y="900" font-size="12" fill="#1a1a1a">automatically), register the HOST_CALL handler and start it.</text>
<circle cx="34" cy="920" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="924" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">5</text>
<text x="56" y="924" font-size="12" fill="#1a1a1a">Only now launch the grid, once, with cudaLaunchCooperativeKernel. Every block starts polling.</text>
<circle cx="34" cy="944" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="948" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">6</text>
<text x="56" y="948" font-size="12" fill="#1a1a1a">The grid raises its ready word once every block is resident, and the CPU waits for it.</text>
<circle cx="34" cy="968" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="972" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">7</text>
<text x="56" y="972" font-size="12" fill="#1a1a1a">Print CUDAQ_REALTIME_SERVER_READY &lt;bridge endpoint: qp, rkey, buffer_addr&gt; notify=... poll=... request=..., before</text>
<text x="56" y="986" font-size="12" fill="#1a1a1a">connecting.</text>
<circle cx="34" cy="1006" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1010" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">8</text>
<text x="56" y="1010" font-size="12" fill="#1a1a1a">The orchestration script reads the READY line and programs the FPGA (or the emulator and playback tool) with qp,</text>
<text x="56" y="1024" font-size="12" fill="#1a1a1a">rkey and buffer_addr.</text>
<circle cx="34" cy="1044" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1048" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">9</text>
<text x="56" y="1048" font-size="12" fill="#1a1a1a">The transport connects and requests start to flow.</text>
<circle cx="34" cy="1068" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1072" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">10</text>
<text x="56" y="1072" font-size="12" fill="#1a1a1a">Serve until --timeout expires or Ctrl-C.</text>
<circle cx="34" cy="1092" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1096" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">11</text>
<text x="56" y="1096" font-size="12" fill="#1a1a1a">Shutdown: stop the dispatcher, then raise the grid's shutdown flag; the grid exits.</text>
<circle cx="34" cy="1116" r="12" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="34" y="1120" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">12</text>
<text x="56" y="1120" font-size="12" fill="#1a1a1a">Print the number of requests served (abandoned at shutdown, bad replies) and the block placement.</text>
</svg>
