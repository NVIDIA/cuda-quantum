<title id="t">Relay BP reaction time versus shot length</title><desc id="d">Three panels, d=3, 5 and 7: Relay BP completion-tail p99 against SERs per shot on a GB200 with physical FPGA input, monolithic versus inside the parallel-window decoder; lines are medians of three trials and bands span all three. d=3 monolithic: median 6.4 ms at 1,000 SERs, 28.6 ms at 10,000 SERs; d=3 parallel window: median 1.1 ms at 1,000 SERs, 1.5 ms at 10,000 SERs; d=5 monolithic: median 14.0 ms at 1,000 SERs, 101.1 ms at 8,000 SERs; d=5 parallel window: median 1.4 ms at 1,000 SERs, 1.4 ms at 8,000 SERs; d=7 monolithic: median 24.4 ms at 1,000 SERs, 106.1 ms at 4,000 SERs; d=7 parallel window: median 1.4 ms at 1,000 SERs, 2.4 ms at 4,000 SERs.</desc>
