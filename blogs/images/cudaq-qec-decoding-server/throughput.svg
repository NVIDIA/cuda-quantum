<text x="410.0" y="662.0" font-family="'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9aa19a" font-weight="400" text-anchor="middle">Windows in flight</text>
<text x="44.0" y="371.0" font-family="'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#9aa19a" font-weight="400" text-anchor="middle" transform="rotate(-90 44.0 371.0)">SER rate the server sustains</text>
