<text x="260.7" y="460.4" font-family="'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#eceeea" font-weight="600" text-anchor="start">Relay BP, one GPU</text>
<text x="260.7" y="483.4" font-family="'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9aa19a" font-weight="400" text-anchor="start">kept up at 3.2 kHz</text>
<text x="607.3" y="262.3" font-family="'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#eceeea" font-weight="600" text-anchor="start">PyMatching</text>
<text x="607.3" y="285.3" font-family="'NVIDIA Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#9aa19a" font-weight="400" text-anchor="start">kept up at 157 kHz</text>
