<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 600" width="1700" height="600" role="img" aria-labelledby="t d">
<title id="t">CUDA-Q QEC Decoding Server architecture</title><desc id="d">A quantum controller or the playback emulator sends syndromes over NVQLink, using RoCE through the Holoscan Sensor Bridge, the Quantum Machines OPNIC, UDP, or the control system's own network stack, to the decoding_server process, which routes them through a decoding task graph with parallel windows to decoders such as PyMatching, Chromobius, the NVIDIA Ising predecoder, BP+OSD, Relay BP, TCBP+JOBS, and the sliding-window and parallel-window decoders, and returns corrections and logical results. The server, task graph, and decoders ship in the cudaq-decoding container.</desc>
