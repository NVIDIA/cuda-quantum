<title id="t">17-qubit surface-code quantum system (after Krinner et al., 2022)</title><desc id="d">Layout of the 17-qubit distance-3 surface-code processor from Krinner et al.: nine data qubits, four Z ancillas and four X ancillas joined by 24 couplers, with a panel listing the modeled physics and the GPU lowering path.</desc>
