  <title id="t">T1 estimate after each adaptive shot</title>
  <desc id="d">Simulated T1 estimate over 50 adaptive shots. A shaded band, the uncertainty of a single run’s estimate, narrows from about 97 to 328 microseconds around the starting guess of 150 microseconds to about 122 to 212 microseconds around the true T1 of 160 microseconds in the model. Five individual runs are drawn as thin lines. On the right, a histogram of the final estimates of 400 runs, with brackets comparing the simulated median of 155 microseconds and 68 percent range of 123 to 195 microseconds with Berritta et al.’s 159 microseconds and 68 percent interval of 131 to 202 microseconds.</desc>
