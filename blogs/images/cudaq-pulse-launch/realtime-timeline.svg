<title id="t">A real-time classical call during quantum runtime</title><desc id="d">Timeline of one shot: a readout produces m, which is submitted to a classical decode function. The answer, or the raw outcome if the answer misses the timeout, conditions a drive pulse. A second function chooses a runtime wait length before sync and a second readout.</desc>
