<text x="492" y="360" font-size="11" text-anchor="end" fill="#ea580c" opacity="0.8" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;">phys</text>
<text x="58" y="380" font-size="10.5" fill="#334155">Which carriers and timed events physically realize it?</text>
<text x="58" y="396" font-size="10.5" fill="#64748b">resources · native events · routing · schedule</text>
