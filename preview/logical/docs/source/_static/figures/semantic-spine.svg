<text x="492" y="152" font-size="11" text-anchor="end" fill="#0d9488" opacity="0.8" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;">lvm</text>
<text x="58" y="172" font-size="10.5" fill="#334155">Where may each logical owner reside?</text>
<text x="58" y="188" font-size="10.5" fill="#64748b">spaces · residency · support · communication · witness</text>
