<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1060 455" role="img" aria-label="The four-stage semantic spine and its facets">
