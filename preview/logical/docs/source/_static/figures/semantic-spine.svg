<rect x="40" y="26" width="460" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<rect x="40" y="26" width="6" height="78" rx="3" fill="#2563eb"/>
<text x="58" y="48" font-size="13.5" font-weight="750" fill="#2563eb">P0 — unplaced logical</text>
<text x="492" y="48" font-size="11" text-anchor="end" fill="#2563eb" opacity="0.8" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;">qlx</text>
<text x="58" y="68" font-size="10.5" fill="#334155">What logical computation is requested?</text>
<text x="58" y="84" font-size="10.5" fill="#64748b">linear values · typed actions · resources · structured control</text>
<line x1="270" y1="104" x2="270" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="282" y="121" font-size="10.5" fill="#64748b" font-style="italic">logical placement + support</text>
<rect x="40" y="130" width="460" height="78" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
