<text x="492" y="256" font-size="11" text-anchor="end" fill="#7c3aed" opacity="0.8" style="font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;">fabric</text>
<text x="58" y="276" font-size="10.5" fill="#334155">Which code, gadgets, and protocols realize it — at what cost?</text>
<text x="58" y="292" font-size="10.5" fill="#64748b">codes · encodings · gadgets · protocols · patch graph</text>
