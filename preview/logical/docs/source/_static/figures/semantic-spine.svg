<text x="590" y="174" font-size="10.4" fill="#9d174d">· protocol_network</text>
<text x="590" y="202" font-size="10.4" fill="#9d174d">· patch_graph · patch_mapping</text>
<text x="590" y="230" font-size="10.4" fill="#9d174d">· carrier_mapping</text>
<text x="590" y="258" font-size="10.4" fill="#9d174d">· physical_routing</text>
<text x="590" y="286" font-size="10.4" fill="#9d174d">· native_legalization</text>
<text x="590" y="314" font-size="10.4" fill="#9d174d">· physical_schedule</text>
<text x="590" y="338" font-size="10.4" fill="#9d174d">· estimates — typed results</text>
