<text x="930" y="84" font-size="12" text-anchor="middle" font-weight="800" fill="#16a34a">ESTIMATE / EMIT</text>
<text x="930" y="100" font-size="9.5" text-anchor="middle" fill="#64748b" font-style="italic">read verified artifacts</text>
<text x="846" y="132" font-size="10.5" fill="#166534">· LOGICAL → P0 profile</text>
<text x="846" y="160" font-size="10.5" fill="#166534">· STATIC → P2 counts</text>
<text x="846" y="188" font-size="10.5" fill="#166534">· ANALYTICAL → model</text>
<text x="846" y="216" font-size="10.5" fill="#166534">· SCHEDULE → P3 timing</text>
<text x="846" y="256" font-size="10.5" fill="#166534">targets expose available</text>
<text x="846" y="278" font-size="10.5" fill="#166534">tiers as annotations</text>
